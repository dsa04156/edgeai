name: Platform verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: bash scripts/bootstrap.sh
      - run: bash scripts/preflight.sh local
      - name: Verify recovery Kubernetes inventory classification and list boundaries
        run: python3 scripts/test-recovery-kubernetes.py
      - name: Verify conservative producer termination evidence and recovery ownership
        run: python3 scripts/test-recovery-stop.py
      - name: Verify bounded stream failure evidence without response bodies
        run: python3 scripts/test-stream-failure-evidence.py
      - name: Verify native Runner provenance and immutable platform image checks
        run: bash scripts/collect-evidence.sh runner-images python3 scripts/test-runner-images.py
      - name: Verify encrypted private material backup and isolated restore
        run: |
          bash scripts/install-age.sh
          bash scripts/collect-evidence.sh private-material bash scripts/test-private-material.sh --report docs/evidence/runs/private-material-report.json
      - name: Verify consistent encrypted Device journals and quarantined source restoration
        run: bash scripts/collect-evidence.sh device-journal bash scripts/test-device-journal.sh --report docs/evidence/runs/device-journal-report.json
      - name: Verify durable original Device retirement and final snapshot preservation
        run: bash scripts/collect-evidence.sh device-source-retirement bash scripts/test-device-source-retirement.sh --report docs/evidence/runs/device-source-retirement-report.json
      - run: bash scripts/dev-up.sh
      - name: Verify real TLS broker authority and revocation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto postgresql-client
          python3 -m venv .tools/stream-venv
          .tools/stream-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r runner/requirements-stream.txt
          export EDGEAI_STREAM_PYTHON="$PWD/.tools/stream-venv/bin/python"
          bash scripts/collect-evidence.sh stream-broker bash scripts/test-stream-broker.sh
      - run: bash scripts/collect-evidence.sh infra bash scripts/test-infra.sh
      - run: pnpm --filter @edgeai/dashboard exec playwright install --with-deps chromium
      - run: bash scripts/verify-all.sh scaffold
      - run: bash scripts/collect-evidence.sh postgres bash scripts/test-integration.sh
      - name: Verify PostgreSQL → Spring → Next.js
        run: bash scripts/collect-evidence.sh health bash scripts/test-profiles-stack.sh compose
      - name: Verify load measurement and acceptance classification
        run: bash scripts/collect-evidence.sh load-acceptance bash scripts/test-load-acceptance.sh
      - name: Verify PostgreSQL backup and isolated restore with matching container clients
        run: bash scripts/collect-evidence.sh postgres-backup bash scripts/test-postgres-backup.sh --transport compose --report docs/evidence/runs/postgres-backup-report.json
      - name: Verify real management audit admission failure, result failure and restart
        run: bash scripts/collect-evidence.sh management-audit bash scripts/test-management-audit.sh --transport compose --report docs/evidence/runs/management-audit-report.json
      - name: Verify source database connection fencing and unrelated database preservation
        run: bash scripts/collect-evidence.sh recovery-database-fence bash scripts/test-recovery-database-fence.sh --transport compose --report docs/evidence/runs/recovery-database-fence-report.json
      - name: Verify broker controller retirement and durable principal fencing with real TLS
        env:
          EDGEAI_STREAM_PYTHON: .tools/stream-venv/bin/python
        run: bash scripts/collect-evidence.sh recovery-mqtt-fence bash scripts/test-recovery-mqtt-fence.sh --report docs/evidence/runs/recovery-mqtt-fence-report.json
      - name: Verify restored Remote allocations against fenced provider history with real TLS
        run: bash scripts/collect-evidence.sh recovery-remote-inventory bash scripts/test-recovery-remote-inventory.sh --transport compose --report docs/evidence/runs/recovery-remote-inventory-report.json
      - name: Stop test services and retain volumes
        if: always()
        run: bash scripts/dev-down.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: platform-verification-${{ github.run_id }}
          path: |
            docs/evidence/runs/
            backend/app/build/test-results/
            dashboard/test-results/
          retention-days: 14
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      minio_digest: ${{ steps.publish.outputs.minio_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: bash scripts/bootstrap.sh
      - name: Build and start the official MinIO source
        run: bash scripts/collect-evidence.sh storage-start bash scripts/dev-storage.sh
      - name: Verify authenticated artifact roundtrip
        run: bash scripts/collect-evidence.sh storage bash scripts/test-storage.sh
      - name: Verify immutable artifact versions and content checksums
        run: bash scripts/collect-evidence.sh runtime-storage bash scripts/test-runtime-storage.sh
      - name: Verify version-preserving backup with the built MinIO binary and real TLS
        run: |
          mkdir -p .tools
          backup_tools_container=$(docker create edgeai-dev-minio)
          trap 'docker rm "$backup_tools_container" >/dev/null' EXIT
          docker cp "$backup_tools_container:/usr/local/bin/minio" .tools/minio-backup-tested
          bash scripts/install-minio-client.sh
          bash scripts/collect-evidence.sh storage-backup bash scripts/test-storage-backup.sh --minio-binary .tools/minio-backup-tested --report docs/evidence/runs/storage-backup-report.json
      - name: Verify S3 root fencing, admitted request drain and retained versions
        run: bash scripts/collect-evidence.sh recovery-storage-fence bash scripts/test-recovery-storage-fence.sh --minio-binary .tools/minio-backup-tested --report docs/evidence/runs/recovery-storage-fence-report.json
      - name: Start PostgreSQL for real storage-to-result transactions
        run: bash scripts/dev-up.sh
      - name: Verify restored database references with independent TLS backup storage
        run: bash scripts/collect-evidence.sh recovery-references bash scripts/test-recovery-references.sh --transport compose --minio-binary .tools/minio-backup-tested --report docs/evidence/runs/recovery-references-report.json
      - name: Verify Remote retirement and retain a private output bundle for storage verification
        run: bash scripts/collect-evidence.sh recovery-remote-retire bash scripts/test-recovery-remote-retire.sh --transport compose --bundle-output .tools/recovery-remote-ci-input --report docs/evidence/runs/recovery-remote-retire-report.json
      - name: Verify recovery output publication and pinned versions with the tested MinIO binary
        run: bash scripts/collect-evidence.sh recovery-remote-storage bash scripts/test-recovery-remote-storage.sh --bundle .tools/recovery-remote-ci-input --minio-binary .tools/minio-backup-tested --report docs/evidence/runs/recovery-remote-storage-report.json
      - name: Verify recovered Remote Result transactions with original sources offline
        run: bash scripts/collect-evidence.sh recovery-remote-results bash scripts/test-recovery-remote-results.sh --transport compose --minio-binary .tools/minio-backup-tested --report docs/evidence/runs/recovery-remote-results-report.json
      - name: Verify recovered Remote failure, cancellation and original retry budgets
        run: bash scripts/collect-evidence.sh recovery-remote-failures bash scripts/test-recovery-remote-failures.sh --transport compose --report docs/evidence/runs/recovery-remote-failures-report.json
      - name: Prepare real stream broker and SDK for storage completion tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto mosquitto-clients
          python3 -m venv .tools/stream-venv
          .tools/stream-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r runner/requirements-stream.txt
      - name: Verify real S3 content and atomic PostgreSQL Result commit
        env:
          EDGEAI_STREAM_PYTHON: ${{ github.workspace }}/.tools/stream-venv/bin/python
        run: bash scripts/collect-evidence.sh runtime-results bash scripts/test-runtime-results.sh
      - name: Verify restored Device journals, fixed checkpoint bytes and retired original broker authority
        env:
          EDGEAI_STREAM_PYTHON: ${{ github.workspace }}/.tools/stream-venv/bin/python
        run: |
          bash scripts/install-age.sh
          bash scripts/collect-evidence.sh recovery-device-journal bash scripts/test-recovery-device-journal.sh --transport compose --verify-authority --retire-routes --minio-binary .tools/minio-backup-tested --report docs/evidence/runs/recovery-device-journal-report.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested storage image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MINIO_IMAGE: ghcr.io/dsa04156/edgeai-minio:sha-${{ github.sha }}
        run: |
          docker tag edgeai-dev-minio "$MINIO_IMAGE"
          docker push "$MINIO_IMAGE"
          ref=$(docker inspect "$MINIO_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "minio_digest=${ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Stop project storage
        if: always()
        run: bash scripts/dev-down.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: m0-storage-${{ github.run_id }}
          path: docs/evidence/runs/
          retention-days: 14
  runner-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            host: ubuntu-24.04
          - architecture: arm64
            host: ubuntu-24.04-arm
    runs-on: ${{ matrix.host }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the reference Runner image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f runner/Dockerfile -t edgeai-runner:verify .
      - name: Verify actual container execution and protocol failures
        env:
          EDGEAI_RUNNER_IMAGE: edgeai-runner:verify
        run: bash scripts/collect-evidence.sh runner-container bash scripts/test-runner.sh
      - name: Prepare isolated MQTT integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto
          python3 -m venv .tools/stream-venv
          .tools/stream-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r runner/requirements-stream.txt
      - name: Verify actual multi-source MQTT, journal recovery, ACL and TLS
        env:
          EDGEAI_STREAM_PYTHON: .tools/stream-venv/bin/python
        run: bash scripts/collect-evidence.sh stream-mqtt bash scripts/test-stream.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested reference Runner
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUNNER_IMAGE: ghcr.io/dsa04156/edgeai-runner:sha-${{ github.sha }}-${{ matrix.architecture }}
        run: |
          docker tag edgeai-runner:verify "$RUNNER_IMAGE"
          docker push "$RUNNER_IMAGE"
      - name: Record the native host, actual container, tests and published platform
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          published=()
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then published=(--published); fi
          python3 scripts/runner_platform.py native --architecture "$TARGET_ARCHITECTURE" --revision "$GITHUB_SHA" --output .tools/runner-platform.json "${published[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runner-verification-${{ github.run_id }}-${{ matrix.architecture }}
          path: |
            docs/evidence/runs/
            .tools/runner-platform.json
          include-hidden-files: true
          retention-days: 14
  runner:
    needs: [runner-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      runner_digest: ${{ steps.publish.outputs.runner_digest }}
      runner_platform_digests: ${{ steps.publish.outputs.runner_platform_digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: runner-verification-${{ github.run_id }}-*
          path: .tools/native-runners
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and re-read the index containing only the two tested native images
        id: publish
        run: python3 scripts/runner_platform.py publish --directory .tools/native-runners --revision "$GITHUB_SHA" --output .tools/runner-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runner-index-${{ github.run_id }}
          path: .tools/runner-index.json
          include-hidden-files: true
          retention-days: 14
  images:
    needs: [scaffold, storage, runner]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Run 37234177387 reached the former 55m job cap at STREAM recovery case 42/44.
    # Keep each acceptance command bounded; allow the full suite and cleanup to finish.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.publish.outputs.api_digest }}
      dashboard_digest: ${{ steps.publish.outputs.dashboard_digest }}
    env:
      EDGEAI_API_IMAGE: ghcr.io/dsa04156/edgeai-api:sha-${{ github.sha }}
      EDGEAI_DASHBOARD_IMAGE: ghcr.io/dsa04156/edgeai-dashboard:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.EDGEAI_API_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/dsa04156/edgeai
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build dashboard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.EDGEAI_DASHBOARD_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/dsa04156/edgeai
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Generate isolated image-test credentials
        run: |
          python3 - <<'PY'
          import os,secrets
          with os.fdopen(os.open('.env', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600), 'w') as file:
              file.write('EDGEAI_API_USER=edgeai\n')
              file.write('EDGEAI_DB_NAME=edgeai\nEDGEAI_DB_USER=edgeai\nEDGEAI_DB_HOST=127.0.0.1\nEDGEAI_DB_PORT=15432\nEDGEAI_MINIO_USER=edgeai\n')
              for key in ['EDGEAI_API_PASSWORD', 'EDGEAI_DB_PASSWORD', 'EDGEAI_MINIO_PASSWORD']:
                  file.write(key + '=' + secrets.token_hex(24) + '\n')
          PY
      - name: Verify built containers against a real database
        run: bash scripts/collect-evidence.sh images bash scripts/test-images.sh
      - name: Prepare restored-database recovery fixtures from the exact built API
        run: |
          source scripts/lib.sh
          load_env
          recovery_container=$(docker create --network none "$EDGEAI_API_IMAGE")
          trap 'docker rm "$recovery_container" >/dev/null' EXIT
          mkdir -p backend/app/build/libs
          docker cp "$recovery_container:/app/app.jar" backend/app/build/libs/edgeai-control-plane.jar
          compose up -d --wait postgres
      - name: Prepare recovery storage from the exact verified MinIO image
        env:
          RECOVERY_MINIO_IMAGE: ghcr.io/dsa04156/edgeai-minio@${{ needs.storage.outputs.minio_digest }}
        run: |
          mkdir -p .tools
          recovery_storage_container=$(docker create --network none "$RECOVERY_MINIO_IMAGE")
          trap 'docker rm "$recovery_storage_container" >/dev/null' EXIT
          docker cp "$recovery_storage_container:/usr/local/bin/minio" .tools/minio-recovery-tested
          bash scripts/install-minio-client.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install artifact verification client
        run: pnpm install --frozen-lockfile
      - name: Prepare native TLS broker credentials for the Kubernetes stream gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mosquitto
          python3 -m venv .tools/stream-venv
          .tools/stream-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r runner/requirements-stream.txt
      - name: Verify actual Kubernetes Runner and recovery before publishing API images
        env:
          EDGEAI_RUNNER_DIGEST: ${{ needs.runner.outputs.runner_digest }}
          EDGEAI_MINIO_DIGEST: ${{ needs.storage.outputs.minio_digest }}
        run: bash scripts/collect-evidence.sh kind bash scripts/test-kind.sh
      - name: Stop isolated recovery fixture database and retain volumes
        if: always()
        run: bash scripts/dev-down.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images
        id: publish
        run: |
          docker push "$EDGEAI_API_IMAGE"
          docker push "$EDGEAI_DASHBOARD_IMAGE"
          api_ref=$(docker inspect "$EDGEAI_API_IMAGE" --format '{{index .RepoDigests 0}}')
          dashboard_ref=$(docker inspect "$EDGEAI_DASHBOARD_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "api_digest=${api_ref##*@}" >> "$GITHUB_OUTPUT"
          echo "dashboard_digest=${dashboard_ref##*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-verification-${{ github.run_id }}
          path: |
            docs/evidence/runs/
            .tools/kind-runtime.json
            .tools/kind-vd.json
            .tools/kind-mixed-remote.json
            .tools/kind-stream.json
            .tools/kind-stream-broker.json
            .tools/kind-stream-minio-tls.json
            .tools/kind-multidevice-demo.json
            .tools/kind-recovery-stop.json
            .tools/kind-recovery-kubernetes-retire.json
            .tools/kind-recovery-kubernetes-results.json
            .tools/kind-recovery-vd-results.json
            .tools/kind-recovery-stream-kubernetes-results.json
            .tools/kind-recovery-stream-vd-results.json
            .tools/kind-recovery-stream-finalizer-kubernetes-results.json
            .tools/kind-recovery-stream-finalizer-vd-results.json
            .tools/kind-recovery-stream-workflows.json
          include-hidden-files: true
          retention-days: 14
  gitops:
    needs: [images, storage, runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Record tested digests for ArgoCD
        env:
          VERIFIED_REVISION: ${{ github.sha }}
          API_DIGEST: ${{ needs.images.outputs.api_digest }}
          DASHBOARD_DIGEST: ${{ needs.images.outputs.dashboard_digest }}
          RUNNER_DIGEST: ${{ needs.runner.outputs.runner_digest }}
          RUNNER_PLATFORM_DIGESTS: ${{ needs.runner.outputs.runner_platform_digests }}
          MINIO_DIGEST: ${{ needs.storage.outputs.minio_digest }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_REVISION" ]; then
            echo 'A newer main revision exists; leaving deployment pins for its pipeline.'
            exit 0
          fi
          python3 scripts/update-images.py --revision "$VERIFIED_REVISION" --api "$API_DIGEST" --dashboard "$DASHBOARD_DIGEST" --runner "$RUNNER_DIGEST" --runner-platform-digests "$RUNNER_PLATFORM_DIGESTS" --minio "$MINIO_DIGEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/kubernetes/overlays/dev/kustomization.yaml deploy/kubernetes/overlays/dev/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: pin verified images for $VERIFIED_REVISION [skip ci]"
          git push origin HEAD:main

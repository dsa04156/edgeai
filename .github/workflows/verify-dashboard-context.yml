name: Verify dashboard build context
on:
  push:
    branches:
      - verify/ci-kubeedge-build-context
permissions:
  contents: read
jobs:
  dashboard-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4f13425acb02112cc2bcb12307921706bd8236c0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the exact fixed dashboard image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: edgeai-dashboard:ci-context-verification
          cache-from: type=gha,scope=dashboard

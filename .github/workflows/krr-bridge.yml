name: KRR bridge image
# Builds, tests and publishes the recommendation-only KRR bridge (profiling-bridge/) for 3-3 resource profiling.
# It never deploys: pin the published digest with scripts/internal/enable-resource-profiling.py and sync via GitOps.
on:
  push:
    branches: [main]
    paths:
      - profiling-bridge/**
      - backend/app/src/test/resources/resource-profiling/**
      - .github/workflows/krr-bridge.yml
  pull_request:
    paths:
      - profiling-bridge/**
      - .github/workflows/krr-bridge.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: krr-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dsa04156/edgeai-krr-bridge:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bridge unit tests (fake KRR replaying the recorded v1.31.1 report)
        run: python3 -m unittest discover -s profiling-bridge/tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build bridge image on the digest-pinned official KRR v1.31.1 base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: profiling-bridge
          file: profiling-bridge/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/dsa04156/edgeai
      - name: Verify the built image runs the bundled KRR and serves only the fixed API
        run: |
          set -euo pipefail
          # Upstream `krr version` prints "dev" in the image; the identity is the pinned base digest below.
          test "$(docker inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --read-only --tmpfs /tmp --entrypoint python "$IMAGE" -c 'import os, robusta_krr; assert os.getuid() == 10001'
          container=$(docker run -d --read-only --tmpfs /tmp -p 127.0.0.1:18471:8080 -e KRR_PROMETHEUS_URL=http://127.0.0.1:9 -e KRR_ALLOWED_NAMESPACES=edgeai "$IMAGE")
          trap 'docker logs "$container" >&2 || true; docker rm -f "$container" >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18471/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18471/healthz | grep -q '"krrImage":"robustadev/krr:v1.31.1@sha256:835bf3b6fec4d8f27d96d236a36542bd87bfcb4f12f3537f8dce7f886916ed9c"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"namespace":"kube-system","kind":"Deployment","name":"x","container":"x","historyHours":1}' http://127.0.0.1:18471/v1/recommendations)
          test "$code" = 400
          # Prometheus is unreachable here, so a valid request must report a failed run, never a recommendation.
          body=$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"namespace":"edgeai","kind":"Deployment","name":"x","container":"x","historyHours":1}' http://127.0.0.1:18471/v1/recommendations)
          echo "$body" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b["status"] in ("FAILED","TIMEOUT") and b["report"] is None, b'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image and record its digest
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          ref=$(docker inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "Published ${ref}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin: python3 scripts/internal/enable-resource-profiling.py --digest ${ref##*@}" >> "$GITHUB_STEP_SUMMARY"

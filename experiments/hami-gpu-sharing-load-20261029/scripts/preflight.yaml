# vLLM sm_120 + HAMi 사전 점검: 모델 준비 후 core 50 / gpumem 7680 상한에서 서버 기동
apiVersion: v1
kind: Pod
metadata: {name: vllm-preflight, namespace: hami-bench, labels: {exp: preflight}}
spec:
  restartPolicy: Never
  nodeSelector: {kubernetes.io/hostname: etri-ser0002-cgnmsb}
  containers:
  - name: vllm
    image: docker.io/vllm/vllm-openai:v0.11.0
    command: ["bash", "-c"]
    args:
    - |
      set -e
      M=/cache/models/Qwen2.5-0.5B-Instruct
      [ -f $M/config.json ] || python3 -c "import huggingface_hub as h; h.snapshot_download('Qwen/Qwen2.5-0.5B-Instruct', local_dir='$M')"
      nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv
      exec vllm serve $M --served-model-name qwen --port 8000 --gpu-memory-utilization 0.85 --max-model-len 2048
    env: [{name: GPU_CORE_UTILIZATION_POLICY, value: default}]
    resources:
      limits: {hami.io/vgpu: "1", nvidia.com/gpucores: "50", nvidia.com/gpumem: "7680"}
      requests: {cpu: "2", memory: "6Gi"}
    volumeMounts: [{name: c, mountPath: /cache}, {name: shm, mountPath: /dev/shm}]
  volumes:
  - {name: c, hostPath: {path: /var/tmp/hami-bench, type: DirectoryOrCreate}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}

apiVersion: v1
kind: Service
metadata:
  name: edgeai-api
spec:
  selector: {app: edgeai-api}
  ports:
    - {name: http, port: 18080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeai-api
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  # V7 changes required Attempt fields; do not overlap incompatible API writers.
  strategy: {type: Recreate}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: edgeai-api}
  template:
    metadata:
      labels: {app: edgeai-api}
    spec:
      serviceAccountName: edgeai-control-plane
      automountServiceAccountToken: true
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/dsa04156/edgeai-api:bootstrap
          ports: [{name: http, containerPort: 18080}]
          envFrom:
            - configMapRef: {name: edgeai-config}
            - secretRef: {name: edgeai-runtime}
            - secretRef: {name: edgeai-artifact-storage}
          env:
            - {name: EDGEAI_PROMETHEUS_ENABLED, value: 'true'}
            - {name: EDGEAI_PROMETHEUS_URL, value: 'http://prometheus-kube-prometheus-prometheus.kube-system.svc:9090'}
            - {name: EDGEAI_KUBE_ENABLED, value: 'true'}
            - {name: EDGEAI_INFRASTRUCTURE_SOURCE, value: api}
            - {name: EDGEAI_EDGEX_ENABLED, value: 'true'}
            - {name: EDGEAI_KUBE_API_URL, value: 'https://kubernetes.default.svc'}
            - {name: EDGEAI_KUBE_TOKEN_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/token}
            - {name: EDGEAI_KUBE_CA_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: runner-key, mountPath: /var/run/edgeai-controller, readOnly: true}
      volumes:
        - name: runner-key
          secret:
            secretName: edgeai-runner-signing
            defaultMode: 288
        - name: tmp
          emptyDir: {}

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Offload test console (docs/guides/offload-lab.md). List it AFTER components/hawkeye-video: the strategic merge
# replaces EDGEAI_RUNTIME_WORKFLOW_KEYS by name, keeping hawkeye-video-safety and adding only offload-lab.
# Image: runner/Dockerfile.offload-lab (COPY-only on the Runner index sha256:ed9a4c7d…), linux/amd64+arm64.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edgeai-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - {name: EDGEAI_RUNTIME_WORKFLOW_KEYS, value: 'hawkeye-video-safety,offload-lab'}
                  - {name: EDGEAI_OFFLOAD_LAB_LOAD_IMAGE, value: '10.254.192.47:5000/edgeai/offload-lab@sha256:bdbd7d9fa34edab47b142177db34bb2268d0392bb9a226b32ea42f93f145d146'}

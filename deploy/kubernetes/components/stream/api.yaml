apiVersion: v1
kind: Service
metadata:
  name: edgeai-api
spec:
  ports:
    - {name: https, port: 18443, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeai-api
spec:
  template:
    spec:
      containers:
        - name: api
          command:
            - sh
            - -ec
            - |
              umask 077
              mkdir -p /tmp/stream-identity
              chmod 700 /tmp/stream-identity
              cp /bootstrap/stream/* /tmp/stream-identity/
              chmod 600 /tmp/stream-identity/*
              exec java -XX:MaxRAMPercentage=75.0 -Djavax.net.ssl.trustStore=/var/run/edgeai-trust/trust.p12 -Djavax.net.ssl.trustStorePassword=changeit -jar /app/app.jar
          ports: [{name: https, containerPort: 18443}]
          envFrom:
            - configMapRef: {name: edgeai-config}
            - secretRef: {name: edgeai-runtime}
            - secretRef: {name: edgeai-artifact-storage}
            - configMapRef: {name: edgeai-stream-config-v1}
          volumeMounts:
            - {name: stream-identity, mountPath: /bootstrap/stream, readOnly: true}
            - {name: stream-trust, mountPath: /var/run/edgeai-trust, readOnly: true}
      volumes:
        - name: stream-identity
          secret: {secretName: edgeai-api-stream-identity-v1, defaultMode: 288}
        - name: stream-trust
          configMap: {name: edgeai-runtime-ca-v1}

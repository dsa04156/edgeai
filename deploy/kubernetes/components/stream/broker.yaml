apiVersion: v1
kind: Service
metadata:
  name: edgeai-mqtt
  namespace: edgeai
  labels: {app.kubernetes.io/part-of: edgeai, app.kubernetes.io/managed-by: edgeai-bootstrap}
spec:
  selector: {app: edgeai-mqtt}
  ports: [{name: mqtts, port: 8883, targetPort: mqtts}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edgeai-mqtt
  namespace: edgeai
  labels: {app.kubernetes.io/part-of: edgeai, app.kubernetes.io/managed-by: edgeai-bootstrap}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-1'
spec:
  serviceName: edgeai-mqtt
  replicas: 1
  selector:
    matchLabels: {app: edgeai-mqtt}
  template:
    metadata:
      labels: {app: edgeai-mqtt}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
          command:
            - sh
            - -ec
            - |
              umask 077
              cd /mosquitto/data
              if [ ! -f dynamic-security.json ]; then
                test ! -e .initialized
                test ! -e mosquitto.db
                cp /bootstrap/dynamic-security.json .dynamic-security.initial
                chmod 600 .dynamic-security.initial
                mv .dynamic-security.initial dynamic-security.json
              fi
              test -s dynamic-security.json
              test ! -L dynamic-security.json
              touch .initialized
              exec /usr/sbin/mosquitto -c /config/mosquitto.conf
          ports: [{name: mqtts, containerPort: 8883}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: mqtts}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: mqtts}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /mosquitto/data}
            - {name: identity, mountPath: /bootstrap, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          secret: {secretName: edgeai-mqtt-identity-v1, defaultMode: 288}
        - name: config
          configMap: {name: edgeai-mqtt-config-v1}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}

# Hawkeye warehouse-safety VLM (docs/scenarios/hawkeye-warehouse-safety.md): official Ollama with the pinned model
# baked in, and the adapter that only edgeai-api may call. Ollama listens on the Pod loopback only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeai-hawkeye-safety
  labels:
    app.kubernetes.io/name: edgeai-hawkeye-safety
    app.kubernetes.io/part-of: edgeai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edgeai-hawkeye-safety
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgeai-hawkeye-safety
        app.kubernetes.io/part-of: edgeai
    spec:
      # CPU only: the node's RTX 5060 Ti runs the forklift/person detector (components/hawkeye-motion). Ollama reports
      # the CPU placement through /api/ps and the adapter stores it (CPU probe 2026-10-26: READY, sizeVramBytes 0).
      nodeSelector:
        kubernetes.io/hostname: etri-ser0001-cg0msb
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ollama
          image: edgeai-hawkeye-ollama
          env:
            # No GPU is requested; keep the NVIDIA runtime from mounting one anyway.
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        - name: adapter
          image: edgeai-hawkeye-adapter
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # READY only after the samples, the model digest and one warm-up inference passed (cold load about 24 s).
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: edgeai-hawkeye-safety
  labels: {app.kubernetes.io/name: edgeai-hawkeye-safety, app.kubernetes.io/part-of: edgeai}
spec:
  selector: {app.kubernetes.io/name: edgeai-hawkeye-safety}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeai-hawkeye-safety
  labels: {app.kubernetes.io/part-of: edgeai}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: edgeai-hawkeye-safety}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: edgeai-api}
        # Runner Pods of the hawkeye-video-safety infer Task (any Job the runtime controller created in its namespace).
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: edgeai-runtimes}
          podSelector:
            matchLabels: {app.kubernetes.io/managed-by: edgeai-runtime-controller}
      ports:
        - {protocol: TCP, port: 8080}

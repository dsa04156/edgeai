apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edgeai-postgres-hdd
  labels:
    app.kubernetes.io/part-of: edgeai
    edgeai.io/storage-tier: hdd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: edgeai-hdd
  volumeName: edgeai-postgres-hdd
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---

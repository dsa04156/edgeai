apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeai-hawkeye-video-replay
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: edgeai-hawkeye-video-replay}
  template:
    metadata:
      labels: {app.kubernetes.io/name: edgeai-hawkeye-video-replay}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: etri-ser0001-cg0msb}
      containers:
        - name: replay
          image: 10.254.192.47:5000/edgeai/hawkeye-video-replay@sha256:0839b796c07bba3f0362b08be657643b7d491d746272ac416d3b563278c4d4c0
          ports:
            - {name: rtsp, containerPort: 8554, hostPort: 18555}
          readinessProbe:
            tcpSocket: {port: rtsp}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}

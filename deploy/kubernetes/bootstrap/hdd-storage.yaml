apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: edgeai-hdd
  labels:
    app.kubernetes.io/part-of: edgeai
    edgeai.io/storage-tier: hdd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: edgeai-postgres-hdd
  labels:
    app.kubernetes.io/part-of: edgeai
    edgeai.io/storage-tier: hdd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: edgeai-hdd
  claimRef:
    namespace: edgeai
    name: edgeai-postgres-hdd
  local:
    path: /mnt/data3tb/edgeai/databases/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - etri-ser0001-cg0msb
---

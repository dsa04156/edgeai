apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edgeai
resources:
  - ../../base
  - ingress.yaml
components:
  - ../../components/stream
  - ../../components/hdd-data-store
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edgeai-api
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: etri-ser0001-cg0msb
  # Users reach the console at the server address 10.254.192.47:13080 (formerly the host Next.js process).
  # A hostPort cannot be shared during a rolling update, so the old Pod stops first.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edgeai-dashboard
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: etri-ser0001-cg0msb
            containers:
              - name: dashboard
                ports:
                  - {name: http, containerPort: 13080, hostPort: 13080}
images:
  - name: ghcr.io/dsa04156/edgeai-api
    digest: sha256:3c34d9d8455443af4438163b9b5a1a782a152a9f663c20e98141dc4c5c26a362
  - name: ghcr.io/dsa04156/edgeai-dashboard
    digest: sha256:968a7348c76c20a27dfeb8e04b3bdaa965217ee56e66044ede049c921ded5cc8
  - name: ghcr.io/dsa04156/edgeai-minio
    digest: sha256:88d6843bed54094690edd581b4ff7e5bb86c3bba0684bdd893328e234dc75971

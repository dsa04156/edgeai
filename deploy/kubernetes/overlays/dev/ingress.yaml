apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edgeai
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik
  # Users reach the console at 10.254.192.47:13080 (hostPort); this Ingress serves the traefik address.
  # Routing / to edgeai-dashboard is a separate change.
  rules:
    - host: edgeai.10.254.192.47.sslip.io
      http: &routes
        paths:
          - path: /api/v1
            pathType: Prefix
            backend: {service: {name: edgeai-api, port: {number: 18080}}}
          - path: /actuator/health
            pathType: Prefix
            backend: {service: {name: edgeai-api, port: {number: 18080}}}
          - path: /swagger-ui
            pathType: Prefix
            backend: {service: {name: edgeai-api, port: {number: 18080}}}
          - path: /swagger-ui.html
            pathType: Exact
            backend: {service: {name: edgeai-api, port: {number: 18080}}}
          - path: /openapi.yaml
            pathType: Exact
            backend: {service: {name: edgeai-api, port: {number: 18080}}}
    - host: edgeai.10.254.192.217.nip.io
      http: *routes

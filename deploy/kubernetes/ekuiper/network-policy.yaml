apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeai-processing-ingress
  namespace: ekuiper
  labels: {app.kubernetes.io/part-of: edgeai}
spec:
  podSelector:
    matchLabels: {edgeai.io/processing-engine: central}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: TCP, port: 10083}]

apiVersion: v1
kind: ServiceAccount
metadata:
  name: edgeai-processing
  namespace: ekuiper
  labels: {app.kubernetes.io/part-of: edgeai}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edgeai-processing-attestation
  namespace: ekuiper
  labels: {app.kubernetes.io/part-of: edgeai}
rules:
  - apiGroups: ['']
    resources: [pods]
    resourceNames: [my-ekuiper-0]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeai-processing-attestation
  namespace: ekuiper
  labels: {app.kubernetes.io/part-of: edgeai}
subjects:
  - {kind: ServiceAccount, name: edgeai-control-plane, namespace: edgeai}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: edgeai-processing-attestation}

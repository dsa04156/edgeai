kind: Service
metadata:
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-messagebus
  namespace: edgex-system
spec:
  ports:
  - name: mqtt
    port: 1883
    protocol: TCP
    targetPort: mqtt
  selector:
    app.kubernetes.io/name: edgex-messagebus
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-messagebus
  namespace: edgex-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-messagebus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-messagebus
        app.kubernetes.io/part-of: edgeai
        app.kubernetes.io/managed-by: edgeai-repo
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - /usr/sbin/mosquitto
        - -c
        - /mosquitto/config/mosquitto.conf
        image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: mqtt
          timeoutSeconds: 1
        name: mosquitto
        ports:
        - containerPort: 1883
          name: mqtt
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: mqtt
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2001
          runAsNonRoot: true
          runAsUser: 2002
        startupProbe:
          failureThreshold: 30
          periodSeconds: 2
          successThreshold: 1
          tcpSocket:
            port: mqtt
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mosquitto/config/mosquitto.conf
          name: config
          readOnly: true
          subPath: mosquitto.conf
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: edgex-messagebus-config
        name: config
---
apiVersion: v1
data:
  mosquitto.conf: 'listener 1883 0.0.0.0

    allow_anonymous true

    persistence false

    '
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: edgex-messagebus
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-messagebus-config
  namespace: edgex-system

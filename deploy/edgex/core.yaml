apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: edgex-core-keeper
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-core-keeper
  namespace: edgex-system
spec:
  ports:
  - name: http
    port: 59890
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: edgex-core-keeper
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: edgex-core-keeper
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-core-keeper
  namespace: edgex-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edgex-core-keeper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-core-keeper
        app.kubernetes.io/part-of: edgeai
        app.kubernetes.io/managed-by: edgeai-repo
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -cd=/generated
        env:
        - name: DATABASE_HOST
          value: edgex-postgres
        - name: EDGEX_SECURITY_SECRET_STORE
          value: 'false'
        - name: MESSAGEBUS_AUTHMODE
          value: none
        - name: MESSAGEBUS_HOST
          value: edgex-messagebus
        - name: MESSAGEBUS_PORT
          value: '1883'
        - name: MESSAGEBUS_PROTOCOL
          value: tcp
        - name: MESSAGEBUS_SECRETNAME
        - name: MESSAGEBUS_TYPE
          value: mqtt
        - name: SERVICE_HOST
          value: edgex-core-keeper
        - name: SERVICE_SERVERBINDADDR
          value: 0.0.0.0
        image: edgexfoundry/core-keeper:4.0.2@sha256:49e87a003796dae20c5be64b0b4ea671e28c78a9c1a299ddb30e59824d544f40
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v3/ping
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: core-keeper
        ports:
        - containerPort: 59890
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v3/ping
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2001
          runAsNonRoot: true
          runAsUser: 2002
        startupProbe:
          failureThreshold: 40
          httpGet:
            path: /api/v3/ping
            port: http
            scheme: HTTP
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /generated
          name: generated-config
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - -c
        - attempt=0; until nc -z edgex-postgres 5432 && nc -z edgex-messagebus 1883; do attempt=$((attempt+1));
          test "$attempt" -lt 90 || exit 1; sleep 2; done
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        imagePullPolicy: IfNotPresent
        name: wait-for-infrastructure
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - /bin/sh
        - -c
        - attempt=0; until test "$(psql -h edgex-postgres -d edgex_db -tAc "SELECT 1")" = 1; do attempt=$((attempt+1));
          test "$attempt" -lt 90 || exit 1; sleep 2; done
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: edgex-postgres-credentials
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: edgex-postgres-credentials
        image: postgres:16.3-alpine@sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41
        imagePullPolicy: IfNotPresent
        name: wait-for-database-bootstrap
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - /bin/sh
        - -ec
        - "umask 077\ntmp=/generated/.configuration.yaml.$$\ntrap 'rm -f \"$tmp\"' 0 HUP INT TERM\nawk '\n  function\
          \ yaml_scalar(value, escaped, position, character) {\n    if (value == \"\" || value ~ /[[:cntrl:]]/)\
          \ {\n      invalid = 1\n      return \"\"\n    }\n    for (position = 1; position <= length(value); position++)\
          \ {\n      character = substr(value, position, 1)\n      if (character == \"\\\\\") escaped = escaped\
          \ \"\\\\\" \"\\\\\"\n      else if (character == \"\\\"\") escaped = escaped \"\\\\\" \"\\\"\"\n     \
          \ else escaped = escaped character\n    }\n    return \"\\\"\" escaped \"\\\"\"\n  }\n  BEGIN {\n    username\
          \ = yaml_scalar(ENVIRON[\"DB_USERNAME\"])\n    password = yaml_scalar(ENVIRON[\"DB_PASSWORD\"])\n    if\
          \ (invalid) exit 2\n  }\n  $0 == \"    DB:\" {\n    db_sections++\n    in_db = 1\n    print\n    next\n\
          \  }\n  in_db && $0 == \"Service:\" {\n    if (in_secret) secret_ends++\n    db_ends++\n    in_db = 0\n\
          \    in_secret = 0\n    print\n    next\n  }\n  in_db && $0 == \"      SecretData:\" {\n    secret_sections++\n\
          \    in_secret = 1\n    print\n    next\n  }\n  in_secret && $0 ~ /^      [^ ]/ {\n    in_secret = 0\n\
          \  }\n  in_secret && $0 == \"        username: \\\"postgres\\\"\" {\n    usernames++\n    print \"   \
          \     username: \" username\n    next\n  }\n  in_secret && $0 == \"        password: \\\"postgres\\\"\"\
          \ {\n    passwords++\n    print \"        password: \" password\n    next\n  }\n  { print }\n  END {\n\
          \    if (invalid || db_sections != 1 || db_ends != 1 ||\n        secret_sections != 1 || secret_ends !=\
          \ 1 ||\n        usernames != 1 || passwords != 1) exit 1\n  }\n' /res/configuration.yaml > \"$tmp\"\n\
          chmod 0600 \"$tmp\"\nmv \"$tmp\" /generated/configuration.yaml\ntrap - 0 HUP INT TERM\n"
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: edgex-postgres-credentials
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: edgex-postgres-credentials
        image: edgexfoundry/core-keeper:4.0.2@sha256:49e87a003796dae20c5be64b0b4ea671e28c78a9c1a299ddb30e59824d544f40
        imagePullPolicy: IfNotPresent
        name: generate-database-config
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2001
          runAsNonRoot: true
          runAsUser: 2002
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /generated
          name: generated-config
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 2001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: generated-config
---

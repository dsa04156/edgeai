apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: edgex-core-common-config-bootstrapper
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-core-common-config-bootstrapper
  namespace: edgex-system
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgex-core-common-config-bootstrapper
        app.kubernetes.io/part-of: edgeai
        app.kubernetes.io/managed-by: edgeai-repo
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --registry
        - -cp=keeper.http://edgex-core-keeper:59890
        - -cd=/generated
        command:
        - /core-common-config-bootstrapper
        env:
        - name: ALL_SERVICES_DATABASE_HOST
          value: edgex-postgres
        - name: ALL_SERVICES_DATABASE_PORT
          value: '5432'
        - name: ALL_SERVICES_DATABASE_TYPE
          value: postgres
        - name: ALL_SERVICES_DATABASE_NAME
          value: edgex_db
        - name: ALL_SERVICES_MESSAGEBUS_HOST
          value: edgex-messagebus
        - name: ALL_SERVICES_REGISTRY_HOST
          value: edgex-core-keeper
        - name: ALL_SERVICES_SERVICE_SERVERBINDADDR
          value: 0.0.0.0
        - name: APP_SERVICES_CLIENTS_CORE_METADATA_HOST
          value: edgex-core-metadata
        - name: DEVICE_SERVICES_CLIENTS_CORE_METADATA_HOST
          value: edgex-core-metadata
        - name: EDGEX_SECURITY_SECRET_STORE
          value: 'false'
        - name: EDGEX_OVERWRITE_CONFIG
          value: 'true'
        image: edgexfoundry/core-common-config-bootstrapper:4.0.2@sha256:6b8258301f57a65a6c01a2f7fb93a2fbe7b8ab12be5492568b8fd3ed857051eb
        imagePullPolicy: IfNotPresent
        name: core-common-config-bootstrapper
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2001
          runAsNonRoot: true
          runAsUser: 2002
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /generated
          name: generated-config
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - -c
        - attempt=0; until nc -z edgex-core-keeper 59890; do attempt=$((attempt+1)); test "$attempt" -lt 90 || exit
          1; sleep 2; done
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        imagePullPolicy: IfNotPresent
        name: wait-for-core-keeper
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - /bin/sh
        - -ec
        - "umask 077\ntmp=/generated/.configuration.yaml.$$\ntrap 'rm -f \"$tmp\"' 0 HUP INT TERM\nawk '\n  function\
          \ yaml_scalar(value, escaped, position, character) {\n    if (value == \"\" || value ~ /[[:cntrl:]]/)\
          \ {\n      invalid = 1\n      return \"\"\n    }\n    for (position = 1; position <= length(value); position++)\
          \ {\n      character = substr(value, position, 1)\n      if (character == \"\\\\\") escaped = escaped\
          \ \"\\\\\" \"\\\\\"\n      else if (character == \"\\\"\") escaped = escaped \"\\\\\" \"\\\"\"\n     \
          \ else escaped = escaped character\n    }\n    return \"\\\"\" escaped \"\\\"\"\n  }\n  BEGIN {\n    username\
          \ = yaml_scalar(ENVIRON[\"DB_USERNAME\"])\n    password = yaml_scalar(ENVIRON[\"DB_PASSWORD\"])\n    if\
          \ (invalid) exit 2\n  }\n  $0 == \"      DB:\" {\n    db_sections++\n    in_db = 1\n    print\n    next\n\
          \  }\n  in_db && $0 == \"    Telemetry:\" {\n    if (in_secret) secret_ends++\n    db_ends++\n    in_db\
          \ = 0\n    in_secret = 0\n    print\n    next\n  }\n  in_db && $0 == \"        SecretData:\" {\n    secret_sections++\n\
          \    in_secret = 1\n    print\n    next\n  }\n  in_secret && $0 ~ /^        [^ ]/ {\n    in_secret = 0\n\
          \  }\n  in_secret && $0 == \"          username: \\\"postgres\\\"\" {\n    usernames++\n    print \" \
          \         username: \" username\n    next\n  }\n  in_secret && $0 == \"          password: \\\"postgres\\\
          \"\" {\n    passwords++\n    print \"          password: \" password\n    next\n  }\n  { print }\n  END\
          \ {\n    if (invalid || db_sections != 1 || db_ends != 1 ||\n        secret_sections != 1 || secret_ends\
          \ != 1 ||\n        usernames != 1 || passwords != 1) exit 1\n  }\n' /res/configuration.yaml > \"$tmp\"\
          \nchmod 0600 \"$tmp\"\nmv \"$tmp\" /generated/configuration.yaml\ntrap - 0 HUP INT TERM\n"
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: edgex-postgres-credentials
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: edgex-postgres-credentials
        image: edgexfoundry/core-common-config-bootstrapper:4.0.2@sha256:6b8258301f57a65a6c01a2f7fb93a2fbe7b8ab12be5492568b8fd3ed857051eb
        imagePullPolicy: IfNotPresent
        name: generate-database-config
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 2001
          runAsNonRoot: true
          runAsUser: 2002
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /generated
          name: generated-config
      nodeSelector:
        kubernetes.io/hostname: etri-ser0002-cgnmsb
      restartPolicy: OnFailure
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 2001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: generated-config

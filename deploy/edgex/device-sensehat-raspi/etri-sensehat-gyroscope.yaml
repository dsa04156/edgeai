name: etri-sensehat-gyroscope
manufacturer: Raspberry Pi
description: Read-only gyroscope axes from the Sense HAT IMU
model: Sense HAT v1 virtual gyroscope source
labels:
- sensehat
- i2c
- raspi
- virtual-device
linkedDeviceCount: 1
deviceResources:
- description: Gyroscope X axis
  name: gyro_x
  isHidden: false
  properties:
    valueType: Float64
    readWrite: R
    units: rad/s
- description: Gyroscope Y axis
  name: gyro_y
  isHidden: false
  properties:
    valueType: Float64
    readWrite: R
    units: rad/s
- description: Gyroscope Z axis
  name: gyro_z
  isHidden: false
  properties:
    valueType: Float64
    readWrite: R
    units: rad/s
deviceCommands:
- name: gyroscope
  isHidden: false
  readWrite: R
  resourceOperations:
  - deviceResource: gyro_x
  - deviceResource: gyro_y
  - deviceResource: gyro_z
apiVersion: v2

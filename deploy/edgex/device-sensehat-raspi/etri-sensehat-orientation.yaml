model: Sense HAT v1 virtual orientation source
labels:
- sensehat
- i2c
- raspi
- virtual-device
linkedDeviceCount: 1
deviceResources:
- description: Fused pitch normalized to 0 through 360 degrees
  name: pitch
  isHidden: false
  properties:
    valueType: Float64
    readWrite: R
    units: deg
- description: Fused roll normalized to 0 through 360 degrees
  name: roll
  isHidden: false
  properties:
    valueType: Float64
    readWrite: R
    units: deg
- description: Fused yaw normalized to 0 through 360 degrees
  name: yaw
  isHidden: false
  properties:
    valueType: Float64
    readWrite: R
    units: deg
deviceCommands:
- name: orientation
  isHidden: false
  readWrite: R
  resourceOperations:
  - deviceResource: pitch
  - deviceResource: roll
  - deviceResource: yaw
apiVersion: v2

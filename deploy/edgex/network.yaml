apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: device-sensehat-raspi
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: device-sensehat-raspi-egress
  namespace: edgex-edge
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 59890
      protocol: TCP
    - port: 59881
      protocol: TCP
    - port: 1883
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: edgex-system
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - edgex-core-keeper
          - edgex-core-metadata
          - edgex-messagebus
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-sensehat-raspi
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: device-sensehat-raspi
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: device-sensehat-raspi-ingress
  namespace: edgex-edge
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: edgex-system
    ports:
    - port: 59911
      protocol: TCP
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          edge-ai.io/local-data-client: 'true'
    ports:
    - port: 59911
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: device-sensehat-raspi
  policyTypes:
  - Ingress

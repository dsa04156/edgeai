apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: edgeai
    app.kubernetes.io/managed-by: edgeai-repo
  name: edgex-device-service-ingress
  namespace: edgex-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: edgex-edge
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - device-serial-jetson
          - device-sensehat-raspi
    ports:
    - port: 59890
      protocol: TCP
    - port: 59881
      protocol: TCP
    - port: 1883
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - edgex-core-keeper
      - edgex-core-metadata
      - edgex-messagebus
  policyTypes:
  - Ingress
---

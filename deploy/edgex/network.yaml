apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeai-spring-metadata
  namespace: edgex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: edgex-core-metadata
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: edgeai
      podSelector:
        matchLabels:
          app: edgeai-api
    ports:
    - port: 59881
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeai-spring-sensor-access
  namespace: edgex-system
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values: [edgex-core-data, edgex-core-command]
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: edgeai
      podSelector:
        matchLabels:
          app: edgeai-api
    ports:
    - {port: 59880, protocol: TCP}
    - {port: 59882, protocol: TCP}

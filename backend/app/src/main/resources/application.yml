spring:
  application:
    name: edgeai-control-plane
  datasource:
    url: jdbc:postgresql://${EDGEAI_DB_HOST:127.0.0.1}:${EDGEAI_DB_PORT:15432}/${EDGEAI_DB_NAME:edgeai}
    username: ${EDGEAI_DB_USER:edgeai}
    password: ${EDGEAI_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    default-schema: edgeai
    enabled: true
    clean-disabled: true
server:
  servlet:
    session:
      cookie:
        name: EDGEAI_SESSION
        same-site: strict
  address: ${EDGEAI_BIND_ADDRESS:127.0.0.1}
  port: ${EDGEAI_API_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
edgeai:
  data-store:
    influx:
      url: ${EDGEAI_INFLUX_URL:}
      org: ${EDGEAI_INFLUX_ORG:edgeai}
      token-file: ${EDGEAI_INFLUX_TOKEN_FILE:}
      raw-bucket: ${EDGEAI_INFLUX_RAW_BUCKET:sensor-originals}
      result-prefix: ${EDGEAI_INFLUX_RESULT_PREFIX:vd-results-}
    raw:
      enabled: ${EDGEAI_RAW_HISTORY_ENABLED:false}
      client-id: ${EDGEAI_RAW_HISTORY_CLIENT_ID:edgeai-archive}
      retention-days: ${EDGEAI_RAW_HISTORY_RETENTION_DAYS:30}
      broker-node-overrides: "${EDGEAI_RAW_HISTORY_BROKER_NODE_OVERRIDES:{}}"
      interval-ms: ${EDGEAI_RAW_HISTORY_CATALOG_INTERVAL_MS:5000}
  devices:
    namespace: ${EDGEAI_DEVICE_NAMESPACE:edgeai-devices}
    data-broker: ${EDGEAI_DEVICE_DATA_BROKER:tcp://127.0.0.1:1883}
    mapper-rtsp: ${EDGEAI_MAPPER_RTSP:}
    mapper-arm64: ${EDGEAI_MAPPER_ARM64:10.254.192.47:5000/edgeai/mapper@sha256:5b2fab60153dc33e603687d1ab7ed05c8444fa9b9b774e70a65c25f88fc64737}
    mapper-amd64: ${EDGEAI_MAPPER_AMD64:10.254.192.47:5000/edgeai/mapper@sha256:e6238ccb39a7f2b548f9c23c69ec22e6eaaa7495ae5710b3fa922ab8d2c25d34}
    mapper-sensehat-arm64: ${EDGEAI_MAPPER_SENSEHAT_ARM64:10.254.192.47:5000/edgeai/mapper-sensehat@sha256:285a6da420408fffe03c5868362d4081a7d998fc119dda22d9b55395f3fee578}
  infrastructure:
    source: ${EDGEAI_INFRASTRUCTURE_SOURCE:disabled}
    context: ${EDGEAI_INFRASTRUCTURE_CONTEXT:}
  prometheus:
    enabled: ${EDGEAI_PROMETHEUS_ENABLED:false}
    url: ${EDGEAI_PROMETHEUS_URL:http://prometheus-kube-prometheus-prometheus.kube-system.svc:9090}
  # 3-3 resource requirement profiles. Analysis reads Prometheus only when prometheus-url is set and runs KRR only
  # through the dedicated recommendation bridge; browsers never supply URLs, commands or PromQL.
  resource-profiling:
    enabled: ${EDGEAI_RESOURCE_PROFILING_ENABLED:true}
    namespaces: ${EDGEAI_RESOURCE_PROFILING_NAMESPACES:edgeai}
    prometheus-url: ${EDGEAI_RESOURCE_PROFILING_PROMETHEUS_URL:}
    # Shared Prometheus budget and total analysis deadline; total must stay below the console proxy wait (210 s).
    observation-budget-seconds: ${EDGEAI_RESOURCE_PROFILING_OBSERVATION_BUDGET_SECONDS:60}
    total-budget-seconds: ${EDGEAI_RESOURCE_PROFILING_TOTAL_BUDGET_SECONDS:180}
    krr:
      bridge-url: ${EDGEAI_RESOURCE_PROFILING_KRR_BRIDGE_URL:}
      version: ${EDGEAI_RESOURCE_PROFILING_KRR_VERSION:v1.31.1}
      timeout-seconds: ${EDGEAI_RESOURCE_PROFILING_KRR_TIMEOUT_SECONDS:130}
  inference:
    enabled: ${EDGEAI_INFERENCE_ENABLED:false}
    model-id: ${EDGEAI_INFERENCE_MODEL_ID:}
    model-name: ${EDGEAI_INFERENCE_MODEL_NAME:}
    node-name: ${EDGEAI_INFERENCE_NODE_NAME:}
    device-name: ${EDGEAI_INFERENCE_DEVICE_NAME:}
    provider: ${EDGEAI_INFERENCE_PROVIDER:}
    runtime-url: ${EDGEAI_INFERENCE_RUNTIME_URL:}
    timeout: ${EDGEAI_INFERENCE_TIMEOUT:20s}
  # GPU/NPU image comparison (docs/scenarios/gpu-npu-image-comparison.md). Disabled until both runtimes are deployed.
  scenario:
    enabled: ${EDGEAI_SCENARIO_ENABLED:false}
    timeout: ${EDGEAI_SCENARIO_TIMEOUT:20s}
    lease: ${EDGEAI_SCENARIO_LEASE:60s}
    heartbeat: ${EDGEAI_SCENARIO_HEARTBEAT:5s}
    dataset:
      name: 고정 100장 비교 데이터셋 (Imagenette2-160 val)
      version: imagenette100-resnet50-tflite-qualification/v1
      preprocessing: tensorflow-2.20.0-rgb-bilinear-shortest256-center224-float32
      label-source: Imagenette2-160 val 폴더 WNID → ImageNet-1k 클래스 번호
      manifest-sha256: 7740c3420918e1264024dd41dbe6c0db18a2f1d283789afc89ef3d0db522d30f
      inputs-sha256: cb0d2db8020f4880f41e033e69bdd67f6591d16d41caf712a6eda651324150d5
      image-count: 100
    gpu:
      url: ${EDGEAI_SCENARIO_GPU_URL:}
      model-name: ResNet-v1-50 (TFLite → ONNX opset 18)
      model-sha256: 1737a0c64aff1a923bd73b426fe40700bb7bf2e7c1449bad2c90eda03d93249d
      provider: CUDAExecutionProvider
    npu:
      url: ${EDGEAI_SCENARIO_NPU_URL:}
      model-name: ResNet-v1-50 (Hailo Model Zoo HEF)
      model-sha256: a1d82e9121c66e772257490cb3af904d1e90fb4387ad5f683fbc5efe1a05f9f7
      provider: HailoRT
  # Hawkeye warehouse-safety VLM (docs/scenarios/hawkeye-warehouse-safety.md). Disabled until the adapter is deployed.
  hawkeye-safety:
    enabled: ${EDGEAI_HAWKEYE_SAFETY_ENABLED:false}
    url: ${EDGEAI_HAWKEYE_SAFETY_URL:}
    timeout: ${EDGEAI_HAWKEYE_SAFETY_TIMEOUT:120s}
    lease: ${EDGEAI_HAWKEYE_SAFETY_LEASE:60s}
    heartbeat: ${EDGEAI_HAWKEYE_SAFETY_HEARTBEAT:5s}
    model:
      name: Hawkeye Warehouse Safety VLM (Qwen3.5-2B LoRA, Q4_K_M + F16 vision encoder)
      ollama-name: hf.co/Jsohal174/hawkeye-warehouse-safety-gguf:latest
      repository: https://huggingface.co/Jsohal174/hawkeye-warehouse-safety-gguf
      revision: 9aea324874878ab464fa42e6abd952e178893f79
      license: CC-BY-4.0
      manifest-digest: edac48dc7e13c76d23710b693552d2422f599c3c7112f45561888dec48f2d280
      language-sha256: beef633ddb0671b90cc90f94e254537ae7e7e5c718ed0e73c88c95c8d8d740f3
      vision-sha256: e1ae17404211c36acc087f15e2615a8d617afa5bafeadc5d2b484ecbe7edb2c2
    dataset:
      name: Warehouse Safety Hazard Dataset (합성 이미지, held-out test split)
      repository: https://huggingface.co/datasets/Jsohal174/warehouse-safety-hazard-dataset
      revision: b23808ec287ad4aa377f661f9cbda840e76865e1
      license: CC-BY-4.0
      split: test
      samples-sha256: 9c4ae8925a63fcea3ce3ee241fceefbef1d0129295ff11b7a07391f108e11e69
    samples:
      - id: forklift_0004
        file: test/forklift_violation/forklift_0004.jpg
        reference-label: forklift_violation
        sha256: 417f2b6cffc30ba1a5ffd3e241efcfb58db16c56918e09b998d70f377f4023ff
      - id: forklift_0024
        file: test/safe/forklift_0024.jpg
        reference-label: safe
        sha256: eaff9ccb0ab17578bc1cc8e3b255c982bf1d880d0add4d812f6fb32e977e8af4
  # Hawkeye video sessions: bounded BATCH window Runs of the published capture → infer SERVICE workflow.
  hawkeye-video:
    enabled: ${EDGEAI_HAWKEYE_VIDEO_ENABLED:false}
    workflow-key: ${EDGEAI_HAWKEYE_VIDEO_WORKFLOW_KEY:hawkeye-video-safety}
    max-windows: ${EDGEAI_HAWKEYE_VIDEO_MAX_WINDOWS:30}
    poll: ${EDGEAI_HAWKEYE_VIDEO_POLL:1s}
    # Continuous forklift/person observer of snapshot workflow versions (deploy/kubernetes/components/hawkeye-motion).
    observer-url: ${EDGEAI_HAWKEYE_VIDEO_OBSERVER_URL:}
    observer-lease: ${EDGEAI_HAWKEYE_VIDEO_OBSERVER_LEASE:15s}
  workflow:
    enabled: ${EDGEAI_WORKFLOW_ENABLED:true}
  recovery:
    inspect-only: ${EDGEAI_RECOVERY_INSPECT_ONLY:false}
  api-tls:
    enabled: ${EDGEAI_API_TLS_ENABLED:false}
    port: ${EDGEAI_API_TLS_PORT:18443}
    certificate-file: ${EDGEAI_API_TLS_CERTIFICATE_FILE:}
    private-key-file: ${EDGEAI_API_TLS_PRIVATE_KEY_FILE:}
  stream:
    enabled: ${EDGEAI_STREAM_ENABLED:false}
    bindings-enabled: ${EDGEAI_STREAM_BINDINGS_ENABLED:false}
    runs-enabled: ${EDGEAI_STREAM_RUNS_ENABLED:false}
    lease-seconds: ${EDGEAI_STREAM_LEASE_SECONDS:30}
    device-key-file: ${EDGEAI_STREAM_DEVICE_KEY_FILE:}
    client-url: ${EDGEAI_STREAM_CLIENT_URL:}
    broker-url: ${EDGEAI_STREAM_BROKER_URL:}
    broker-digest: ${EDGEAI_STREAM_BROKER_DIGEST:}
    admin-user: ${EDGEAI_STREAM_ADMIN_USER:edgeai-admin}
    admin-password-file: ${EDGEAI_STREAM_ADMIN_PASSWORD_FILE:}
    ca-file: ${EDGEAI_STREAM_CA_FILE:}
    principal-key-file: ${EDGEAI_STREAM_PRINCIPAL_KEY_FILE:}
  continuous:
    enabled: ${EDGEAI_CONTINUOUS_ENABLED:false}
    namespace: ${EDGEAI_CONTINUOUS_NAMESPACE:ekuiper}
    service-account: ${EDGEAI_CONTINUOUS_SERVICE_ACCOUNT:edgeai-processing}
    pod-name: ${EDGEAI_CONTINUOUS_POD_NAME:my-ekuiper-0}
    credential-file: ${EDGEAI_CONTINUOUS_CREDENTIAL_FILE:}
    broker-node-overrides: "${EDGEAI_CONTINUOUS_BROKER_NODE_OVERRIDES:{}}"
    history-budget-gib: ${EDGEAI_CONTINUOUS_HISTORY_BUDGET_GIB:300}
    history:
      url: ${EDGEAI_HISTORY_DB_URL:}
      user: ${EDGEAI_HISTORY_DB_USER:edgeai_history}
      password: ${EDGEAI_HISTORY_DB_PASSWORD:}
  remote:
    enabled: ${EDGEAI_REMOTE_ENABLED:false}
    provider-key: ${EDGEAI_REMOTE_PROVIDER_KEY:reference}
    url: ${EDGEAI_REMOTE_URL:}
    token-file: ${EDGEAI_REMOTE_TOKEN_FILE:}
    ca-file: ${EDGEAI_REMOTE_CA_FILE:}
    source-mode: ${EDGEAI_REMOTE_SOURCE_MODE:SYNTHETIC}
    timeout-seconds: ${EDGEAI_REMOTE_TIMEOUT_SECONDS:10}
  offload-lab:
    workflow-key: ${EDGEAI_OFFLOAD_LAB_WORKFLOW_KEY:offload-lab}
    load-image: ${EDGEAI_OFFLOAD_LAB_LOAD_IMAGE:}
    poll-ms: ${EDGEAI_OFFLOAD_LAB_POLL_MS:3000}
  runtime:
    enabled: ${EDGEAI_RUNTIME_ENABLED:false}
    # '*' or the only workflow keys whose Runs are dispatched; other Runs and their old runtime rows stay untouched.
    workflow-keys: ${EDGEAI_RUNTIME_WORKFLOW_KEYS:*}
    worker-enabled: ${EDGEAI_RUNTIME_WORKER_ENABLED:true}
    namespace: ${EDGEAI_RUNTIME_NAMESPACE:edgeai-runtimes}
    service-account: ${EDGEAI_RUNTIME_SERVICE_ACCOUNT:edgeai-runner}
    control-plane-url: ${EDGEAI_RUNTIME_CONTROL_PLANE_URL:http://edgeai-api.edgeai.svc:18080}
    ca-config-map: ${EDGEAI_RUNTIME_CA_CONFIG_MAP:}
    key-file: ${EDGEAI_RUNNER_KEY_FILE:}
    dispatch-seconds: ${EDGEAI_RUNTIME_DISPATCH_SECONDS:120}
  storage:
    endpoint: ${EDGEAI_STORAGE_URL:http://127.0.0.1:19000}
    runner-endpoint: ${EDGEAI_STORAGE_RUNNER_URL:http://127.0.0.1:19000}
    access-key: ${EDGEAI_MINIO_USER:}
    secret-key: ${EDGEAI_MINIO_PASSWORD:}
    bucket: ${EDGEAI_ARTIFACT_BUCKET:edgeai-artifacts}
  kubernetes:
    enabled: ${EDGEAI_KUBE_ENABLED:false}
    url: ${EDGEAI_KUBE_API_URL:https://kubernetes.default.svc}
    token-file: ${EDGEAI_KUBE_TOKEN_FILE:}
    ca-file: ${EDGEAI_KUBE_CA_FILE:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

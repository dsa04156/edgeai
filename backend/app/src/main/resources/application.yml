spring:
  application:
    name: edgeai-control-plane
  datasource:
    url: jdbc:postgresql://${EDGEAI_DB_HOST:127.0.0.1}:${EDGEAI_DB_PORT:15432}/${EDGEAI_DB_NAME:edgeai}
    username: ${EDGEAI_DB_USER:edgeai}
    password: ${EDGEAI_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    default-schema: edgeai
    enabled: true
    clean-disabled: true
server:
  servlet:
    session:
      cookie:
        name: EDGEAI_SESSION
        same-site: strict
  address: ${EDGEAI_BIND_ADDRESS:127.0.0.1}
  port: ${EDGEAI_API_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
edgeai:
  devices:
    namespace: ${EDGEAI_DEVICE_NAMESPACE:edgeai-devices}
    data-broker: ${EDGEAI_DEVICE_DATA_BROKER:tcp://127.0.0.1:1883}
    mapper-arm64: ${EDGEAI_MAPPER_ARM64:192.168.0.56:5000/edgeai/mapper@sha256:365050dbec6119e0ab748e85b2f73219adea5a439d1636e94486a8c462d3b2b6}
    mapper-amd64: ${EDGEAI_MAPPER_AMD64:192.168.0.56:5000/edgeai/mapper@sha256:375faa1a70516c8072c0349fdc1db1316ce970b4b886f6b4c5a8b324ed8ce813}
    mapper-sensehat-arm64: ${EDGEAI_MAPPER_SENSEHAT_ARM64:192.168.0.56:5000/edgeai/mapper-sensehat@sha256:d71af4bd4677c29e100e5f773a7e62925c88ac70995e9f11813cdef1366830a8}
  infrastructure:
    source: ${EDGEAI_INFRASTRUCTURE_SOURCE:disabled}
    context: ${EDGEAI_INFRASTRUCTURE_CONTEXT:}
  prometheus:
    enabled: ${EDGEAI_PROMETHEUS_ENABLED:false}
    url: ${EDGEAI_PROMETHEUS_URL:http://prometheus-kube-prometheus-prometheus.kube-system.svc:9090}
  workflow:
    enabled: ${EDGEAI_WORKFLOW_ENABLED:true}
  recovery:
    inspect-only: ${EDGEAI_RECOVERY_INSPECT_ONLY:false}
  api-tls:
    enabled: ${EDGEAI_API_TLS_ENABLED:false}
    port: ${EDGEAI_API_TLS_PORT:18443}
    certificate-file: ${EDGEAI_API_TLS_CERTIFICATE_FILE:}
    private-key-file: ${EDGEAI_API_TLS_PRIVATE_KEY_FILE:}
  stream:
    enabled: ${EDGEAI_STREAM_ENABLED:false}
    bindings-enabled: ${EDGEAI_STREAM_BINDINGS_ENABLED:false}
    runs-enabled: ${EDGEAI_STREAM_RUNS_ENABLED:false}
    lease-seconds: ${EDGEAI_STREAM_LEASE_SECONDS:30}
    device-key-file: ${EDGEAI_STREAM_DEVICE_KEY_FILE:}
    client-url: ${EDGEAI_STREAM_CLIENT_URL:}
    broker-url: ${EDGEAI_STREAM_BROKER_URL:}
    broker-digest: ${EDGEAI_STREAM_BROKER_DIGEST:}
    admin-user: ${EDGEAI_STREAM_ADMIN_USER:edgeai-admin}
    admin-password-file: ${EDGEAI_STREAM_ADMIN_PASSWORD_FILE:}
    ca-file: ${EDGEAI_STREAM_CA_FILE:}
    principal-key-file: ${EDGEAI_STREAM_PRINCIPAL_KEY_FILE:}
  vd:
    enabled: ${EDGEAI_VD_ENABLED:false}
    processing-image: ${EDGEAI_PROCESSING_IMAGE:}
    processing-architectures: ${EDGEAI_PROCESSING_ARCHITECTURES:amd64}
  continuous:
    enabled: ${EDGEAI_CONTINUOUS_ENABLED:false}
    namespace: ${EDGEAI_CONTINUOUS_NAMESPACE:ekuiper}
    service-account: ${EDGEAI_CONTINUOUS_SERVICE_ACCOUNT:edgeai-processing}
    pod-name: ${EDGEAI_CONTINUOUS_POD_NAME:my-ekuiper-0}
    credential-file: ${EDGEAI_CONTINUOUS_CREDENTIAL_FILE:}
    broker-node-overrides: "${EDGEAI_CONTINUOUS_BROKER_NODE_OVERRIDES:{}}"
    history-budget-gib: ${EDGEAI_CONTINUOUS_HISTORY_BUDGET_GIB:300}
    history:
      url: ${EDGEAI_HISTORY_DB_URL:}
      user: ${EDGEAI_HISTORY_DB_USER:edgeai_history}
      password: ${EDGEAI_HISTORY_DB_PASSWORD:}
  remote:
    enabled: ${EDGEAI_REMOTE_ENABLED:false}
    provider-key: ${EDGEAI_REMOTE_PROVIDER_KEY:reference}
    url: ${EDGEAI_REMOTE_URL:}
    token-file: ${EDGEAI_REMOTE_TOKEN_FILE:}
    ca-file: ${EDGEAI_REMOTE_CA_FILE:}
    source-mode: ${EDGEAI_REMOTE_SOURCE_MODE:SYNTHETIC}
    timeout-seconds: ${EDGEAI_REMOTE_TIMEOUT_SECONDS:10}
  runtime:
    enabled: ${EDGEAI_RUNTIME_ENABLED:false}
    worker-enabled: ${EDGEAI_RUNTIME_WORKER_ENABLED:true}
    namespace: ${EDGEAI_RUNTIME_NAMESPACE:edgeai-runtimes}
    service-account: ${EDGEAI_RUNTIME_SERVICE_ACCOUNT:edgeai-runner}
    control-plane-url: ${EDGEAI_RUNTIME_CONTROL_PLANE_URL:http://edgeai-api.edgeai.svc:18080}
    ca-config-map: ${EDGEAI_RUNTIME_CA_CONFIG_MAP:}
    key-file: ${EDGEAI_RUNNER_KEY_FILE:}
    dispatch-seconds: ${EDGEAI_RUNTIME_DISPATCH_SECONDS:120}
  storage:
    endpoint: ${EDGEAI_STORAGE_URL:http://127.0.0.1:19000}
    runner-endpoint: ${EDGEAI_STORAGE_RUNNER_URL:http://127.0.0.1:19000}
    access-key: ${EDGEAI_MINIO_USER:}
    secret-key: ${EDGEAI_MINIO_PASSWORD:}
    bucket: ${EDGEAI_ARTIFACT_BUCKET:edgeai-artifacts}
  kubernetes:
    enabled: ${EDGEAI_KUBE_ENABLED:false}
    url: ${EDGEAI_KUBE_API_URL:https://kubernetes.default.svc}
    token-file: ${EDGEAI_KUBE_TOKEN_FILE:}
    ca-file: ${EDGEAI_KUBE_CA_FILE:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

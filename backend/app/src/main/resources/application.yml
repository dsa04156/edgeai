spring:
  application:
    name: edgeai-control-plane
  datasource:
    url: jdbc:postgresql://${EDGEAI_DB_HOST:127.0.0.1}:${EDGEAI_DB_PORT:15432}/${EDGEAI_DB_NAME:edgeai}
    username: ${EDGEAI_DB_USER:edgeai}
    password: ${EDGEAI_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    default-schema: edgeai
    enabled: true
    clean-disabled: true
  security:
    user:
      name: ${EDGEAI_API_USER:edgeai}
      password: ${EDGEAI_API_PASSWORD}
server:
  servlet:
    session:
      cookie:
        name: EDGEAI_SESSION
        same-site: strict
  address: ${EDGEAI_BIND_ADDRESS:127.0.0.1}
  port: ${EDGEAI_API_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
edgeai:
  kubernetes:
    enabled: ${EDGEAI_KUBE_ENABLED:false}
    url: ${EDGEAI_KUBE_API_URL:https://kubernetes.default.svc}
    token-file: ${EDGEAI_KUBE_TOKEN_FILE:}
    ca-file: ${EDGEAI_KUBE_CA_FILE:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

plugins { id 'org.springframework.boot' }

dependencies {
    implementation project(':domain')
    implementation project(':adapters')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.webjars:swagger-ui:5.32.15'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.minio:minio:9.0.3'
    testImplementation 'org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5'
}

tasks.named('bootJar') { archiveFileName = 'edgeai-control-plane.jar' }
tasks.named('test') { exclude '**/*IntegrationTest.class' }
tasks.register('integrationTest', Test) {
    description = 'Requires a real PostgreSQL database; never substitutes an in-memory database.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IntegrationTest.class'
    exclude '**/ArtifactStorageIntegrationTest.class'
    exclude '**/RuntimeStartStorageIntegrationTest.class'
    exclude '**/RuntimeStartJournalIntegrationTest.class'
    exclude '**/RuntimeResultJournalIntegrationTest.class'
    exclude '**/VDTaskStartJournalIntegrationTest.class'
    exclude '**/VDTaskResultJournalIntegrationTest.class'
    exclude '**/RuntimeArtifactIntegrationTest.class'
    exclude '**/VDTaskArtifactIntegrationTest.class'
    exclude '**/KubernetesRuntimeIntegrationTest.class'
    exclude '**/KubernetesVDIntegrationTest.class'
    exclude '**/RemoteGatewayIntegrationTest.class'
    exclude '**/RemoteWorkerIntegrationTest.class'
    exclude '**/StreamBrokerIntegrationTest.class'
    exclude '**/StreamBindingIntegrationTest.class'
    exclude '**/StreamCheckpointIntegrationTest.class'
    exclude '**/StreamSourceCompletionIntegrationTest.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('storageIntegrationTest', Test) {
    description = 'Requires real versioned S3 storage; never substitutes an in-memory store.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/ArtifactStorageIntegrationTest.class'
    include '**/RuntimeStartStorageIntegrationTest.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('runtimeArtifactIntegrationTest', Test) {
    description = 'Requires real PostgreSQL, versioned S3, Mosquitto and the Python stream SDK; verifies Result and stream completion.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/RuntimeArtifactIntegrationTest.class'
    include '**/VDTaskArtifactIntegrationTest.class'
    include '**/RemoteWorkerIntegrationTest.class'
    include '**/StreamCheckpointIntegrationTest.class'
    include '**/StreamSourceCompletionIntegrationTest.class'
    include '**/RuntimeStartJournalIntegrationTest.class'
    include '**/RuntimeResultJournalIntegrationTest.class'
    include '**/VDTaskStartJournalIntegrationTest.class'
    include '**/VDTaskResultJournalIntegrationTest.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('kubernetesRuntimeIntegrationTest', Test) {
    description = 'Requires an explicit, owned real Kubernetes namespace and limited service account credentials.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/KubernetesRuntimeIntegrationTest.class'
    include '**/KubernetesVDIntegrationTest.class'
}

tasks.register('remoteIntegrationTest', Test) {
    description = 'Requires Python and a real loopback reference-provider process; tests persistent HTTP lifecycle and artifact integrity.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/RemoteGatewayIntegrationTest.class'
}

tasks.register('streamBrokerIntegrationTest', Test) {
    description = 'Requires real isolated Mosquitto dynamic security; never substitutes an ACL fixture.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/StreamBrokerIntegrationTest.class'
    include '**/StreamBindingIntegrationTest.class'
}

// Serve the exact reviewed contract; do not infer a competing schema from controllers.
tasks.named('processResources') {
    from(rootProject.file('../contracts/openapi/stream-api.yaml')) {
        into 'static'
        rename { 'stream-openapi.yaml' }
    }
    from(rootProject.file('../contracts/openapi/platform-api.yaml')) {
        into 'static'
        rename { 'openapi.yaml' }
    }
}

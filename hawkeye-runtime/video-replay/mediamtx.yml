logLevel: warn
rtspTransports: [tcp]
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
paths:
  forklift-replay:
    runOnInit: ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /media/forklift.mp4 -map 0:v:0 -c:v copy -an -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/forklift-replay
    runOnInitRestart: yes
  forklift-turn:
    runOnInit: ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -i /media/forklift-turn.mp4 -map 0:v:0 -c:v copy -an -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/forklift-turn

      description: 실행 요청을 생성 시각 역순으로 조회합니다. PENDING은 실행 요청이 저장된 상태이며 실제 실행 성공을 의미하지 않습니다.
      responses:
        '200':
          description: 현재 저장 상태 또는 동일 입력 재요청 결과입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '400':
          description: 잘못된 필드·UUID·DAG·페이지 입력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Basic 인증 필요
        '404':
          description: 대상 리소스가 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 저장소를 사용할 수 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0

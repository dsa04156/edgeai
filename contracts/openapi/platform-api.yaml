openapi: 3.1.0
info:
  title: EdgeAI Control Plane — M2
  version: 0.1.0
  description: 현재 Profile 및 Device/Node 관리 API입니다. Profile 규격 발행 → 장치 등록 → 관측된 Node 연결 → 세션 시작 → 상태 보고 순서로 사용합니다.
    Swagger 쓰기 요청은 실제 DB에 반영되며 CSRF 토큰/쿠키는 자동 연결됩니다. AI 실행은 후속 단계입니다.
servers:
- url: /
security:
- localBasic: []
paths:
  /api/v1/platform:
    get:
      operationId: getPlatform
      summary: 플랫폼 정보와 구현된 기능 조회
      responses:
        '200':
          description: Implemented platform capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInfo'
        '401':
          description: Authentication required
      tags:
      - 플랫폼
      description: 서버 이름·버전·현재 개발 단계와 실제 구현된 profiles/devices/nodes 기능을 반환합니다. 인증이 필요합니다.
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: 서버와 PostgreSQL의 요청 처리 준비 상태 확인
      security: []
      responses:
        '200':
          description: Application and database ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application or database not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
      - 상태 확인
      description: 애플리케이션과 PostgreSQL이 함께 준비되어 있으면 200/UP을 반환합니다. DB 연결 장애 등으로 요청을 처리할 수 없으면 503/DOWN을 반환합니다. Kubernetes
        readiness probe가 사용하며 인증은 필요하지 않습니다. 내부 접속 정보는 응답하지 않습니다.
  /api/v1/csrf:
    get:
      operationId: getCsrfToken
      summary: 쓰기 요청에 사용할 CSRF 토큰 발급
      responses:
        '200':
          description: Send token as X-CSRF-TOKEN with the session cookie and Basic credentials.
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
        '401':
          description: Authentication required
      tags:
      - 인증
      description: Basic 인증 후 호출하면 token과 EDGEAI_SESSION 세션 쿠키를 받습니다. 직접 POST를 호출하는 클라이언트는 같은 쿠키와 X-CSRF-TOKEN 헤더,
        Basic 인증을 함께 보내야 합니다. 토큰은 로그인용 액세스 토큰이 아닙니다. Swagger에서는 자동 처리하므로 수동 입력할 필요가 없습니다.
  /api/v1/profiles/{kind}:
    parameters:
    - $ref: '#/components/parameters/Kind'
    post:
      operationId: publishProfile
      summary: 프로필 새 버전 등록
      description: 'DEVICE(장치 규격), SERVICE(서비스 규격), VD(가상 장치 규격) 중 종류를 선택해 JSON 문서를 발행합니다.


        새 key/version은 201, 같은 종류·key·version에 같은 내용을 재전송하면 기존 id와 생성 시각을 유지한 200을 반환합니다. 같은 버전에 다른 내용을 보내면 409이며
        version을 올려 등록해야 합니다. 발행 후 수정·삭제할 수 없습니다.


        Basic 인증·세션 쿠키·CSRF 토큰이 필요합니다. 요청은 UTF-8 기준 64 KiB 이하, spec은 비어 있지 않은 JSON 객체여야 합니다. 최대 중첩 깊이는 32이며 중복 JSON
        키와 key/version/spec 이외의 최상위 필드는 거절합니다. 아래 규격은 입력 예시이며 실제 장치/런타임 호환성 검증은 후속 개발 범위입니다.'
      security:
      - localBasic: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishProfile'
            example:
              key: temperature-sensor
              version: 1.0.0
              spec:
                protocol: mqtt
                unit: celsius
      responses:
        '201':
          description: 새 버전을 발행했습니다. Location 헤더로 상세 조회할 수 있습니다.
          headers:
            Location:
              schema:
                type: string
              description: Version lookup path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '200':
          description: 동일 내용의 기존 버전입니다. 중복 생성하지 않고 기존 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          description: Authentication required
        '403':
          description: Missing or invalid CSRF token
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 요청 또는 정규화된 규격이 UTF-8 64 KiB를 초과했습니다.
        '503':
          $ref: '#/components/responses/Unavailable'
      tags:
      - Profile
    get:
      operationId: listProfiles
      summary: 종류별 프로필 버전 목록 조회
      parameters:
      - in: query
        name: key
        description: 프로필 키 정확 일치 필터. 생략하면 선택한 종류의 전체 키를 조회합니다.
        schema:
          $ref: '#/components/schemas/ProfileKey'
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 한 페이지의 최대 항목 수. 1~100, 기본 20입니다.
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        description: 건너뛸 항목 수. 이전 응답의 nextOffset을 넣으면 다음 페이지입니다.
      responses:
        '200':
          description: 발행 버전 목록. items가 빈 배열이면 결과가 없으며 nextOffset이 null이면 마지막 페이지입니다.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextOffset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileVersion'
                  nextOffset:
                    type:
                    - integer
                    - 'null'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          description: Authentication required
        '503':
          $ref: '#/components/responses/Unavailable'
      tags:
      - Profile
      description: '선택한 종류의 발행 버전을 페이지로 조회합니다. key를 지정하면 해당 키와 정확히 일치하는 버전만 반환합니다.


        key와 version의 문자열 오름차순입니다. 따라서 1.0.0 → 10.0.0 → 2.0.0 순서일 수 있으며 최신 버전을 계산하는 API가 아닙니다. 다음 페이지는 nextOffset을
        offset으로 전달하며, null이면 마지막입니다.'
  /api/v1/profiles/{kind}/{key}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/Kind'
    - in: path
      name: key
      required: true
      schema:
        $ref: '#/components/schemas/ProfileKey'
      description: 조회할 프로필의 고유 키입니다.
    - in: path
      name: version
      required: true
      schema:
        $ref: '#/components/schemas/Version'
      description: '조회할 정확한 발행 버전입니다. 예: 1.0.0'
    get:
      operationId: getProfileVersion
      summary: 프로필의 특정 버전 상세 조회
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          description: Authentication required
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      tags:
      - Profile
      description: kind·key·version으로 발행 버전 하나를 정확히 조회합니다. 저장된 spec, 내용 식별용 SHA-256 digest, 최초 생성 시각을 반환합니다. 이전
        버전 내용을 확인하거나 후속 장치/실행 기능에서 참조할 버전을 선택할 때 사용합니다. 해당 버전이 없으면 404를 반환합니다.
  /actuator/health/liveness:
    get:
      tags:
      - 상태 확인
      operationId: getLiveness
      summary: 서버 프로세스 생존 상태 확인
      description: Spring Boot 프로세스가 정상인지 확인합니다. DB 상태는 검사하지 않으므로 DB 장애만으로 서버를 반복 재시작하지 않습니다. Kubernetes liveness/startup
        probe에 사용하며 인증이 필요하지 않습니다.
      security: []
      responses:
        '200':
          description: 서버 프로세스 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: 서버 프로세스가 정상 상태가 아님
  /api/v1/devices:
    post:
      tags:
      - Device
      operationId: registerDevice
      summary: 물리 장치 등록
      description: DEVICE Profile의 발행 UUID를 참조해 장치를 등록합니다. 같은 key와 동일 생성 입력은 200, 새로운 장치는 201, 다른 생성 입력은 409입니다.
        LIVE/REPLAY/SYNTHETIC으로 데이터 출처를 구분합니다. 등록만으로 실제 연결을 ONLINE으로 표시하지 않습니다. 요청 최대 16 KiB.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Basic 인증 필요
        '404':
          description: 장치·노드·참조 Profile이 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: DB 연결 장애. 복구 후 재시도하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '201':
          description: 새 객체 생성. 기존 객체의 ID는 바뀌지 않습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '403':
          description: CSRF 토큰·세션 쿠키 누락/불일치
        '409':
          description: 현재 상태·버전·세션·sequence 충돌. 상세 조회 후 요청을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 요청 크기 제한을 초과했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - localBasic: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
    get:
      tags:
      - Device
      operationId: listDevices
      summary: 장치 목록과 연결 상태 조회
      description: key 문자열 오름차순으로 조회합니다. 해제된 장치도 이력 조회를 위해 포함합니다. 활성 세션의 최근 보고가 60초보다 오래되면 STALE이며, 보고 전에는 UNKNOWN입니다.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Basic 인증 필요
        '404':
          description: 장치·노드·참조 Profile이 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: DB 연결 장애. 복구 후 재시도하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters: &id002
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 최대 항목 수
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        description: nextOffset을 전달해 다음 페이지를 조회합니다.
  /api/v1/devices/{deviceId}:
    parameters:
    - in: path
      name: deviceId
      required: true
      schema: &id001
        type: string
        format: uuid
    get:
      tags:
      - Device
      operationId: getDevice
      summary: 장치 상세·연결 이력·최근 관측 조회
      description: 장치와 최근 연결/세션/관측 각각 최대 20개를 반환합니다. 시간은 UTC이며 신선도는 서버 수신 시각으로 판단합니다. raw 스트림은 저장하지 않습니다.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Basic 인증 필요
        '404':
          description: 장치·노드·참조 Profile이 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: DB 연결 장애. 복구 후 재시도하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Device
      operationId: updateDevice
      summary: 장치 표시 이름 수정
      description: 상세 조회에서 받은 revision과 새 displayName을 전송합니다. 동시에 수정되어 revision이 바뀌면 409입니다. Profile 참조·key·sourceMode는
        변경하지 않습니다.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Basic 인증 필요
        '404':
          description: 장치·노드·참조 Profile이 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: DB 연결 장애. 복구 후 재시도하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF 토큰·세션 쿠키 누락/불일치
        '409':
          description: 현재 상태·버전·세션·sequence 충돌. 상세 조회 후 요청을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 요청 크기 제한을 초과했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - localBasic: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
    delete:
      tags:
      - Device
      operationId: releaseDevice
      summary: 장치 해제 및 세션 종료
      description: 장치를 RELEASED로 표시하고 활성 attachment/session을 닫습니다. 과거 이력을 보존하며 반복 해제는 같은 상태를 반환합니다. 해제 후 연결·세션·관측·수정
        요청은 409입니다.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Basic 인증 필요
        '404':
          description: 장치·노드·참조 Profile이 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: DB 연결 장애. 복구 후 재시도하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: CSRF 토큰·세션 쿠키 누락/불일치
        '409':
          description: 현재 상태·버전·세션·sequence 충돌. 상세 조회 후 요청을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 요청 크기 제한을 초과했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - localBasic: []
        csrfToken: []
  /api/v1/devices/{deviceId}/attachments/{nodeId}:
    parameters:
    - in: path
      name: deviceId
      required: true
      schema: *id001
    - in: path
      name: nodeId
      required: true
      schema: *id001
    put:
      tags:
      - Device
      operationId: attachDevice
      summary: 장치를 관측된 실행 노드에 연결
      description: 최근 60초 안에 실제 관측된 Ready Node와 port를 연결합니다. 기존 활성 연결은 닫고 새 이력을 만들며 동일 node/port 재전송은 이력을 추가하지 않습니다.
        장치당 활성 연결은 하나입니다.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAttachment'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':

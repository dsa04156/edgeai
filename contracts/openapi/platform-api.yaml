              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyCommand'
      security:
      - csrfToken: []
  /api/v1/tasks/{taskId}/results:
    get:
      tags: [Result]
      operationId: getTaskResults
      summary: 작업의 검증된 결과와 artifact 메타데이터 조회
      description: >-
        저장소의 실제 파일 크기·SHA-256·형식과 고정 object version을 검증하고 DB에 확정한 결과만 반환합니다.
        Task는 있지만 결과가 아직 확정되지 않았으면 200과 빈 items를 반환합니다. Job 종료만으로 결과를 만들지 않습니다.
        각 artifact의 포트·버킷·키·버전·체크섬·크기·형식을 확인할 수 있습니다. 파일 본문, 서명 URL, 인증 토큰은 제공하지 않습니다.
      parameters:
        - name: taskId
          in: path
          required: true
          description: Run 상세에 포함된 Task UUID
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 확정된 결과 목록. 현재 Task당 최대 1개이며 검증 전에는 비어 있습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResults'}
        '400':
          description: Task UUID 형식이 잘못되었습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '404':
          description: Task가 없습니다. 결과 대기 중인 Task와 구분합니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503':
          description: 결과 메타데이터 저장소에 연결할 수 없습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/tasks/{taskId}/results/{port}/content:
    get:
      tags: [Result]
      operationId: getTaskResultContent
      summary: 검증된 JSON 출력 파일 본문 조회
      description: >-
        확정된 Result의 출력 포트만 조회합니다. 고정 object version·크기·SHA-256·형식을 다시 검증한 뒤
        1 MiB 이하 JSON 본문을 반환합니다. 서명 URL이나 저장소 자격 증명을 제공하지 않으며 응답은 no-store입니다.
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: port, in: path, required: true, schema: {type: string, maxLength: 63, pattern: '^[a-z][a-z0-9_]*$'}}
      responses:
        '200':
          description: 검증된 JSON 결과 본문
          content:
            application/json:
              schema: {}
        '404':
          description: Task 또는 확정된 출력 파일이 없습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '422':
          description: JSON 형식 또는 미리보기 크기 제한을 확인하세요.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '429':
          description: 동시 조회 한도에 도달했습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503':
          description: 저장소 조회 또는 파일 검증에 실패했습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/tasks/{taskId}/offload:
    post:
      tags:
        - Task
      operationId: offloadTask
      summary: 실행 중인 작업을 다른 노드 또는 Remote로 전환
      description: 작업의 실행 위치 전환을 요청합니다. STREAM은 그룹 전체의 체크포인트·실행 종료·권한 회수 후 선택 작업을 지정 노드로 이동하고 동료의 AUTO/NODE 정책을 유지합니다. Remote 스트리밍은 지원하지 않습니다.
      security:
        - csrfToken: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID를 유지하며 실행 위치를 바꿀 Task
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: 동일 전환 요청을 재전송할 때 유지하는 UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffloadCreate'
      responses:
        '200':
          description: 같은 전환 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffloadOperation'
        '202':
          description: 전환 접수. Location의 Operation을 조회하여 종료와 새 실행 시작을 확인하세요.
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/operations/{operationId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffloadOperation'
        '400':
          description: UUID·필드·시간 범위가 잘못되었습니다.
        '403':
          description: CSRF 세션/토큰 필요
        '404':
          description: Task 또는 대상 Node·Remote 제공자가 없습니다.
        '409':
          description: source 변경·미지원 복원 방식·부적합 target·전환 한도·키 충돌·STREAM 체크포인트 누락/이전 세대·완료 허가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 저장소 연결 실패 또는 실행·Remote 기능이 비활성입니다. 설정 확인 후 동일 키로 재전송하세요.
  /api/v1/operations/{operationId}:
    get:
      tags:
        - Operation
      operationId: getOperation
      summary: 비동기 작업 실행 전환 상태 조회
      description: >-
        TASK_OFFLOAD의 이전/새 Attempt, 대상 노드 또는 고정 Remote 제공자, drain/start 마감과 실패 코드를 조회합니다. FAILED나 CANCELLED는 Task/Attempt 이력과 함께
        확인합니다. 인증 토큰이나 내부 claim 정보는 반환하지 않습니다.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 전환 응답의 Operation UUID
      responses:
        '200':
          description: 비동기 전환 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: UUID 형식 오류
        '404':
          description: Operation이 없습니다.
        '503':
          description: 저장소 연결 실패
  /api/v1/devices/{deviceId}/sessions/{sessionId}/stream-token:
    parameters:
    - name: deviceId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    - name: sessionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Device
      operationId: issueDeviceStreamToken
      summary: 현재 장치 세션의 스트림 배정 토큰 발급
      description: 관리자가 현재 활성 Device 세션에 설치할 토큰을 발급한다. CSRF가 필요하고 반복 요청은 같은
        토큰이다. 장치 해제·세션 교체 뒤 기존 토큰은 사용할 수 없다. 토큰은 관리 API 권한이 없으며 별도 내부 스트림 배정 API에서 본인
        세대의 MQTT 자격만 조회한다. 응답을 로그/일반 metadata에 저장하지 않는다. EDGEAI_STREAM_ENABLED가 false면501이며
        공개 STREAM 실행을 활성화하는 API가 아니다.
      security:
      - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      responses:
        '200':
          description: '현재 세션에 한정된 토큰. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - deviceId
                - sessionId
                - epoch
                - tokenType
                - token
                properties:
                  deviceId: *id001
                  sessionId: *id001
                  epoch:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  tokenType:
                    const: Bearer
                  token:
                    type: string
                    format: password
                    maxLength: 128
        '400':
          description: 빈 JSON 객체가 필요함
        '403':
          description: CSRF 토큰/세션 누락
        '404':
          description: 장치가 없음
        '409':
          description: 장치 해제 또는 현재 세션 불일치
        '413':
          description: 본문16KiB 제한
        '501':
          description: 스트림 배정 비활성
        '503':
          description: DB/토큰 키 설정 장애
  /api/v1/audit-requests:
    get:
      operationId: listManagementAuditRequests
      summary: 관리 요청의 접수·인증 주체·HTTP 결과 조회
      tags: [감사]
      description: 변경 요청과 조회의401/403을 저장한 이력입니다. 정상 조회·내부 장치/Runner·직접 DB 변경은 포함하지 않습니다. 결과 미기록은 성공으로 추정하지 않습니다. 페이지 사이의 동시 변경으로 중복/누락이 있을 수 있어 손실 없는 export 용도가 아닙니다.
      parameters:
      - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: 최신 접수부터 정렬한 감사 목록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagementAuditPage'}
        '400': {$ref: '#/components/responses/InvalidAuditQuery'}
        '503': {$ref: '#/components/responses/AuditUnavailable'}
  /api/v1/audit-requests/{auditId}:
    get:
      operationId: getManagementAuditRequest
      summary: 응답의 감사 ID로 특정 요청 결과 확인
      tags: [감사]
      description: X-EdgeAI-Audit-Id의 서버 발급 UUID를 조회합니다. OUTCOME_UNKNOWN이면 실행 결과를 확인할 수 없으므로 원래 도메인의 조회와 idempotency 계약으로 확인해야 합니다. 새 감사 ID로 원래 작업을 재실행하지 않습니다.
      parameters:
      - {in: path, name: auditId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 불변 접수 기록과 선택적 HTTP 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagementAudit'}
              examples:
                recorded:
                  summary: HTTP 응답을 기록한 요청
                  value:
                    id: 00000000-0000-4000-8000-000000000001
                    startedAt: '2026-10-04T00:00:00Z'
                    method: POST
                    operation: publishProfile
                    routeTemplate: /api/v1/profiles/{kind}
                    targetId: null
                    relatedId: null
                    state: OUTCOME_RECORDED
                    outcome:
                      completedAt: '2026-10-04T00:00:00.050Z'
                      httpStatus: 201
                      disposition: HTTP_COMPLETED
                      actor: {type: LOCAL_BASIC, subject: example-operator, subjectFormat: NAME}
                unknown:
                  summary: 접수 뒤 결과가 아직 확인되지 않은 요청
                  value:
                    id: 00000000-0000-4000-8000-000000000002
                    startedAt: '2026-10-04T00:00:01Z'
                    method: POST
                    operation: publishProfile
                    routeTemplate: /api/v1/profiles/{kind}
                    targetId: null
                    relatedId: null
                    state: OUTCOME_UNKNOWN
                    outcome: null
        '400': {$ref: '#/components/responses/InvalidAuditQuery'}
        '404': {description: 해당 감사 접수 기록 없음}
        '503': {$ref: '#/components/responses/AuditUnavailable'}

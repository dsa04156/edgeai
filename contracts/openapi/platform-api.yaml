        kind:
          type: string
          enum: [GPU, NPU]
        vendor:
          type: string
        model:
          type: string
        observedAt:
          type: string
          format: date-time
        fresh:
          type: boolean
          description: 장착 정보의 원본 시각과 exporter/collector 상태 검증 결과. 사용률 수집 여부와 독립적이다.

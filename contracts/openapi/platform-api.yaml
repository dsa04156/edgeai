      description: >-
        발행된 DAG를 Run과 Task로 구체화합니다. 같은 UUID Idempotency-Key와 요청은 기존 Run을 반환하고 다른 입력은409입니다. execution은 AUTO/NODE/REMOTE를 지원하며
        taskExecutions로 작업별 최초 위치를 지정합니다. 생략한 작업은 기본 정책을 따릅니다. Remote 제공자 설정은 고정하며 자동 offload와 함께 사용할 수 없습니다. STREAM은 별도 실행 설정과
        AUTO/NODE 배치를 요구합니다. streamInputs는 현재 장치 세션을 고정합니다. 연결된 스트림 그룹의 BATCH 선행 결과가 검증된 뒤 함께 시작하며 체크포인트·이전 실행 종료·broker 권한 회수를 확인한
        후 재시도 또는 전환합니다. 완료된 Result와 불변 Attempt 이력은 보존합니다.
      responses:

        '409': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/virtual-devices/{vdId}/outputs/{outputId}/history:
    get:
      tags: [VD]
      operationId: getContinuousOutputHistory
      summary: 출력 이력과 데이터 누락 구간 조회
      description: 모든 계산 결과를 저장한다. bucketSeconds는 조회 결과만 집계하며 저장 주기를 바꾸지 않는다. 기본 최근 1시간, 최대 조회 기간 31일. 재연결 시 과거 결과를 재생하지 않는다.
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: outputId, in: path, required: true, schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$'}}
      - {name: from, in: query, schema: {type: string, format: date-time}}
      - {name: to, in: query, schema: {type: string, format: date-time}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 2000, default: 1000}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 256}}
      - {name: bucketSeconds, in: query, schema: {type: integer, minimum: 1, maximum: 86400}, description: cursor와 함께 사용할 수 없습니다. 결과 구간은 최대 2000개입니다.}
      responses:
        '200': {description: 이력과 누락 구간, content: {application/json: {schema: {$ref: '#/components/schemas/ContinuousHistory'}}}}
        '400': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/virtual-devices:
    get:
      tags:
      - VD
      operationId: listVirtualDevices
      summary: 등록·해제된 VD 목록 조회
      description: key 순서로 논리 VD를 조회합니다. REGISTERED를 Ready로 해석하지 마세요. 해제 이력도 보존합니다.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 한 페이지 수
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: 건너뛸 수
      responses:
        '200':
          description: VD 목록과 다음 offset
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - nextOffset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualDevice'
                  nextOffset:
                    type:
                    - integer
                    - 'null'
        '400':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/virtual-devices/{vdId}:
    parameters:
    - name: vdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 원본·실행 위치 변경에도 유지할 VD UUID
    get:
      tags:
      - VD
      operationId: getVirtualDevice
      summary: VD 설정과 활성·과거 원본 연결 조회
      description: 최신 revision, 불변 Profile 참조와 source 이력을 조회합니다. closedAt이 null인 연결만 현재 원본입니다. 이력은 최신100개이며 더 있으면 sourceHistoryTruncated=true입니다.
      responses:
        '200':
          description: VD 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualDeviceDetail'
        '400':
          $ref: '#/components/responses/Unavailable'
        '404':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - VD
      operationId: releaseVirtualDevice
      summary: VD 논리 해제와 원본 연결 종료
      description: VD를 RELEASED로 표시하고 활성 source를 닫습니다. 관리 중인 실행이 있으면 종료 Operation을 함께 기록하며 완료 전까지 이전 원본 Device 해제를 막습니다. 물리
        Device는 해제하지 않으며 이력과 vdId를 유지합니다. 반복 해제는 같은 상태를 반환합니다. 응답은 논리 해제이며 실제 Pod 종료 완료를 뜻하지 않습니다. execution의 pendingOperation과
        Operation 조회에서 실제 종료를 확인하세요.
      security:
      - csrfToken: []
      responses:
        '200':
          description: 해제된 VD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualDevice'
        '400':
          $ref: '#/components/responses/Unavailable'
        '403':
          description: CSRF 쿠키/토큰 필요
        '404':
          $ref: '#/components/responses/Unavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/virtual-devices/{vdId}/provision:
    post:
      tags: [VD]
      operationId: provisionVirtualDevice
      summary: VD 실행 시작 요청
      description: >-
        현재 설정으로 지속 실행을 시작합니다. 같은 설정의 실행이 있으면 재사용하며, 다른 설정이면 종료 후 교체합니다.
        현재 revision과 UUID Idempotency-Key를 보내세요. 같은 VD·키·요청 재전송은 동일 Operation을 반환하고 다른 요청은409입니다.
        새 요청은 기존 진행 작업을 SUPERSEDED로 바꿀 수 있습니다. 같은 키의 재전송은 상태가 바뀌어도 새 실행을 만들지 않습니다.
        VD 실행 기능은 기본 비활성이며 비활성 요청은503입니다. 현재는 지속 실행의 준비/종료를 관리하며 VD Task 배정은 후속 연결 범위입니다.
      security: [{csrfToken: []}]
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 동일 요청 재전송에서 유지할 UUID}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VDExecutionRequest'}
            example: {revision: 0}
      responses:
        '202':
          description: 새 Operation 저장. 응답의 state와 execution에서 실제 진행을 확인하세요.
          headers:
            Location: {schema: {type: string}, description: '/api/v1/operations/{operationId}'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '200':
          description: 동일 요청의 기존 Operation
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '400': {$ref: '#/components/responses/Unavailable'}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Unavailable'}
        '413': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/virtual-devices/{vdId}/drain:
    post:
      tags: [VD]
      operationId: drainVirtualDeviceRuntime
      summary: VD 실행 종료 요청
      description: >-
        새 작업 수용을 중단하고 drain 후 물리 Pod 종료를 기다립니다. 제한 시간 초과는 강제 종료로 전환합니다. 실행이 없으면 즉시 SUCCEEDED이며 VD 등록은 유지됩니다.
        현재 revision과 UUID Idempotency-Key를 보내세요. 같은 VD·키·요청 재전송은 동일 Operation을 반환하고 다른 요청은409입니다.
        새 요청은 기존 진행 작업을 SUPERSEDED로 바꿀 수 있습니다. 같은 키의 재전송은 상태가 바뀌어도 새 실행을 만들지 않습니다.
        VD 실행 기능은 기본 비활성이며 비활성 요청은503입니다. 현재는 지속 실행의 준비/종료를 관리하며 VD Task 배정은 후속 연결 범위입니다.
      security: [{csrfToken: []}]
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 동일 요청 재전송에서 유지할 UUID}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VDExecutionRequest'}
            example: {revision: 0}
      responses:
        '202':
          description: 새 Operation 저장. 응답의 state와 execution에서 실제 진행을 확인하세요.
          headers:
            Location: {schema: {type: string}, description: '/api/v1/operations/{operationId}'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '200':
          description: 동일 요청의 기존 Operation
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '400': {$ref: '#/components/responses/Unavailable'}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/Unavailable'}
        '409': {$ref: '#/components/responses/Unavailable'}
        '413': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/virtual-devices/{vdId}/execution:
    get:
      tags: [VD]
      operationId: getVirtualDeviceExecution
      summary: VD 실행 준비 상태·세대·작업 이력 조회
      description: >-
        asOf 시점의 일관된 DB 스냅샷입니다. ready는 RUNNING 의도·Pod Ready 관측·미만료 인증 lease를 모두 요구합니다.
        과거 observedState=READY만으로 현재 준비 상태를 판단하지 마세요. current는 미종료 실행이며 없으면 null입니다.
        pendingOperation은 현재 진행 작업이며 runtimeHistory/bindings/operations는 각각 최신100개입니다.
        각 Truncated 값이 true이면 이전 이력이 더 있습니다. 기능 비활성·VD 해제 후에도 이력은 조회 가능합니다.
        세션·자격·내부 설정은 반환하지 않습니다. 성공한 Operation도 현재 실행이나 Task/Result 성공을 보장하지 않습니다.
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      responses:
        '200':
          description: VD 실행 상태와 보존된 이력
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDExecution'}
        '400': {$ref: '#/components/responses/Unavailable'}
        '404': {$ref: '#/components/responses/Unavailable'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 쓰기 요청은 세션 쿠키와 함께 이 헤더가 필요합니다. Swagger는 자동 발급·전달하므로 이 입력칸을 비워 두세요. 직접 호출할 때는 getCsrfToken을 먼저 사용합니다.
  parameters:
    Kind:
      in: path
      name: kind
      required: true
      schema:
        type: string
        enum:
          - DEVICE
          - SERVICE
      description: 'DEVICE: 장치 규격 / SERVICE: 서비스 규격. 같은 key/version이라도 종류가 다르면 별개입니다.'
  responses:
    InvalidAuditQuery:
      description: 감사 ID의 UUID 형식 또는 페이지 범위가 잘못되었습니다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
          example: {code: INVALID_AUDIT_QUERY, message: 감사 ID와 페이지 범위를 확인하세요.}
    AuditUnavailable:
      description: 감사 저장소 조회 불가
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
          example: {code: AUDIT_STORE_UNAVAILABLE, message: 감사 저장소에 연결할 수 없습니다.}
    Invalid:
      description: 종류·키·버전·페이지·JSON 형식이 잘못되었습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_PROFILE
            message: 종류, 키, 버전과 JSON 규격을 확인하세요. 규격은 비어 있지 않은 객체여야 합니다.
    Conflict:
      description: 같은 종류·키·버전에 다른 내용이 이미 발행되었습니다. 새 버전을 사용하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_CONFLICT
            message: 이미 발행한 버전입니다. 내용을 바꾸려면 새 버전을 등록하세요.
    NotFound:
      description: 해당 발행 버전이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_NOT_FOUND
            message: 해당 Profile 버전을 찾을 수 없습니다.
    Unavailable:
      description: DB 연결 등 저장소 문제로 요청을 처리할 수 없습니다. 복구 후 재시도하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_STORE_UNAVAILABLE
            message: Profile 저장소에 연결할 수 없습니다. 잠시 후 다시 시도하세요.
  schemas:
    ManagedDeviceProperty:
      type: object
      additionalProperties: false
      required: [name, dataType]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 63}
        register: {type: integer, description: 'Holding 40001/input 30001/coil 1 maps to wire address 0.'}
        dataType: {type: string, enum: [float32, float64, int16, uint16, int32, uint32, bool, string]}
        nodeId: {type: string, maxLength: 512, description: OPC-UA NodeId, e.g. ns=1;s=temperature}
        topic: {type: string, maxLength: 256, description: Exact MQTT input topic. Wildcards and edgeai/devices/ output topics are rejected.}
        jsonPath: {type: string, maxLength: 256, description: Dot-separated JSON object path. Required for Serial JSON and Sense HAT.}
        sensor: {type: string, maxLength: 63, description: Serial JSON frame sensor selector, e.g. acceleration.}
        function: {type: string, enum: [holding, input, coil], description: Modbus default holding.}
        byteOrder: {type: string, enum: [ABCD, BADC, CDAB, DCBA], description: Modbus default ABCD.}
        scale: {type: number, default: 1}
        offset: {type: number, default: 0}
        unit: {type: string}
    ManagedDeviceInput:
      type: object
      additionalProperties: false
      required:
      - name
      - protocol
      - properties
      - targetNode
      properties:
        name:
          type: string
          maxLength: 63
        kind:
          type: string
          enum:
          - physical
          - virtual
          default: physical
        protocol:
          type: string
          enum:
          - modbus-tcp
          - opc-ua
          - mqtt
          - virtual
          - serial-json
          - sensehat
        host:
          type: string
          maxLength: 253
          description: Required for network protocols; omitted for local hardware.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 'Protocol defaults: Modbus 502, OPC-UA 4840, MQTT 1883, Virtual 8080.'
        targetNode:
          type: string
          maxLength: 63
        collectionInterval:
          type: integer
          minimum: 100
          maximum: 60000
          default: 1000
        protocolConfig:
          type: object
          additionalProperties: false
          properties:
            devicePath:
              type: string
              maxLength: 80
              description: Serial JSON /dev/edgeai/<endpoint> or Sense HAT /dev/i2c-1.
            deviceId:
              type: string
              maxLength: 63
              description: Expected physical source device_id in JSON frames.
            baudRate:
              type: integer
              enum:
              - 9600
              - 19200
              - 38400
              - 57600
              - 115200
              description: Serial JSON defaults to 115200.
            unitId:
              type: integer
              minimum: 1
              maximum: 247
              description: Modbus unit ID (default 1).
            timeoutMs:
              type: integer
              minimum: 100
              maximum: 5000
              default: 1000
            securityMode:
              type: string
              enum:
              - None
              description: Initial OPC-UA driver supports anonymous SecurityMode None only.
            path:
              type: string
              maxLength: 512
              description: OPC-UA endpoint path or Virtual runtime JSON path (default /properties).
            staleMs:
              type: integer
              minimum: 100
              maximum: 60000
              description: MQTT input message freshness limit.
        properties:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ManagedDeviceProperty'
        sourceName:
          type: string
          maxLength: 63
          description: Physical source name shared by measurement devices; defaults to protocolConfig.deviceId or name.
    ManagedDevice:
      type: object
      required:
      - id
      - uid
      - profile
      - model
      - targetNode
      - state
      - lastSeen
      - properties
      - mapper
      - resourceVersion
      properties:
        id:
          type: string
        uid:
          type: string
          format: uuid
        profile:
          $ref: '#/components/schemas/ManagedDeviceInput'
        model:
          type: string
        targetNode:
          type: string
        state:
          type: string
        observedState:
          type: string
          description: Raw DeviceStatus state
        stateReason:
          type: string
          enum:
          - DMI
          - STALE_DMI_REPORT
          - MAPPER_NOT_READY
        lastSeen:
          type: integer
          format: int64
        resourceVersion:
          type: string
        mapper:
          type: object
          required:
          - name
          - ready
          properties:
            name:
              type: string
            ready:
              type: boolean
        properties:
          type: object
          additionalProperties:
            type: object
            required:
            - value
            - timestamp
            properties:
              value:
                type: string
              timestamp:
                type: integer
                format: int64
        configurationUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 마지막 수집 설정 변경 시각. 이 시각 이전의 twin은 새 처리 창에서 사용하지 않습니다.
        configurationSha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Mapper가 적용해야 할 수집 설정 식별자. 해당 식별자를 보고한 관측값만 VD 입력으로 사용합니다.
    ManagedDevicePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ManagedDevice'}}
    ManagedDeviceProfile:
      type: object
      additionalProperties: false
      required:
      - name
      - protocol
      - properties
      properties:
        name:
          type: string
          maxLength: 63
        protocol:
          type: string
          enum:
          - modbus-tcp
          - opc-ua
          - mqtt
          - virtual
          - serial-json
          - sensehat
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ManagedDeviceProperty'
    ManagedDeviceProfilePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ManagedDeviceProfile'}}
    DeviceConnectionResult:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
        value: {type: string}
        error: {type: string}
    DeviceProtocolPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, available, kind]
            properties:
              id: {type: string}
              available: {type: boolean}
              kind: {type: string, enum: [physical, virtual]}
    SensorRegistrationTemplate:
      type: object
      required: [id, label, serviceName, nodeName, profileName, protocol, resources, endpoint, baudRates]
      properties:
        id: {type: string}
        label: {type: string}
        serviceName: {type: string}
        nodeName: {type: string}
        profileName: {type: string}
        protocol: {type: string, enum: [SERIAL, I2C]}
        resources: {type: array, items: {type: string}}
        endpoint: {type: string}
        baudRates: {type: array, items: {type: integer, enum: [1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600]}}
    SensorRegistrationCatalog:
      type: object
      required: [templates]
      properties:
        templates: {type: array, items: {$ref: '#/components/schemas/SensorRegistrationTemplate'}}
    SensorRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name, templateId, endpoint, physicalDeviceId]
      properties:
        name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
        templateId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
        endpoint: {type: string, maxLength: 80, description: 'Serial은 /dev/edgeai/ 아래의 단일 장치명, Sense HAT는 /dev/i2c-1'}
        physicalDeviceId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'}
        baudRate: {type: [integer, 'null'], enum: [null, 1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600]}
    SensorRegistrationResult:
      type: object
      required: [name, serviceName, profileName, created, adminState, operatingState]
      properties:
        name: {type: string}
        serviceName: {type: string}
        profileName: {type: string}
        created: {type: boolean}
        adminState: {type: string}
        operatingState: {type: string}
    SensorReading:
      type: object
      required: [resource, valueType, value, units, observedAt]
      properties:
        resource: {type: string}
        valueType: {type: string}
        value: {type: string, description: "원본 문자열 값. Binary는 [binary]로 표시"}
        units: {type: string}
        observedAt: {type: string, format: date-time}
    SensorReadings:
      type: object
      required: [device, fetchedAt, readings]
      properties:
        device: {type: string}
        fetchedAt: {type: string, format: date-time}
        readings: {type: array, items: {$ref: '#/components/schemas/SensorReading'}}
    SensorCommand:
      type: object
      required: [name, readable, writable, parameters]
      properties:
        name: {type: string}
        readable: {type: boolean}
        writable: {type: boolean}
        parameters:
          type: array
          items:
            type: object
            required: [resource, valueType]
            properties:
              resource: {type: string}
              valueType: {type: string}
    SensorCommands:
      type: object
      required: [device, adminState, operatingState, commands]
      properties:
        device: {type: string}
        adminState: {type: string}
        operatingState: {type: string}
        commands: {type: array, items: {$ref: '#/components/schemas/SensorCommand'}}
    SensorCommandRequest:
      type: object
      required: [device, command, method, values]
      properties:
        device: {type: string}
        command: {type: string}
        method: {type: string, enum: [GET, PUT]}
        values: {type: object, additionalProperties: {type: string, maxLength: 4096}}
    SensorCommandResult:
      type: object
      required: [device, command, method, completedAt, readings]
      properties:
        device: {type: string}
        command: {type: string}
        method: {type: string, enum: [GET, PUT]}
        completedAt: {type: string, format: date-time}
        readings: {type: array, items: {$ref: '#/components/schemas/SensorReading'}}
    ManagementAuditPage:
      type: object
      required: [items, nextOffset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ManagementAudit'}}
        nextOffset: {type: [integer, 'null'], minimum: 0}
    ManagementAudit:
      type: object
      example:
        id: 00000000-0000-4000-8000-000000000002
        startedAt: '2026-10-04T00:00:01Z'
        method: POST
        operation: publishProfile
        routeTemplate: /api/v1/profiles/{kind}
        targetId: null
        relatedId: null
        state: OUTCOME_UNKNOWN
        outcome: null
      required: [id, startedAt, method, operation, routeTemplate, targetId, relatedId, state, outcome]
      properties:
        id: {type: string, format: uuid}
        startedAt: {type: string, format: date-time}
        method: {type: string}
        operation: {type: string, description: 서버의 고정 operation ID 또는 unmappedManagementRequest}
        routeTemplate: {type: string, description: 원문 경로/쿼리 없이 서버가 정한 route template}
        targetId: {type: [string, 'null'], format: uuid}
        relatedId: {type: [string, 'null'], format: uuid}
        state: {type: string, enum: [OUTCOME_UNKNOWN, OUTCOME_RECORDED]}
        outcome:
          oneOf:
          - {$ref: '#/components/schemas/ManagementAuditOutcome'}
          - {type: 'null'}
    ManagementAuditOutcome:
      type: object
      required: [completedAt, httpStatus, disposition, actor]
      properties:
        completedAt: {type: string, format: date-time}
        httpStatus: {type: integer, minimum: 100, maximum: 599}
        disposition: {type: string, enum: [HTTP_COMPLETED, HANDLER_FAILED]}
        actor:
          type: object
          required: [type, subject, subjectFormat]
          properties:
            type: {type: string, enum: [LOCAL_BASIC, UNAUTHENTICATED]}
            subject: {type: [string, 'null'], maxLength: 256}
            subjectFormat: {type: string, enum: [NAME, SHA256, NONE], description: 인증된 정상 이름·긴/제어문자 이름의 해시·미인증을 구분. 원래 인증 헤더는 저장하지 않음}
    ProfileKey:
      type: string
      maxLength: 100
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      description: 소문자 영문으로 시작하는 프로필 키. 영문 소문자·숫자와 구분자 점/밑줄/하이픈을 사용하며 최대 100자입니다.
      example: temperature-sensor
    Version:
      type: string
      maxLength: 32
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      description: MAJOR.MINOR.PATCH 형태의 숫자 버전. 01처럼 앞에 0을 붙이거나 prerelease 문자를 붙일 수 없습니다.
      example: 1.0.0
    PublishProfile:
      type: object
      additionalProperties: false
      required:
      - key
      - version
      - spec
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 비어 있지 않은 JSON 규격 문서입니다. 현재 종류별 실행 스키마·외부 참조의 호환성은 검증하지 않습니다.
    ProfileVersion:
      type: object
      required:
        - id
        - kind
        - key
        - version
        - spec
        - digest
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 이 발행 버전의 서버 생성 UUID입니다.
        kind:
          type: string
          enum:
            - DEVICE
            - SERVICE
          description: 프로필 종류입니다. 종류마다 키·버전 공간이 구분됩니다.
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          additionalProperties: true
          description: 발행 시 저장된 JSON 규격입니다.
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          description: 종류와 정규화된 spec의 SHA-256 식별값. JSON 키 순서나 동등한 숫자 표기는 같은 값이며, spec 또는 종류가 바뀌면 달라집니다. 상세 규칙은 ADR 0002를 따릅니다.
        createdAt:
          type: string
          format: date-time
          description: 최초 발행 시각입니다. 동일 내용 재등록 시 유지됩니다.
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_PROFILE
            - DEVICE_PROFILE_RETIRED
            - PROFILE_CONFLICT
            - PROFILE_NOT_FOUND
            - PROFILE_STORE_UNAVAILABLE
            - PAYLOAD_TOO_LARGE
            - INVALID_DEVICE
            - DEVICE_CONFLICT
            - DEVICE_NOT_FOUND
            - NODE_NOT_FOUND
            - NODE_NOT_READY
            - DEVICE_RELEASED
            - STALE_SESSION
            - OBSERVATION_CONFLICT
            - DEVICE_STORE_UNAVAILABLE
            - INVALID_WORKFLOW
            - WORKFLOW_NOT_FOUND
            - WORKFLOW_CONFLICT
            - RUN_NOT_FOUND
            - TASK_NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - CANNOT_CANCEL
            - STREAM_NOT_IMPLEMENTED
            - STREAM_EXECUTION_POLICY_UNSUPPORTED
            - STREAM_RECOVERY_UNSUPPORTED
            - STREAM_SOURCE_INACTIVE
            - WORKFLOW_STORE_UNAVAILABLE
            - INVALID_TASK_ID
            - RESULT_STORE_UNAVAILABLE
            - RESULT_NOT_FOUND
            - RESULT_PREVIEW_UNSUPPORTED
            - RESULT_PREVIEW_BUSY
            - RESULT_JSON_INVALID
            - RESULT_VERIFICATION_FAILED
            - RUNTIME_DISABLED
            - REMOTE_DISABLED
            - REMOTE_PROVIDER_NOT_FOUND
            - REMOTE_CONFIGURATION_CHANGED
            - REMOTE_TELEMETRY_UNSUPPORTED
            - OFFLOAD_SOURCE_CHANGED
            - OFFLOAD_LIMIT
            - OFFLOAD_RECOVERY_UNSUPPORTED
            - OFFLOAD_TARGET_INVALID
            - OPERATION_NOT_FOUND
            - INVALID_VIRTUAL_DEVICE
            - DEVICE_IN_USE
        message:
          type: string
    PlatformInfo:
      type: object
      required:
        - name
        - version
        - milestone
        - capabilities
      properties:
        name:
          type: string
          const: edgeai
        version:
          type: string
        milestone:
          type: string
          const: M4
          description: 전체 수용 검증을 완료한 최종 단계. 진행 중 단계의 일부 기능은 capabilities에 포함될 수 있습니다.
        capabilities:
          type: array
          items:
            type: string
      example:
        name: edgeai
        version: 0.1.0
        milestone: M4
        capabilities:
          - profiles
          - devices
          - nodes
          - workflows
          - runs
          - tasks
          - results
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      example:
        status: UP
    DeviceCreate:
      type: object

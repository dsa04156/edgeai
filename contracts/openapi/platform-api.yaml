      description: >-
        고정된 장치 세션·출처와 논리 연결, 동시에 실행되는 componentId, 최신 경로 세대의 상태를 조회합니다.
        generation이 null이면 현재 실행 주체의 배정을 기다리는 중입니다. ACTIVE도 모델 처리나 Result 성공을
        의미하지 않습니다. CLOSED는 broker 권한 회수가 확인된 이력입니다. MQTT 비밀번호·장치 토큰·서명 URL은
        반환하지 않습니다. 같은 DB snapshot에서 조회하며, nextOffset이 있으면 다음 페이지를 요청합니다.

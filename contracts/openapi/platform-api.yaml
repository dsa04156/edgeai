          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        observedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        attributes:
          type: object
          additionalProperties: true
        receivedAt:
          type: string
          format: date-time
    DeviceDetail:
      type: object
      additionalProperties: false
      required:
      - device
      - attachments
      - sessions
      - observations
      properties:
        device:
          $ref: '#/components/schemas/Device'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttachment'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSession'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceObservation'
    InfrastructureNode:
      type: object
      additionalProperties: false
      required: [name, kind, architecture, operatingSystem, status]
      properties:
        name: {type: string}
        kind:
          type: string
          enum: [EDGE_AI_SERVER, EDGE_DEVICE, UNKNOWN]
          description: 현재 노드 역할·환경 라벨에 따른 분류. 누락·충돌은 UNKNOWN.
        architecture: {type: string}
        operatingSystem: {type: string}
        status: {type: string, enum: [READY, NOT_READY, UNKNOWN]}
    ClusterSensor:
      type: object
      additionalProperties: false
      required: [name, nodeName, model, serviceName, adminState, operatingState, properties]
      properties:
        name: {type: string}
        nodeName: {type: string}
        model: {type: string}
        serviceName: {type: string}
        adminState: {type: string}
        operatingState: {type: string}
        properties: {type: array, items: {type: string}}
    InfrastructureSnapshot:
      type: object
      additionalProperties: false
      required: [nodesStatus, sensorsStatus, fetchedAt, nodes, sensors]
      properties:
        nodesStatus: {type: string, enum: [AVAILABLE, UNAVAILABLE, DISABLED]}
        sensorsStatus: {type: string, enum: [AVAILABLE, UNAVAILABLE, DISABLED]}
        fetchedAt: {type: string, format: date-time}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/InfrastructureNode'}
        sensors:
          type: array
          items: {$ref: '#/components/schemas/ClusterSensor'}
    NodeMetric:
      type: object
      additionalProperties: false
      required: [key, device, value, unit, observedAt, fresh]
      properties:
        key:
          type: string
          enum: [CPU_USAGE, CPU_TEMPERATURE, MEMORY_USAGE, GPU_USAGE, GPU_MEMORY_USED, GPU_MEMORY_TOTAL, GPU_TEMPERATURE, GPU_POWER, NPU_USAGE, NPU_MEMORY_USED, NPU_MEMORY_TOTAL, NPU_TEMPERATURE, NPU_POWER]
        device:
          type: string
          description: 가속기 식별자. CPU/호스트 메모리는 빈 문자열.
        value:
          type: number
          description: 유한한 실수. 사용률은 0부터 100까지의 백분율.
        unit:
          type: string
          enum: [PERCENT, BYTES, CELSIUS, WATTS]
        observedAt:
          type: string
          format: date-time
        fresh:
          type: boolean
          description: 원본 시각이 90초 이내이고 해당 exporter/collector가 정상인지 여부.
    NodeReadiness:
      type: object
      additionalProperties: false
      required: [status, observedAt, fresh]
      properties:
        status:
          type: string
          enum: [READY, NOT_READY, UNKNOWN]
          description: kube-state-metrics가 수집한 Kubernetes Node Ready 조건.
        observedAt:
          type: string
          format: date-time
        fresh:
          type: boolean
          description: 원본 시각이 90초 이내이고 kube-state-metrics 수집이 정상인지 여부.
    NodeAccelerator:

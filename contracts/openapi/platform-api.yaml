  /api/v1/tasks/{taskId}/results:
    get:
      tags: [Result]
      operationId: getTaskResults
      summary: 작업의 검증된 결과와 artifact 메타데이터 조회
      description: >-
        저장소의 실제 파일 크기·SHA-256·형식과 고정 object version을 검증하고 DB에 확정한 결과만 반환합니다.
        Task는 있지만 결과가 아직 확정되지 않았으면 200과 빈 items를 반환합니다. Job 종료만으로 결과를 만들지 않습니다.
        각 artifact의 포트·버킷·키·버전·체크섬·크기·형식을 확인할 수 있습니다. 파일 본문, 서명 URL, 인증 토큰은 제공하지 않습니다.
      parameters:
        - name: taskId
          in: path
          required: true
          description: Run 상세에 포함된 Task UUID
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 확정된 결과 목록. 현재 Task당 최대 1개이며 검증 전에는 비어 있습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResults'}
        '400':
          description: Task UUID 형식이 잘못되었습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '401': {description: Basic 인증이 필요합니다.}
        '404':
          description: Task가 없습니다. 결과 대기 중인 Task와 구분합니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503':
          description: 결과 메타데이터 저장소에 연결할 수 없습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 쓰기 요청은 세션 쿠키와 함께 이 헤더가 필요합니다. Swagger는 자동 발급·전달하므로 이 입력칸을 비워 두세요. 직접 호출할 때는 getCsrfToken을 먼저 사용합니다.
    localBasic:
      type: http
      scheme: basic
      description: 개발·내부 검증용 계정(EDGEAI_API_USER / EDGEAI_API_PASSWORD)입니다. 운영용 사용자·역할 관리는 후속 범위입니다.
  parameters:
    Kind:
      in: path
      name: kind
      required: true
      schema:
        type: string
        enum:
        - DEVICE
        - SERVICE
        - VD
      description: 'DEVICE: 장치 규격 / SERVICE: 서비스 규격 / VD: 가상 장치 규격. 동일한 key/version이라도 종류가 다르면 별개입니다.'
  responses:
    Invalid:
      description: 종류·키·버전·페이지·JSON 형식이 잘못되었습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_PROFILE
            message: 종류, 키, 버전과 JSON 규격을 확인하세요. 규격은 비어 있지 않은 객체여야 합니다.
    Conflict:
      description: 같은 종류·키·버전에 다른 내용이 이미 발행되었습니다. 새 버전을 사용하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_CONFLICT
            message: 이미 발행한 버전입니다. 내용을 바꾸려면 새 버전을 등록하세요.
    NotFound:
      description: 해당 발행 버전이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_NOT_FOUND
            message: 해당 Profile 버전을 찾을 수 없습니다.
    Unavailable:
      description: DB 연결 등 저장소 문제로 요청을 처리할 수 없습니다. 복구 후 재시도하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_STORE_UNAVAILABLE
            message: Profile 저장소에 연결할 수 없습니다. 잠시 후 다시 시도하세요.
  schemas:
    ProfileKey:
      type: string
      maxLength: 100
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      description: 소문자 영문으로 시작하는 프로필 키. 영문 소문자·숫자와 구분자 점/밑줄/하이픈을 사용하며 최대 100자입니다.
      example: temperature-sensor
    Version:
      type: string
      maxLength: 32
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      description: MAJOR.MINOR.PATCH 형태의 숫자 버전. 01처럼 앞에 0을 붙이거나 prerelease 문자를 붙일 수 없습니다.
      example: 1.0.0
    PublishProfile:
      type: object
      additionalProperties: false
      required:
      - key
      - version
      - spec
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 비어 있지 않은 JSON 규격 문서입니다. 현재 종류별 실행 스키마·외부 참조의 호환성은 검증하지 않습니다.
    ProfileVersion:
      type: object
      required:
      - id
      - kind
      - key
      - version
      - spec
      - digest
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 이 발행 버전의 서버 생성 UUID입니다.
        kind:
          type: string
          enum:
          - DEVICE
          - SERVICE
          - VD
          description: 프로필 종류입니다. 종류마다 키·버전 공간이 구분됩니다.
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          additionalProperties: true
          description: 발행 시 저장된 JSON 규격입니다.
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          description: 종류와 정규화된 spec의 SHA-256 식별값. JSON 키 순서나 동등한 숫자 표기는 같은 값이며, spec 또는 종류가 바뀌면 달라집니다. 상세 규칙은 ADR 0002를 따릅니다.
        createdAt:
          type: string
          format: date-time
          description: 최초 발행 시각입니다. 동일 내용 재등록 시 유지됩니다.
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INVALID_PROFILE
          - PROFILE_CONFLICT
          - PROFILE_NOT_FOUND
          - PROFILE_STORE_UNAVAILABLE
          - PAYLOAD_TOO_LARGE
          - INVALID_DEVICE
          - DEVICE_CONFLICT
          - DEVICE_NOT_FOUND
          - NODE_NOT_FOUND
          - NODE_NOT_READY
          - DEVICE_RELEASED
          - STALE_SESSION
          - OBSERVATION_CONFLICT
          - DEVICE_STORE_UNAVAILABLE
          - INVALID_WORKFLOW
          - WORKFLOW_NOT_FOUND
          - WORKFLOW_CONFLICT
          - RUN_NOT_FOUND
          - TASK_NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - CANNOT_CANCEL
          - STREAM_NOT_IMPLEMENTED
          - WORKFLOW_STORE_UNAVAILABLE
          - INVALID_TASK_ID
          - RESULT_STORE_UNAVAILABLE
        message:
          type: string
    PlatformInfo:
      type: object
      required:
      - name
      - version
      - milestone
      - capabilities
      properties:
        name:
          type: string
          const: edgeai
        version:
          type: string
        milestone:
          type: string
          const: M4
        capabilities:
          type: array
          items:
            type: string
      example:
        name: edgeai
        version: 0.1.0
        milestone: M4
        capabilities:
        - profiles
        - devices
        - nodes
        - workflows
        - runs
        - tasks
        - results
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      example:
        status: UP
    DeviceCreate:
      type: object
      additionalProperties: false
      required:
      - key
      - displayName
      - profileVersionId
      - sourceMode
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        profileVersionId:
          type: string
          format: uuid
        sourceMode:
          type: string
          enum:
          - LIVE
          - REPLAY
          - SYNTHETIC
    DevicePatch:
      type: object
      additionalProperties: false
      required:
      - revision
      - displayName
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    DeviceAttachmentInput:
      type: object
      additionalProperties: false
      required:
      - port
      properties:
        port:
          type: string
          minLength: 1
          maxLength: 128
    DeviceSessionInput:
      type: object
      additionalProperties: false
      required:
      - bootId
      properties:
        bootId:
          type: string
          format: uuid
    DeviceObservationInput:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - sequence
      - observedAt
      - status
      - attributes
      properties:
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        observedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        attributes:
          type: object
          additionalProperties: true
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - displayName
      - profileVersionId
      - sourceMode
      - state
      - revision
      - sessionEpoch
      - connectionStatus
      - lastSeenAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        profileVersionId:
          type: string
          format: uuid
        sourceMode:
          type: string
          enum:
          - LIVE
          - REPLAY
          - SYNTHETIC
        state:
          type: string
          enum:
          - ACTIVE
          - RELEASED
        revision:
          type: integer
          minimum: 0
        sessionEpoch:
          type: integer
          minimum: 0
        connectionStatus:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
          - STALE
          - RELEASED
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeviceAttachment:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - nodeId
      - port
      - attachedAt
      - detachedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        nodeId:
          type: string
          format: uuid
        port:
          type: string
        attachedAt:
          type: string
          format: date-time
        detachedAt:
          type:
          - string
          - 'null'
          format: date-time
    DeviceSession:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - bootId
      - epoch
      - lastSequence
      - openedAt
      - closedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        bootId:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
        lastSequence:
          type: integer
          minimum: -1
        openedAt:
          type: string
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
    DeviceObservation:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - sessionId
      - sequence
      - observedAt
      - status
      - attributes
      - receivedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        observedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        attributes:
          type: object
          additionalProperties: true
        receivedAt:
          type: string
          format: date-time
    DeviceDetail:
      type: object
      additionalProperties: false
      required:
      - device
      - attachments
      - sessions
      - observations
      properties:
        device:
          $ref: '#/components/schemas/Device'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttachment'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSession'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceObservation'
    ExecutionNode:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - architecture
      - operatingSystem
      - status
      - cpu
      - memory
      - labels
      - observedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        architecture:
          type: string
        operatingSystem:
          type: string
        status:
          type: string
          enum:
          - READY
          - NOT_READY
          - UNKNOWN
          - REMOVED
          - STALE
        cpu:
          type: string
        memory:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        observedAt:
          type: string
          format: date-time
    DevicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextOffset:
          type:
          - integer
          - 'null'
    NodePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionNode'
        nextOffset:
          type:
          - integer
          - 'null'
    WorkflowCreate:
      type: object
      additionalProperties: false
      required:
      - key
      - displayName
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    DagTask:
      type: object
      additionalProperties: false
      required:
      - key
      - serviceProfileVersionId
      - parameters
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        serviceProfileVersionId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties: true
    DagDependency:
      type: object
      additionalProperties: false
      required:
      - fromTask
      - toTask
      - fromPort
      - toPort
      - mode
      properties:
        fromTask:
          $ref: '#/components/schemas/ProfileKey'
        toTask:
          $ref: '#/components/schemas/ProfileKey'
        fromPort:
          $ref: '#/components/schemas/ProfileKey'
        toPort:
          $ref: '#/components/schemas/ProfileKey'
        mode:
          type: string
          enum:
          - BATCH
          - STREAM
    WorkflowDag:
      type: object
      additionalProperties: false
      required:
      - tasks
      - dependencies
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DagTask'
          minItems: 1
          maxItems: 128
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DagDependency'
          maxItems: 512
    WorkflowPublish:
      type: object
      additionalProperties: false
      required:
      - version
      - tasks
      - dependencies
      properties:
        version:
          $ref: '#/components/schemas/Version'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DagTask'
          minItems: 1
          maxItems: 128
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DagDependency'
          maxItems: 512
    Workflow:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - displayName
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkflowVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - workflowId
      - version
      - dag
      - digest
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/Version'
        dag:
          $ref: '#/components/schemas/WorkflowDag'
        digest:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkflowDetail:
      type: object
      additionalProperties: false
      required:
      - workflow
      - versions
      - nextOffset
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersion'
        nextOffset:
          type:
          - integer
          - 'null'
    ExecutionPolicy:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - mode
        properties:
          mode:
            type: string
            enum:
            - AUTO
      - type: object
        additionalProperties: false
        required:
        - mode
        - nodeId
        properties:
          mode:
            type: string
            enum:
            - NODE
          nodeId:
            type: string
            format: uuid
    RetryPolicy:
      type: object
      additionalProperties: false
      description: Task별 자동 재시도 정책. 생략하면 최초 1회만 실행합니다. 같은 Task ID에서 새 Attempt/epoch를 만들며 이전 실행의 종료와 대기 시간을 확인합니다. 입력·출력 오류, 결과 누락, 소유권 충돌과 취소는 재시도하지 않습니다.
      required: [maxAttempts, backoffSeconds, maxElapsedSeconds, retryOn]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 8
          description: 최초 실행을 포함한 최대 시도 횟수. 2 이상이면 retryOn을 한 개 이상 지정합니다.
        backoffSeconds:
          type: integer
          minimum: 1
          maximum: 300
          description: 실패 후 다음 Attempt까지 최소 대기 시간(초).
        maxElapsedSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Task의 최초 Attempt 생성부터 새 Attempt를 시작할 수 있는 시간(초). 실행 중 Attempt의 timeout은 SERVICE 규격을 따릅니다.
        retryOn:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: string
            enum: [WORKLOAD_FAILED, TIMEOUT, STORAGE_FAILED, RUNNER_FAILED, DISPATCH_TIMEOUT, RUNTIME_TIMEOUT, RUNTIME_LOST, JOB_FAILED]
      allOf:
      - if:
          properties:
            maxAttempts:
              minimum: 2
        then:
          properties:
            retryOn:
              minItems: 1
      example:
        maxAttempts: 3
        backoffSeconds: 5
        maxElapsedSeconds: 600
        retryOn: [STORAGE_FAILED, RUNTIME_LOST]
    RunCreate:
      type: object
      additionalProperties: false
      required:
      - workflowVersionId
      - execution
      - parameters
      properties:
        workflowVersionId:
          type: string
          format: uuid
        execution:
          $ref: '#/components/schemas/ExecutionPolicy'
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        parameters:
          type: object
          additionalProperties: true
    WorkflowRun:
      type: object
      additionalProperties: false
      required:
      - id
      - workflowVersionId
      - mode
      - nodeId
      - retry
      - parameters
      - state
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workflowVersionId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - AUTO
          - NODE
        nodeId:
          type:
          - string
          - 'null'
          format: uuid
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        parameters:
          type: object
          additionalProperties: true
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - runId
      - definitionId
      - key
      - state
      - cancellationReason
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        state:
          type: string
          enum:
          - WAITING
          - READY
          - RUNNING
          - RETRY_WAIT
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
          - SKIPPED
        cancellationReason:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskAttempt:
      type: object
      additionalProperties: false
      required:
      - id
      - taskId
      - number
      - epoch
      - state
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        epoch:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - QUEUED
          - DISPATCHING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
          - OFFLOADED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunDetail:
      type: object
      additionalProperties: false
      required:
      - run
      - tasks
      properties:
        run:
          $ref: '#/components/schemas/WorkflowRun'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    TaskDetail:
      type: object
      additionalProperties: false
      required:
      - task
      - attempts
      properties:
        task:
          $ref: '#/components/schemas/Task'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/TaskAttempt'
    TaskResults:
      type: object
      additionalProperties: false
      required: [taskId, items]
      properties:
        taskId: {type: string, format: uuid}
        items:
          type: array
          maxItems: 1
          items: {$ref: '#/components/schemas/TaskResult'}
    TaskResult:
      type: object
      additionalProperties: false
      required: [id, taskId, attemptId, runtimeId, epoch, producerPodUid, manifestDigest, createdAt, artifacts]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        attemptId: {type: string, format: uuid}
        runtimeId: {type: string, format: uuid}
        epoch: {type: integer, format: int64, minimum: 1}
        producerPodUid: {type: string, format: uuid}
        manifestDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
        artifacts:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/ResultArtifact'}
    ResultArtifact:
      type: object
      additionalProperties: false
      required: [port, bucket, objectKey, objectVersion, sha256, bytes, mediaType]
      properties:
        port: {type: string}
        bucket: {type: string}
        objectKey: {type: string}
        objectVersion: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes: {type: integer, format: int64, minimum: 0, maximum: 268435456}
        mediaType: {type: string}
    EmptyCommand:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    WorkflowPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        nextOffset:
          type:
          - integer
          - 'null'
    RunPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRun'
        nextOffset:
          type:
          - integer
          - 'null'
tags:
- name: 플랫폼
  description: 현재 서버 정보와 실제 구현된 기능을 확인합니다.
- name: 상태 확인
  description: Kubernetes readiness/liveness 및 연결 장애 진단에 사용합니다.
- name: 인증
  description: Basic 인증을 사용하는 쓰기 요청의 CSRF 토큰을 발급합니다.
- name: Profile
  description: DEVICE·SERVICE·VD 프로필의 불변 버전을 발행하고 조회합니다.
- name: Device
  description: 물리 장치·Node 연결 이력·재접속 세션·상태 관측을 관리합니다.
- name: Node
  description: Kubernetes/KubeEdge 실행 호스트의 실제 관측을 조회합니다.
- name: Workflow
  description: 불변 DAG 정의·발행 버전 관리
- name: Run
  description: 실행 요청·중복 방지·작업 상태·취소
- name: Task
  description: 논리 작업 및 Attempt 이력
- name: Result
  description: 검증·확정된 작업 결과와 고정 object version 메타데이터

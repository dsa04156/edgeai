      description: >-
        SERVICE Profile 버전을 참조하는 1–128개 task와 최대 512개 dependency를 발행합니다. 순환·없는 task·중복 입력 포트·잘못된 Profile 종류는 거절합니다. 배열 순서가 다른 같은 내용은
        재발행으로 처리합니다. 발행 후 DAG와 자식 정의는 수정·삭제할 수 없습니다. 포트 타입·이미지 실행 호환성은 실행 계층에서 검증합니다. STREAM 실행은 별도 실행 설정을 활성화한 환경에서 AUTO/NODE 정책으로
        요청할 수 있습니다.

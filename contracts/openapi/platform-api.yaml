  /api/v1/tasks/{taskId}/offload:
    post:
      tags: [Task]
      operationId: offloadTask
      summary: 실행 중인 작업을 다른 노드 또는 Remote로 전환
      description: >-
        실제 producer가 claim한 현재 Attempt만 전환합니다. 일반 작업은 SERVICE의 recovery.mode=RESTART 선언에 따라
        고정 입력으로 처음부터 실행합니다. CHECKPOINT STREAM은 NODE 대상으로만 전환하며, 연결된 모든 작업의
        현재 외부 체크포인트와 활성 경로가 필요합니다. 공동 완료 허가 뒤에는 전환하지 않습니다.
        STREAM 그룹 전체를 함께 차단하고 물리 종료와 브로커 권한 회수를 확인한 뒤 체크포인트를 인계합니다.
        선택한 작업은 지정 노드로 이동하고 다른 그룹 구성원은 기존 AUTO/NODE 배치 정책을 유지합니다.
        이전 producer를 즉시 차단하고 실제 종료를 확인한 뒤 같은 Task에서 새 Attempt/epoch를 만듭니다.
        targetNodeId는 현재 노드와 다르고 Profile 요구조건에 맞는 최근 READY 노드여야 합니다.
        Remote로 전환할 때는 targetNodeId 대신 targetProviderKey를 지정합니다. 제공자 설정은 접수 시 고정되며,
        실제 Remote 종료를 확인한 뒤 새 실행으로 이동합니다. 동일 제공자로의 재전환은 허용하지 않습니다.
        같은 키·내용은 같은 Operation을 반환하며, 다른 입력은409입니다. 작업별 최대8회, 동시에1개입니다.
        STREAM은 구성원 모두의 전환 한도를 검사하며 Operation.members에 이전/새 Attempt·체크포인트를 기록합니다.
        Operation의 성공은 모든 구성원이 새 producer를 claim했다는 뜻이며 Task 결과 성공과 구분합니다.
      security: [{localBasic: [], csrfToken: []}]
      parameters:
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: ID를 유지하며 실행 위치를 바꿀 Task
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, format: uuid}
        description: 동일 전환 요청을 재전송할 때 유지하는 UUID
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OffloadCreate'}
      responses:
        '202':
          description: 전환 접수. Location의 Operation을 조회하여 종료와 새 실행 시작을 확인하세요.
          headers:
            Location: {schema: {type: string}, description: '/api/v1/operations/{operationId}'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OffloadOperation'}
        '200':
          description: 같은 전환 요청의 재전송 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OffloadOperation'}
        '400': {description: UUID·필드·시간 범위가 잘못되었습니다.}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 세션/토큰 필요}
        '404': {description: Task 또는 대상 Node·Remote 제공자가 없습니다.}
        '409':
          description: source 변경·미지원 복원 방식·부적합 target·전환 한도·키 충돌·STREAM 체크포인트 누락/이전 세대·완료 허가
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503': {description: 저장소 연결 실패 또는 실행·Remote 기능이 비활성입니다. 설정 확인 후 동일 키로 재전송하세요.}
  /api/v1/operations/{operationId}:
    get:
      tags: [Operation]
      operationId: getOperation
      summary: 비동기 실행 전환·VD 작업 상태 조회
      description: >-
        kind로 TASK_OFFLOAD와 VD_PROVISION/VD_REPLACE/VD_DRAIN을 구분합니다. TASK_OFFLOAD는 이전/새 Attempt, 대상 노드 또는 고정 Remote 제공자, drain/start 마감과 실패 코드를 조회합니다.
        DRAINING은 이전 실행 종료 대기, STARTING은 새 producer 대기, SUCCEEDED는 새 producer claim 확인입니다.
        VD RUNNING은 준비/종료 대기, SUCCEEDED는 준비 확인 또는 물리 종료 확인입니다. SUPERSEDED는 새 요청으로 대체됨입니다.
        VD 성공은 Task/Result 완료를 뜻하지 않습니다. TASK_OFFLOAD의 FAILED나 CANCELLED는 Task/Attempt 이력과 함께 확인하세요. 인증 토큰이나 내부 claim 정보는 반환하지 않습니다.
      parameters:
      - name: operationId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: 전환 응답의 Operation UUID
      responses:
        '200':
          description: 비동기 전환 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '400': {description: UUID 형식 오류}
        '401': {description: Basic 인증 필요}
        '404': {description: Operation이 없습니다.}
        '503': {description: 저장소 연결 실패}
  /api/v1/virtual-devices:
    post:
      tags: [VD]
      operationId: createVirtualDevice
      summary: VD 식별자와 원본 장치 연결 등록
      description: >-
        edgeai.vd/v1 규격의 VD Profile과 실제 DEVICE/SERVICE 버전을 검증하고 원본 연결을 원자적으로 저장합니다.
        같은 key와 생성 입력은 기존 VD를 반환하고 다른 입력은409입니다. 해제 뒤 재전송도 기존 VD이며 재활성화하지 않습니다.
        현재 REGISTERED는 논리 등록만 완료된 상태입니다. 실행은 별도 provision 요청으로 시작하고 execution에서 준비 상태를 확인합니다. VD 경유 Task 실행은 후속 연결 범위입니다.
      security: [{localBasic: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VirtualDeviceCreate'}
      responses:
        '201':
          description: 논리 VD와 원본 연결 생성. 실제 Runtime 준비 완료를 뜻하지 않습니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualDevice'}
        '200':
          description: 같은 생성 입력의 기존 VD
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualDevice'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '409': {$ref: '#/components/responses/VirtualDeviceError'}
        '413': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
    get:
      tags: [VD]
      operationId: listVirtualDevices
      summary: 등록·해제된 VD 목록 조회
      description: key 순서로 논리 VD를 조회합니다. REGISTERED를 Ready로 해석하지 마세요. 해제 이력도 보존합니다.
      parameters:
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: 한 페이지 수}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}, description: 건너뛸 수}
      responses:
        '200':
          description: VD 목록과 다음 offset
          content:
            application/json:
              schema:
                type: object
                required: [items, nextOffset]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/VirtualDevice'}}
                  nextOffset: {type: [integer, 'null']}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
  /api/v1/virtual-devices/{vdId}:
    parameters:
    - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 원본·실행 위치 변경에도 유지할 VD UUID}
    get:
      tags: [VD]
      operationId: getVirtualDevice
      summary: VD 설정과 활성·과거 원본 연결 조회
      description: 최신 revision, 불변 Profile 참조와 source 이력을 조회합니다. closedAt이 null인 연결만 현재 원본입니다. 이력은 최신100개이며 더 있으면 sourceHistoryTruncated=true입니다.
      responses:
        '200':
          description: VD 상세
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualDeviceDetail'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
    patch:
      tags: [VD]
      operationId: updateVirtualDevice
      summary: revision을 확인하여 VD 이름·원본·배치 의도 수정
      description: >-
        이름·sources 전체 집합·placement를 함께 보내세요. Profile 참조와 vdId는 유지합니다.
        변경하지 않은 slot은 같은 연결 ID를 유지하고 바뀐 원본은 기존 이력을 닫고 새 연결을 만듭니다.
        오래된 revision·해제된 VD는409입니다. 현재 논리 설정 수정이며 실제 Runtime 전환 성공을 뜻하지 않습니다.
        관리 중인 실행이 있으면 원본·배치 변경과 교체 Operation을 같은 트랜잭션에 기록합니다. 이름만 바꾸면 실행을 교체하지 않습니다.
      security: [{localBasic: [], csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VirtualDeviceUpdate'}
      responses:
        '200':
          description: 최신 VD 설정. 같은 내용이면 revision도 유지합니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualDevice'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '409': {$ref: '#/components/responses/VirtualDeviceError'}
        '413': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
    delete:
      tags: [VD]
      operationId: releaseVirtualDevice
      summary: VD 논리 해제와 원본 연결 종료
      description: VD를 RELEASED로 표시하고 활성 source를 닫습니다. 관리 중인 실행이 있으면 종료 Operation을 함께 기록하며 완료 전까지 이전 원본 Device 해제를 막습니다. 물리 Device는 해제하지 않으며 이력과 vdId를 유지합니다. 반복 해제는 같은 상태를 반환합니다. 응답은 논리 해제이며 실제 Pod 종료 완료를 뜻하지 않습니다. execution의 pendingOperation과 Operation 조회에서 실제 종료를 확인하세요.
      security: [{localBasic: [], csrfToken: []}]
      responses:
        '200':
          description: 해제된 VD
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualDevice'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
  /api/v1/virtual-devices/{vdId}/provision:
    post:
      tags: [VD]
      operationId: provisionVirtualDevice
      summary: VD 실행 시작 요청
      description: >-
        현재 설정으로 지속 실행을 시작합니다. 같은 설정의 실행이 있으면 재사용하며, 다른 설정이면 종료 후 교체합니다.
        현재 revision과 UUID Idempotency-Key를 보내세요. 같은 VD·키·요청 재전송은 동일 Operation을 반환하고 다른 요청은409입니다.
        새 요청은 기존 진행 작업을 SUPERSEDED로 바꿀 수 있습니다. 같은 키의 재전송은 상태가 바뀌어도 새 실행을 만들지 않습니다.
        VD 실행 기능은 기본 비활성이며 비활성 요청은503입니다. 현재는 지속 실행의 준비/종료를 관리하며 VD Task 배정은 후속 연결 범위입니다.
      security: [{localBasic: [], csrfToken: []}]
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 동일 요청 재전송에서 유지할 UUID}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VDExecutionRequest'}
            example: {revision: 0}
      responses:
        '202':
          description: 새 Operation 저장. 응답의 state와 execution에서 실제 진행을 확인하세요.
          headers:
            Location: {schema: {type: string}, description: '/api/v1/operations/{operationId}'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '200':
          description: 동일 요청의 기존 Operation
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '409': {$ref: '#/components/responses/VirtualDeviceError'}
        '413': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
  /api/v1/virtual-devices/{vdId}/replace:
    post:
      tags: [VD]
      operationId: replaceVirtualDeviceRuntime
      summary: VD 실행 세대 교체 요청
      description: >-
        현재 실행의 종료를 확인한 뒤 새 세대를 만듭니다. 교체할 실행이 없으면409입니다. vdId와 이전 이력은 유지됩니다.
        현재 revision과 UUID Idempotency-Key를 보내세요. 같은 VD·키·요청 재전송은 동일 Operation을 반환하고 다른 요청은409입니다.
        새 요청은 기존 진행 작업을 SUPERSEDED로 바꿀 수 있습니다. 같은 키의 재전송은 상태가 바뀌어도 새 실행을 만들지 않습니다.
        VD 실행 기능은 기본 비활성이며 비활성 요청은503입니다. 현재는 지속 실행의 준비/종료를 관리하며 VD Task 배정은 후속 연결 범위입니다.
      security: [{localBasic: [], csrfToken: []}]
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 동일 요청 재전송에서 유지할 UUID}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VDExecutionRequest'}
            example: {revision: 0}
      responses:
        '202':
          description: 새 Operation 저장. 응답의 state와 execution에서 실제 진행을 확인하세요.
          headers:
            Location: {schema: {type: string}, description: '/api/v1/operations/{operationId}'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '200':
          description: 동일 요청의 기존 Operation
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '409': {$ref: '#/components/responses/VirtualDeviceError'}
        '413': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
  /api/v1/virtual-devices/{vdId}/drain:
    post:
      tags: [VD]
      operationId: drainVirtualDeviceRuntime
      summary: VD 실행 종료 요청
      description: >-
        새 작업 수용을 중단하고 drain 후 물리 Pod 종료를 기다립니다. 제한 시간 초과는 강제 종료로 전환합니다. 실행이 없으면 즉시 SUCCEEDED이며 VD 등록은 유지됩니다.
        현재 revision과 UUID Idempotency-Key를 보내세요. 같은 VD·키·요청 재전송은 동일 Operation을 반환하고 다른 요청은409입니다.
        새 요청은 기존 진행 작업을 SUPERSEDED로 바꿀 수 있습니다. 같은 키의 재전송은 상태가 바뀌어도 새 실행을 만들지 않습니다.
        VD 실행 기능은 기본 비활성이며 비활성 요청은503입니다. 현재는 지속 실행의 준비/종료를 관리하며 VD Task 배정은 후속 연결 범위입니다.
      security: [{localBasic: [], csrfToken: []}]
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 동일 요청 재전송에서 유지할 UUID}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VDExecutionRequest'}
            example: {revision: 0}
      responses:
        '202':
          description: 새 Operation 저장. 응답의 state와 execution에서 실제 진행을 확인하세요.
          headers:
            Location: {schema: {type: string}, description: '/api/v1/operations/{operationId}'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '200':
          description: 동일 요청의 기존 Operation
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDOperation'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '403': {description: CSRF 쿠키/토큰 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '409': {$ref: '#/components/responses/VirtualDeviceError'}
        '413': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
  /api/v1/virtual-devices/{vdId}/execution:
    get:
      tags: [VD]
      operationId: getVirtualDeviceExecution
      summary: VD 실행 준비 상태·세대·작업 이력 조회
      description: >-
        asOf 시점의 일관된 DB 스냅샷입니다. ready는 RUNNING 의도·Pod Ready 관측·미만료 인증 lease를 모두 요구합니다.
        과거 observedState=READY만으로 현재 준비 상태를 판단하지 마세요. current는 미종료 실행이며 없으면 null입니다.
        pendingOperation은 현재 진행 작업이며 runtimeHistory/bindings/operations는 각각 최신100개입니다.
        각 Truncated 값이 true이면 이전 이력이 더 있습니다. 기능 비활성·VD 해제 후에도 이력은 조회 가능합니다.
        세션·자격·내부 설정은 반환하지 않습니다. 성공한 Operation도 현재 실행이나 Task/Result 성공을 보장하지 않습니다.
      parameters:
      - {name: vdId, in: path, required: true, schema: {type: string, format: uuid}, description: 대상 VD UUID}
      responses:
        '200':
          description: VD 실행 상태와 보존된 이력
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VDExecution'}
        '400': {$ref: '#/components/responses/VirtualDeviceError'}
        '401': {description: Basic 인증 필요}
        '404': {$ref: '#/components/responses/VirtualDeviceError'}
        '503': {$ref: '#/components/responses/VirtualDeviceError'}
  /api/v1/devices/{deviceId}/sessions/{sessionId}/stream-token:
    parameters:
    - name: deviceId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    - name: sessionId
      in: path
      required: true
      schema: *id001
    post:
      tags:
      - Device
      operationId: issueDeviceStreamToken
      summary: 현재 장치 세션의 스트림 배정 토큰 발급
      description: 관리자가 현재 활성 Device 세션에 설치할 토큰을 발급한다. Basic 인증과 CSRF가 필요하고 반복 요청은 같은
        토큰이다. 장치 해제·세션 교체 뒤 기존 토큰은 사용할 수 없다. 토큰은 관리 API 권한이 없으며 별도 내부 스트림 배정 API에서 본인
        세대의 MQTT 자격만 조회한다. 응답을 로그/일반 metadata에 저장하지 않는다. EDGEAI_STREAM_ENABLED가 false면501이며
        공개 STREAM 실행을 활성화하는 API가 아니다.
      security:
      - localBasic: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      responses:
        '200':
          description: '현재 세션에 한정된 토큰. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - deviceId
                - sessionId
                - epoch
                - tokenType
                - token
                properties:
                  deviceId: *id001
                  sessionId: *id001
                  epoch:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
                  tokenType:
                    const: Bearer
                  token:
                    type: string
                    format: password
                    maxLength: 128
        '400':
          description: 빈 JSON 객체가 필요함
        '401':
          description: 관리 Basic 인증 필요
        '403':
          description: CSRF 토큰/세션 누락
        '404':
          description: 장치가 없음
        '409':
          description: 장치 해제 또는 현재 세션 불일치
        '413':
          description: 본문16KiB 제한
        '501':
          description: 스트림 배정 비활성
        '503':
          description: DB/토큰 키 설정 장애
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 쓰기 요청은 세션 쿠키와 함께 이 헤더가 필요합니다. Swagger는 자동 발급·전달하므로 이 입력칸을 비워 두세요. 직접 호출할 때는 getCsrfToken을 먼저 사용합니다.
    localBasic:
      type: http
      scheme: basic
      description: 개발·내부 검증용 계정(EDGEAI_API_USER / EDGEAI_API_PASSWORD)입니다. 운영용 사용자·역할 관리는 후속 범위입니다.
  parameters:
    Kind:
      in: path
      name: kind
      required: true
      schema:
        type: string
        enum:
        - DEVICE
        - SERVICE
        - VD
      description: 'DEVICE: 장치 규격 / SERVICE: 서비스 규격 / VD: 가상 장치 규격. 동일한 key/version이라도 종류가 다르면 별개입니다.'
  responses:
    VirtualDeviceError:
      description: 잘못된 입력400·없는 VD/Profile/Device/Node404·중복 키/revision/원본 충돌409·64KiB 초과413·DB 장애503입니다. code와 message를 확인하세요.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Invalid:
      description: 종류·키·버전·페이지·JSON 형식이 잘못되었습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_PROFILE
            message: 종류, 키, 버전과 JSON 규격을 확인하세요. 규격은 비어 있지 않은 객체여야 합니다.
    Conflict:
      description: 같은 종류·키·버전에 다른 내용이 이미 발행되었습니다. 새 버전을 사용하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_CONFLICT
            message: 이미 발행한 버전입니다. 내용을 바꾸려면 새 버전을 등록하세요.
    NotFound:
      description: 해당 발행 버전이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_NOT_FOUND
            message: 해당 Profile 버전을 찾을 수 없습니다.
    Unavailable:
      description: DB 연결 등 저장소 문제로 요청을 처리할 수 없습니다. 복구 후 재시도하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_STORE_UNAVAILABLE
            message: Profile 저장소에 연결할 수 없습니다. 잠시 후 다시 시도하세요.
  schemas:
    ProfileKey:
      type: string
      maxLength: 100
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      description: 소문자 영문으로 시작하는 프로필 키. 영문 소문자·숫자와 구분자 점/밑줄/하이픈을 사용하며 최대 100자입니다.
      example: temperature-sensor
    Version:
      type: string
      maxLength: 32
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      description: MAJOR.MINOR.PATCH 형태의 숫자 버전. 01처럼 앞에 0을 붙이거나 prerelease 문자를 붙일 수 없습니다.
      example: 1.0.0
    PublishProfile:
      type: object
      additionalProperties: false
      required:
      - key
      - version
      - spec
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 비어 있지 않은 JSON 규격 문서입니다. 현재 종류별 실행 스키마·외부 참조의 호환성은 검증하지 않습니다.
    ProfileVersion:
      type: object
      required:
      - id
      - kind
      - key
      - version
      - spec
      - digest
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 이 발행 버전의 서버 생성 UUID입니다.
        kind:
          type: string
          enum:
          - DEVICE
          - SERVICE
          - VD
          description: 프로필 종류입니다. 종류마다 키·버전 공간이 구분됩니다.
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          additionalProperties: true
          description: 발행 시 저장된 JSON 규격입니다.
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          description: 종류와 정규화된 spec의 SHA-256 식별값. JSON 키 순서나 동등한 숫자 표기는 같은 값이며, spec 또는 종류가 바뀌면 달라집니다. 상세 규칙은 ADR 0002를 따릅니다.
        createdAt:
          type: string
          format: date-time
          description: 최초 발행 시각입니다. 동일 내용 재등록 시 유지됩니다.
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INVALID_PROFILE
          - PROFILE_CONFLICT
          - PROFILE_NOT_FOUND
          - PROFILE_STORE_UNAVAILABLE
          - PAYLOAD_TOO_LARGE
          - INVALID_DEVICE
          - DEVICE_CONFLICT
          - DEVICE_NOT_FOUND
          - NODE_NOT_FOUND
          - NODE_NOT_READY
          - DEVICE_RELEASED
          - STALE_SESSION
          - OBSERVATION_CONFLICT
          - DEVICE_STORE_UNAVAILABLE
          - INVALID_WORKFLOW
          - WORKFLOW_NOT_FOUND
          - WORKFLOW_CONFLICT
          - RUN_NOT_FOUND
          - TASK_NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - CANNOT_CANCEL
          - STREAM_NOT_IMPLEMENTED
          - STREAM_EXECUTION_POLICY_UNSUPPORTED
          - STREAM_RECOVERY_UNSUPPORTED
          - STREAM_SOURCE_INACTIVE
          - WORKFLOW_STORE_UNAVAILABLE
          - INVALID_TASK_ID
          - RESULT_STORE_UNAVAILABLE
          - RUNTIME_DISABLED
          - REMOTE_DISABLED
          - REMOTE_PROVIDER_NOT_FOUND
          - REMOTE_CONFIGURATION_CHANGED
          - REMOTE_TELEMETRY_UNSUPPORTED
          - VD_EXECUTION_DISABLED
          - VD_NOT_READY
          - VD_SERVICE_MISMATCH
          - VD_AUTOMATIC_OFFLOAD_UNSUPPORTED
          - OFFLOAD_SOURCE_CHANGED
          - OFFLOAD_LIMIT
          - OFFLOAD_RECOVERY_UNSUPPORTED
          - OFFLOAD_TARGET_INVALID
          - OPERATION_NOT_FOUND
          - INVALID_VIRTUAL_DEVICE
          - VD_NOT_FOUND
          - VD_CONFLICT
          - VD_RELEASED
          - VD_SOURCE_INCOMPATIBLE
          - VD_STORE_UNAVAILABLE
          - DEVICE_IN_USE
        message:
          type: string
    PlatformInfo:
      type: object
      required:
      - name
      - version
      - milestone
      - capabilities
      properties:
        name:
          type: string
          const: edgeai
        version:
          type: string
        milestone:
          type: string
          const: M4
          description: 전체 수용 검증을 완료한 최종 단계. 진행 중 단계의 일부 기능은 capabilities에 포함될 수 있습니다.
        capabilities:
          type: array
          items:
            type: string
      example:
        name: edgeai
        version: 0.1.0
        milestone: M4
        capabilities:
        - profiles
        - devices
        - nodes
        - workflows
        - runs
        - tasks
        - results
        - virtual-devices
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      example:
        status: UP
    DeviceCreate:
      type: object
      additionalProperties: false
      required:
      - key
      - displayName
      - profileVersionId
      - sourceMode
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        profileVersionId:
          type: string
          format: uuid
        sourceMode:
          type: string
          enum:
          - LIVE
          - REPLAY
          - SYNTHETIC
    DevicePatch:
      type: object
      additionalProperties: false
      required:
      - revision
      - displayName
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    DeviceAttachmentInput:
      type: object
      additionalProperties: false
      required:
      - port
      properties:
        port:
          type: string
          minLength: 1
          maxLength: 128
    DeviceSessionInput:
      type: object
      additionalProperties: false
      required:
      - bootId
      properties:
        bootId:
          type: string
          format: uuid
    DeviceObservationInput:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - sequence
      - observedAt
      - status
      - attributes
      properties:
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        observedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        attributes:
          type: object
          additionalProperties: true
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - displayName
      - profileVersionId
      - sourceMode
      - state
      - revision
      - sessionEpoch
      - connectionStatus
      - lastSeenAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        profileVersionId:
          type: string
          format: uuid
        sourceMode:
          type: string
          enum:
          - LIVE
          - REPLAY
          - SYNTHETIC
        state:
          type: string
          enum:
          - ACTIVE
          - RELEASED
        revision:
          type: integer
          minimum: 0
        sessionEpoch:
          type: integer
          minimum: 0
        connectionStatus:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
          - STALE
          - RELEASED
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeviceAttachment:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - nodeId
      - port
      - attachedAt
      - detachedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        nodeId:
          type: string
          format: uuid
        port:
          type: string
        attachedAt:
          type: string
          format: date-time
        detachedAt:
          type:
          - string
          - 'null'
          format: date-time
    DeviceSession:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - bootId
      - epoch
      - lastSequence
      - openedAt
      - closedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        bootId:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
        lastSequence:
          type: integer
          minimum: -1
        openedAt:
          type: string
          format: date-time
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
    DeviceObservation:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - sessionId
      - sequence
      - observedAt
      - status
      - attributes
      - receivedAt
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        observedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        attributes:
          type: object
          additionalProperties: true
        receivedAt:
          type: string
          format: date-time
    DeviceDetail:
      type: object
      additionalProperties: false
      required:
      - device
      - attachments
      - sessions
      - observations
      properties:
        device:
          $ref: '#/components/schemas/Device'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttachment'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSession'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceObservation'
    ExecutionNode:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - architecture
      - operatingSystem
      - status
      - cpu
      - memory
      - labels
      - observedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        architecture:
          type: string
        operatingSystem:
          type: string
        status:
          type: string
          enum:
          - READY
          - NOT_READY
          - UNKNOWN
          - REMOVED
          - STALE
        cpu:
          type: string
        memory:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        observedAt:
          type: string
          format: date-time
    DevicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextOffset:
          type:
          - integer
          - 'null'
    NodePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionNode'
        nextOffset:
          type:
          - integer
          - 'null'
    WorkflowCreate:
      type: object
      additionalProperties: false
      required:
      - key
      - displayName
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    DagTask:
      type: object
      additionalProperties: false
      required:
      - key
      - serviceProfileVersionId
      - parameters
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        serviceProfileVersionId:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties: true
    DagDependency:
      type: object
      additionalProperties: false
      required:
      - fromTask
      - toTask
      - fromPort
      - toPort
      - mode
      properties:
        fromTask:
          $ref: '#/components/schemas/ProfileKey'
        toTask:
          $ref: '#/components/schemas/ProfileKey'
        fromPort:
          $ref: '#/components/schemas/ProfileKey'
        toPort:
          $ref: '#/components/schemas/ProfileKey'
        mode:
          type: string
          enum:
          - BATCH
          - STREAM
    WorkflowDag:
      type: object
      additionalProperties: false
      required:
      - tasks
      - dependencies
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DagTask'
          minItems: 1
          maxItems: 128
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DagDependency'
          maxItems: 512
    WorkflowPublish:
      type: object
      additionalProperties: false
      required:
      - version
      - tasks
      - dependencies
      properties:
        version:
          $ref: '#/components/schemas/Version'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/DagTask'
          minItems: 1
          maxItems: 128
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/DagDependency'
          maxItems: 512
    Workflow:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - displayName
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkflowVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - workflowId
      - version
      - dag
      - digest
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/Version'
        dag:
          $ref: '#/components/schemas/WorkflowDag'
        digest:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkflowDetail:
      type: object
      additionalProperties: false
      required:
      - workflow
      - versions
      - nextOffset
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersion'
        nextOffset:
          type:
          - integer
          - 'null'
    ExecutionPolicy:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - mode
        properties:
          mode:
            type: string
            enum:
            - AUTO
      - type: object
        additionalProperties: false
        required:
        - mode
        - nodeId
        properties:
          mode:
            type: string
            enum:
            - NODE
          nodeId:
            type: string
            format: uuid
      - type: object
        additionalProperties: false
        required: [mode, providerKey]
        properties:
          mode: {type: string, const: REMOTE}
          providerKey: {type: string, maxLength: 63, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', description: 서버에 설정된 Remote 제공자 key. endpoint와 자격은 요청에 넣지 않습니다.}
      - type: object
        additionalProperties: false
        required: [mode, vdId]
        properties:
          mode: {type: string, const: VD}
          vdId: {type: string, format: uuid, description: 현재 Ready인 영속 VD의 ID. 모든 작업은 VD와 동일한 SERVICE Profile 버전을 사용합니다.}
    RemoteTarget:
      type: [object, 'null']
      additionalProperties: false
      description: 요청 시 고정된 제공자 설정. SYNTHETIC 참조 계산은 실장비 검증이 아닙니다. 비밀정보와 endpoint는 반환하지 않습니다.
      required: [providerKey, configurationDigest, sourceMode]
      properties:
        providerKey: {type: string, maxLength: 63, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
        configurationDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        sourceMode: {type: string, enum: [SYNTHETIC, EXTERNAL]}
    RetryPolicy:
      type: object
      additionalProperties: false
      description: Task별 자동 재시도 정책. 생략하면 최초 1회만 실행합니다. 같은 Task ID에서 새 Attempt/epoch를 만들며 이전 실행의 종료와 대기 시간을 확인합니다. STREAM은 계산 중 연결된 그룹을 함께 재시도하고 모든 이전 실행 종료와 broker 권한 회수를 기다립니다. 그룹 구성원 중 가장 이른 기한을 따르며 각 Task의 횟수 예산을 소비합니다. 완료 허가 뒤에는 실패한 Task의 최종 처리만 재시도합니다. 입력·출력 오류, 결과 누락, 소유권 충돌과 취소는 재시도하지 않습니다.
      required: [maxAttempts, backoffSeconds, maxElapsedSeconds, retryOn]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 8
          description: 최초 실행과 RETRY를 포함한 최대 시도 횟수. OFFLOAD는 별도 한도이며 이 예산을 소비하지 않습니다. 2 이상이면 retryOn을 한 개 이상 지정합니다.
        backoffSeconds:
          type: integer
          minimum: 1
          maximum: 300
          description: 실패 후 다음 Attempt까지 최소 대기 시간(초).
        maxElapsedSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Task의 최초 Attempt 생성부터 새 Attempt를 시작할 수 있는 시간(초). 실행 중 Attempt의 timeout은 SERVICE 규격을 따릅니다.
        retryOn:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: string
            enum: [WORKLOAD_FAILED, TIMEOUT, STORAGE_FAILED, RUNNER_FAILED, DISPATCH_TIMEOUT, RUNTIME_TIMEOUT, RUNTIME_LOST, JOB_FAILED]
      allOf:
      - if:
          properties:
            maxAttempts:
              minimum: 2
        then:
          properties:
            retryOn:
              minItems: 1
      example:
        maxAttempts: 3
        backoffSeconds: 5
        maxElapsedSeconds: 600
        retryOn: [STORAGE_FAILED, RUNTIME_LOST]
    OffloadPolicy:
      type: [object, 'null']
      additionalProperties: false
      description: 명시적으로 활성화하는 작업별 자동 전환. 생략/null이면 비활성입니다. Kubernetes 측정만 지원하며 REMOTE/VD 실행 요청과 함께 지정하면409입니다. 일반 SERVICE는 RESTART, STREAM SERVICE는 CHECKPOINT 복구를 선언해야 합니다. STREAM은 현재 그룹 전체의 체크포인트·실행 신원·경로·대기 시간·전환 예산을 확인하고 전체 종료와 권한 회수 후 상태를 인계합니다. 선택된 작업의 최초 NODE 지정도 전환 후 AUTO로 바뀔 수 있으며 다른 구성원의 배치 정책은 유지합니다. 같은 지표의 최신 연속 표본이 모두 임계값 이상이어야 하며, 선택된 작업의 이전 실행 노드를 제외하고 kube-scheduler가 배치합니다. 실제 실패는 별도 retry 정책을 따릅니다. 최적 성능을 보장하는 알고리즘이 아닙니다.
      required: [cpuPercent, memoryPercent, latencyMicros, consecutiveSamples, maxSampleAgeSeconds, maxGapSeconds, minRunningSeconds, cooldownSeconds, maxTransfers, drainTimeoutSeconds, startTimeoutSeconds]
      properties:
        cpuPercent: {type: [integer, 'null'], minimum: 1, maximum: 100, description: cgroup CPU 제한 대비 사용률. 제한 미수집/무제한은 판단하지 않음}
        memoryPercent: {type: [integer, 'null'], minimum: 1, maximum: 100, description: cgroup 메모리 제한 대비 사용률}
        latencyMicros: {type: [integer, 'null'], minimum: 1, maximum: 600000000, description: 서비스 개별 지연의 마이크로초 임계값. p95/p99가 아님}
        consecutiveSamples: {type: integer, minimum: 2, maximum: 6}
        maxSampleAgeSeconds: {type: integer, minimum: 10, maximum: 60}
        maxGapSeconds: {type: integer, minimum: 5, maximum: 30, description: 인접 표본의 최대 시간 간격. 누락 sequence는 연속으로 인정하지 않음}
        minRunningSeconds: {type: integer, minimum: 10, maximum: 3600, description: 현재 Attempt 시작 후 대기. STREAM은 그룹 모두의 대기 완료 이후 표본만 사용}
        cooldownSeconds: {type: integer, minimum: 10, maximum: 3600, description: 이전 수동/자동 전환 완료 후 대기. STREAM은 그룹 모두의 대기 완료 이후 새 표본만 사용}
        maxTransfers: {type: integer, minimum: 1, maximum: 8, description: 작업별 자동 전환 횟수. STREAM은 함께 재시작하는 모든 구성원의 예산을 소비하며 수동과 합친 전체 8회 제한도 적용}
        drainTimeoutSeconds: {type: integer, minimum: 1, maximum: 600}
        startTimeoutSeconds: {type: integer, minimum: 1, maximum: 600}
      not:
        type: object
        required: [cpuPercent, memoryPercent, latencyMicros]
        properties:
          cpuPercent: {type: 'null'}
          memoryPercent: {type: 'null'}
          latencyMicros: {type: 'null'}
      example:
        cpuPercent: 90
        memoryPercent: 90
        latencyMicros: null
        consecutiveSamples: 3
        maxSampleAgeSeconds: 30
        maxGapSeconds: 10
        minRunningSeconds: 30
        cooldownSeconds: 120
        maxTransfers: 1
        drainTimeoutSeconds: 60
        startTimeoutSeconds: 120
    OffloadDecision:
      type: [object, 'null']
      additionalProperties: false
      description: 자동 판단 시 복사한 정책과 원시 측정. 최신 측정 보관 만료 후에도 남는 결정 근거. 수동 요청이면 null.
      required: [policy, evaluatedAt, eligibleSince, samples]
      properties:
        policy: {$ref: '#/components/schemas/OffloadPolicy'}
        evaluatedAt: {type: string, format: date-time}
        eligibleSince: {type: string, format: date-time}
        samples:
          type: array
          minItems: 2
          maxItems: 6
          items: {$ref: '#/components/schemas/RuntimeTelemetry'}
    RunCreate:
      type: object
      additionalProperties: false
      required:
      - workflowVersionId
      - execution
      - parameters
      properties:
        workflowVersionId:
          type: string
          format: uuid
        streamInputs:
          type: array
          maxItems: 128
          description: >-
            장치의 현재 활성 세션을 실행 생성 시 고정하는 입력 목록입니다. 같은 toTask/toPort는 한 번만
            지정하며 발행된 Task 의존 입력을 대체할 수 없습니다. 항목 순서는 멱등 요청의 의미를 바꾸지 않습니다.
            모든 SERVICE stream 입력/출력은 장치 입력 또는 STREAM 의존 경로로 연결되어야 합니다.
          items: {$ref: '#/components/schemas/StreamRunInput'}
        execution:
          $ref: '#/components/schemas/ExecutionPolicy'
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
        parameters:
          type: object
          additionalProperties: true
    StreamRunInput:
      type: object
      additionalProperties: false
      required: [deviceId, sourcePort, toTask, toPort, maxPayloadBytes]
      properties:
        deviceId: {type: string, format: uuid}
        sourcePort: {$ref: '#/components/schemas/ProfileKey'}
        toTask: {$ref: '#/components/schemas/ProfileKey'}
        toPort: {$ref: '#/components/schemas/ProfileKey'}
        maxPayloadBytes: {type: integer, minimum: 1, maximum: 262144}
    StreamRoutePage:
      type: object
      additionalProperties: false
      required: [items, nextOffset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StreamRoute'}}
        nextOffset: {type: [integer, 'null'], minimum: 0}
    StreamRoute:
      type: object
      additionalProperties: false
      required: [id, runId, componentId, sourceTaskId, sourceDeviceId, sourceProfileVersionId, sourceMode, sourcePort, consumerTaskId, consumerPort, mediaType, maxPayloadBytes, sourceSessionId, sourceEpoch, generation]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        componentId: {type: [string, 'null'], format: uuid}
        sourceTaskId: {type: [string, 'null'], format: uuid}
        sourceDeviceId: {type: [string, 'null'], format: uuid}
        sourceProfileVersionId: {type: string, format: uuid}
        sourceMode: {type: [string, 'null'], enum: [LIVE, REPLAY, SYNTHETIC, null]}
        sourcePort: {type: string}
        consumerTaskId: {type: string, format: uuid}
        consumerPort: {type: string}
        mediaType: {type: string}
        maxPayloadBytes: {type: integer, minimum: 1, maximum: 262144}
        sourceSessionId: {type: [string, 'null'], format: uuid}
        sourceEpoch: {type: [integer, 'null'], minimum: 1, maximum: 9007199254740991}
        generation:
          oneOf:
          - {$ref: '#/components/schemas/StreamRouteGeneration'}
          - {type: 'null'}
    StreamRouteGeneration:
      type: object
      additionalProperties: false
      required: [id, number, state, producerId, producerEpoch, consumerAttemptId, consumerEpoch, leaseUntil, fenceReason, closedAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1, maximum: 9007199254740991}
        state: {type: string, enum: [PREPARING, ACTIVE, FENCED, CLOSED]}
        producerId: {type: string, format: uuid}
        producerEpoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        consumerAttemptId: {type: string, format: uuid}
        consumerEpoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        leaseUntil: {type: string, format: date-time}
        fenceReason: {type: [string, 'null']}
        closedAt: {type: [string, 'null'], format: date-time}
    WorkflowRun:
      type: object
      additionalProperties: false
      required:
      - id
      - workflowVersionId
      - mode
      - nodeId
      - vdId
      - remoteTarget
      - retry
      - offload
      - parameters
      - state
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        workflowVersionId:
          type: string
          format: uuid
        remoteTarget: {$ref: '#/components/schemas/RemoteTarget'}
        mode:
          type: string
          enum:
          - AUTO
          - NODE
          - REMOTE
          - VD
        vdId: {type: [string, 'null'], format: uuid, description: VD 실행 대상. 재시도와 하위 작업에도 유지되며 다른 mode이면 null입니다.}
        nodeId:
          type:
          - string
          - 'null'
          format: uuid
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
        parameters:
          type: object
          additionalProperties: true
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - runId
      - definitionId
      - key
      - state
      - cancellationReason
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        state:
          type: string
          enum:
          - WAITING
          - READY
          - RUNNING
          - RETRY_WAIT
          - OFFLOADING
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
          - SKIPPED
        cancellationReason:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskAttempt:
      type: object
      additionalProperties: false
      required:
      - id
      - taskId
      - number
      - epoch
      - state
      - mode
      - nodeId
      - vdId
      - remoteTarget
      - cause
      - excludedNodeNames
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        epoch:
          type: integer
          minimum: 1
        remoteTarget: {$ref: '#/components/schemas/RemoteTarget'}
        mode: {type: string, enum: [AUTO, NODE, REMOTE, VD], description: 이 Attempt의 실제 실행 정책. Run의 최초 정책과 구분합니다.}
        nodeId: {type: [string, 'null'], format: uuid}
        vdId: {type: [string, 'null'], format: uuid, description: 이 Attempt가 실행될 VD. 명시적 NODE/REMOTE 전환 후에는 null입니다.}
        cause: {type: string, enum: [INITIAL, RETRY, OFFLOAD]}
        excludedNodeNames:
          type: array
          maxItems: 16
          items: {type: string}
          description: AUTO에서 제외할 이전 실행 노드. 재시도도 동일 제약을 유지합니다.
        state:
          type: string
          enum:
          - QUEUED
          - DISPATCHING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - CANCELLING
          - CANCELLED
          - OFFLOADED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunDetail:
      type: object
      additionalProperties: false
      required:
      - run
      - tasks
      properties:
        run:
          $ref: '#/components/schemas/WorkflowRun'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    TaskDetail:
      type: object
      additionalProperties: false
      required:
      - task
      - attempts
      - offloads
      - telemetry
      properties:
        telemetry:
          description: 최신 Attempt의 최신 측정. 미수집은 null이며 과거 Attempt의 값으로 대체하지 않습니다.
          oneOf:
          - {$ref: '#/components/schemas/RuntimeTelemetry'}
          - {type: 'null'}
        offloads:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/OffloadOperation'}
        task:
          $ref: '#/components/schemas/Task'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/TaskAttempt'
    TaskResults:
      type: object
      additionalProperties: false
      required: [taskId, items]
      properties:
        taskId: {type: string, format: uuid}
        items:
          type: array
          maxItems: 1
          items: {$ref: '#/components/schemas/TaskResult'}
    TaskResult:
      type: object
      additionalProperties: false
      allOf:
      - if:
          properties:
            remoteAllocationId: {type: string}
          required: [remoteAllocationId]
        then:
          properties:
            producerPodUid: {type: 'null'}
            remoteSourceMode: {enum: [SYNTHETIC, EXTERNAL]}
            vdRuntimeId: {type: 'null'}
        else:
          properties:
            producerPodUid: {type: string}
            remoteSourceMode: {type: 'null'}
      required: [id, taskId, attemptId, runtimeId, epoch, producerPodUid, remoteAllocationId, remoteSourceMode, vdRuntimeId, manifestDigest, createdAt, artifacts]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        attemptId: {type: string, format: uuid}
        runtimeId: {type: string, format: uuid}
        epoch: {type: integer, format: int64, minimum: 1}
        producerPodUid: {type: [string, 'null'], format: uuid, description: Kubernetes 결과의 실제 producer Pod UID. Remote 결과는 null입니다.}
        remoteAllocationId: {type: [string, 'null'], format: uuid, description: Remote 결과의 영속 할당 ID. producerPodUid와 정확히 하나만 제공됩니다.}
        remoteSourceMode: {enum: [null, SYNTHETIC, EXTERNAL], description: Remote 참조 계산은 SYNTHETIC입니다. 실제 외부 제공자 EXTERNAL과 구분하며 Kubernetes 결과에서는 null입니다.}
        vdRuntimeId: {type: [string, 'null'], format: uuid, description: VD 결과의 실제 supervisor 실행 세대 ID. 해당 작업 배정과 producerPodUid에 결합되며 일반 Job/Remote 결과에서는 null입니다.}
        manifestDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        createdAt: {type: string, format: date-time}
        artifacts:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/ResultArtifact'}
    ResultArtifact:
      type: object
      additionalProperties: false
      required: [port, bucket, objectKey, objectVersion, sha256, bytes, mediaType]
      properties:
        port: {type: string}
        bucket: {type: string}
        objectKey: {type: string}
        objectVersion: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes: {type: integer, format: int64, minimum: 0, maximum: 268435456}
        mediaType: {type: string}
    OffloadCreate:
      type: object
      additionalProperties: false
      required: [sourceAttemptId, drainTimeoutSeconds, startTimeoutSeconds]
      oneOf:
      - required: [targetNodeId]
        not: {required: [targetProviderKey]}
      - required: [targetProviderKey]
        not: {required: [targetNodeId]}
      properties:
        sourceAttemptId: {type: string, format: uuid, description: 현재 RUNNING Attempt ID. 오래된 화면에서 전환하는 것을 방지합니다.}
        targetNodeId: {type: string, format: uuid, description: 다른 READY 노드 UUID. scheduler가 hard affinity를 적용합니다.}
        targetProviderKey: {type: string, maxLength: 63, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', description: Remote 전환 대상. targetNodeId와 정확히 하나만 지정합니다.}
        drainTimeoutSeconds: {type: integer, minimum: 1, maximum: 600, description: 이전 Runtime 종료 확인 제한 시간}
        startTimeoutSeconds: {type: integer, minimum: 1, maximum: 600, description: 새 Attempt 생성부터 producer claim까지 제한 시간}
      example:
        sourceAttemptId: 11111111-1111-4111-8111-111111111111
        targetNodeId: 22222222-2222-4222-8222-222222222222
        drainTimeoutSeconds: 60
        startTimeoutSeconds: 120
    OffloadOperation:
      type: object
      additionalProperties: false
      required: [id, kind, taskId, sourceAttemptId, targetAttemptId, targetNodeId, remoteTarget, trigger, excludedNodeNames, decision, state, failureReason, drainDeadline, startDeadline, createdAt, updatedAt, members]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, const: TASK_OFFLOAD}
        taskId: {type: string, format: uuid}
        sourceAttemptId: {type: string, format: uuid}
        targetAttemptId: {type: [string, 'null'], format: uuid}
        targetNodeId: {type: [string, 'null'], format: uuid, description: NODE 전환의 지정 노드. Remote 또는 자동 전환이면 null입니다.}
        remoteTarget: {$ref: '#/components/schemas/RemoteTarget'}
        trigger: {type: string, enum: [MANUAL, CPU, MEMORY, LATENCY]}
        excludedNodeNames:
          type: array
          maxItems: 16
          items: {type: string}
        decision: {$ref: '#/components/schemas/OffloadDecision'}
        members:
          type: array
          description: STREAM의 고정된 그룹 구성원과 체크포인트 인계 이력. 일반 RESTART 전환은 빈 배열입니다. 같은 Operation이 각 구성원의 Task 이력에 나타납니다.
          items: {$ref: '#/components/schemas/OffloadMember'}
        state: {type: string, enum: [DRAINING, STARTING, SUCCEEDED, FAILED, CANCELLING, CANCELLED]}
        failureReason: {type: [string, 'null']}
        drainDeadline: {type: string, format: date-time}
        startDeadline: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OffloadMember:
      type: object
      additionalProperties: false
      required: [taskId, sourceAttemptId, targetAttemptId, checkpointId, targetNodeId, excludedNodeNames]
      properties:
        taskId: {type: string, format: uuid}
        sourceAttemptId: {type: string, format: uuid}
        targetAttemptId: {type: [string, 'null'], format: uuid}
        checkpointId: {type: string, format: uuid, description: 이전 producer를 차단할 때 고정한 외부 체크포인트}
        targetNodeId: {type: [string, 'null'], format: uuid, description: 이 구성원의 NODE 대상. null이면 기존 AUTO 정책을 유지합니다.}
        excludedNodeNames:
          type: array
          maxItems: 16
          items: {type: string}
    RuntimeTelemetry:
      type: object
      additionalProperties: false
      required: [attemptId, sequence, observedAt, receivedAt, intervalMillis, resourceSource, cpuUsageMicros, cpuLimitMillicores, memoryBytes, memoryLimitBytes, latencySource, latencyMicros, latencyObservedAt]
      properties:
        attemptId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        observedAt: {type: string, format: date-time}
        receivedAt: {type: string, format: date-time}
        intervalMillis: {type: integer, minimum: 200, maximum: 60000}
        resourceSource: {type: [string, 'null'], enum: [CGROUP_V2, null], description: Runner와 workload가 속한 cgroup의 측정. Node 잔여량이 아닙니다.}
        cpuUsageMicros: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
        cpuLimitMillicores: {type: [integer, 'null'], minimum: 1, maximum: 1000000000}
        memoryBytes: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
        memoryLimitBytes: {type: [integer, 'null'], minimum: 1, maximum: 9007199254740991}
        latencySource: {type: [string, 'null'], enum: [WORKLOAD, null]}
        latencyMicros: {type: [integer, 'null'], minimum: 0, maximum: 600000000, description: 서비스가 보고한 개별 지연. percentile이 아닙니다.}
        latencyObservedAt: {type: [string, 'null'], format: date-time}
    EmptyCommand:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    WorkflowPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        nextOffset:
          type:
          - integer
          - 'null'
    RunPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRun'
        nextOffset:
          type:
          - integer
          - 'null'
    Operation:
      oneOf:
      - {$ref: '#/components/schemas/OffloadOperation'}
      - {$ref: '#/components/schemas/VDOperation'}
    VDExecutionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    VDOperation:
      type: object
      additionalProperties: false
      required: [id, kind, vdId, requestedRevision, sourceRuntimeId, targetRuntimeId, state, reason, createdAt, updatedAt, finishedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [VD_PROVISION, VD_REPLACE, VD_DRAIN]}
        vdId: {type: string, format: uuid}
        requestedRevision: {type: integer, format: int64}
        sourceRuntimeId: {type: [string, 'null'], format: uuid}
        targetRuntimeId: {type: [string, 'null'], format: uuid}
        state: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, SUPERSEDED]}
        reason: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    VDRuntime:
      type: object
      additionalProperties: false
      required: [id, vdId, generation, requestedRevision, desiredState, observedState, ready, podUid, nodeUid, nodeName, leaseUntil, readyAt, startupDeadline, drainDeadline, failureReason, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        vdId: {type: string, format: uuid}
        generation: {type: integer, format: int64, minimum: 1}
        requestedRevision: {type: integer, format: int64}
        desiredState: {type: string, enum: [RUNNING, DRAINING, STOPPED]}
        observedState: {type: string, enum: [PENDING, SUBMITTED, READY, UNREADY, TERMINATED]}
        ready: {type: boolean, description: asOf 시점 준비 상태. leaseUntil 이후에는 이 응답으로 준비됨을 표시하지 마세요.}
        podUid: {type: [string, 'null'], format: uuid}
        nodeUid: {type: [string, 'null'], format: uuid}
        nodeName: {type: [string, 'null']}
        leaseUntil: {type: [string, 'null'], format: date-time}
        readyAt: {type: [string, 'null'], format: date-time}
        startupDeadline: {type: string, format: date-time}
        drainDeadline: {type: [string, 'null'], format: date-time}
        failureReason: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    VDRuntimeBinding:
      type: object
      additionalProperties: false
      required: [id, vdId, runtimeId, openedRevision, closedRevision, openedAt, closedAt]
      properties:
        id: {type: string, format: uuid}
        vdId: {type: string, format: uuid}
        runtimeId: {type: string, format: uuid}
        openedRevision: {type: integer, format: int64}
        closedRevision: {type: [integer, 'null'], format: int64}
        openedAt: {type: string, format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
    VDExecution:
      type: object
      additionalProperties: false
      required: [vdId, enabled, asOf, current, pendingOperation, runtimeHistory, runtimeHistoryTruncated, bindings, bindingsTruncated, operations, operationsTruncated]
      properties:
        vdId: {type: string, format: uuid}
        enabled: {type: boolean}
        asOf: {type: string, format: date-time}
        current:
          oneOf: [{$ref: '#/components/schemas/VDRuntime'}, {type: 'null'}]
        pendingOperation:
          oneOf: [{$ref: '#/components/schemas/VDOperation'}, {type: 'null'}]
        runtimeHistory: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/VDRuntime'}}
        runtimeHistoryTruncated: {type: boolean}
        bindings: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/VDRuntimeBinding'}}
        bindingsTruncated: {type: boolean}
        operations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/VDOperation'}}
        operationsTruncated: {type: boolean}
    VirtualDeviceSources:
      type: array
      maxItems: 16
      description: Profile에 선언한 sourceKey마다 Device 하나. 필수 원본은 모두 지정합니다.
      items:
        type: object
        additionalProperties: false
        required: [sourceKey, deviceId]
        properties:
          sourceKey: {$ref: '#/components/schemas/ProfileKey'}
          deviceId: {type: string, format: uuid}
    VirtualDevicePlacement:
      oneOf:
      - type: object
        additionalProperties: false
        required: [mode]
        properties:
          mode: {const: AUTO}
      - type: object
        additionalProperties: false
        required: [mode, nodeId]
        properties:
          mode: {const: NODE}
          nodeId: {type: string, format: uuid}
      description: 후속 VD provision에 사용할 배치 의도. Node는 존재해야 하며 실제 배치는 scheduler가 담당합니다.
    VirtualDeviceCreate:
      type: object
      additionalProperties: false
      required: [key, displayName, profileVersionId, sources, placement]
      properties:
        key: {$ref: '#/components/schemas/ProfileKey'}
        displayName: {type: string, minLength: 1, maxLength: 128}
        profileVersionId: {type: string, format: uuid, description: edgeai.vd/v1 규격의 발행된 VD Profile UUID}
        sources: {$ref: '#/components/schemas/VirtualDeviceSources'}
        placement: {$ref: '#/components/schemas/VirtualDevicePlacement'}
    VirtualDeviceUpdate:
      type: object
      additionalProperties: false
      required: [revision, displayName, sources, placement]
      properties:
        revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        displayName: {type: string, minLength: 1, maxLength: 128}
        sources: {$ref: '#/components/schemas/VirtualDeviceSources'}
        placement: {$ref: '#/components/schemas/VirtualDevicePlacement'}
    VirtualDevice:
      type: object
      required: [id, key, displayName, profileVersionId, serviceProfileVersionId, state, revision, placement, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        key: {$ref: '#/components/schemas/ProfileKey'}
        displayName: {type: string}
        profileVersionId: {type: string, format: uuid}
        serviceProfileVersionId: {type: string, format: uuid}
        state: {type: string, enum: [REGISTERED, RELEASED], description: 현재 논리 등록/해제. 실제 Runtime Ready 상태가 아닙니다.}
        revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        placement: {$ref: '#/components/schemas/VirtualDevicePlacement'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    VDSourceBinding:
      type: object
      required: [id, vdId, sourceKey, deviceId, deviceProfileVersionId, sourceMode, openedRevision, closedRevision, openedAt, closedAt]
      properties:
        id: {type: string, format: uuid}
        vdId: {type: string, format: uuid}
        sourceKey: {type: string}
        deviceId: {type: string, format: uuid}
        deviceProfileVersionId: {type: string, format: uuid}
        sourceMode: {type: string, enum: [LIVE, REPLAY, SYNTHETIC]}
        openedRevision: {type: integer, format: int64}
        closedRevision: {type: [integer, 'null'], format: int64}
        openedAt: {type: string, format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
    VirtualDeviceDetail:
      type: object
      required: [vd, activeSources, sourceHistory, sourceHistoryTruncated]
      properties:
        vd: {$ref: '#/components/schemas/VirtualDevice'}
        activeSources: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/VDSourceBinding'}}
        sourceHistory: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/VDSourceBinding'}}
        sourceHistoryTruncated: {type: boolean}


tags:
- name: 플랫폼
  description: 현재 서버 정보와 실제 구현된 기능을 확인합니다.
- name: 상태 확인
  description: Kubernetes readiness/liveness 및 연결 장애 진단에 사용합니다.
- name: 인증
  description: Basic 인증을 사용하는 쓰기 요청의 CSRF 토큰을 발급합니다.
- name: Profile
  description: DEVICE·SERVICE·VD 프로필의 불변 버전을 발행하고 조회합니다.
- name: Device
  description: 물리 장치·Node 연결 이력·재접속 세션·상태 관측을 관리합니다.
- name: Node
  description: Kubernetes/KubeEdge 실행 호스트의 실제 관측을 조회합니다.
- name: Workflow
  description: 불변 DAG 정의·발행 버전 관리
- name: Run
  description: 실행 요청·중복 방지·작업 상태·취소
- name: Task
  description: 논리 작업 및 Attempt 이력
- name: Result
  description: 검증·확정된 작업 결과와 고정 object version 메타데이터

- name: Operation
  description: 비동기 전환·종료·새 실행 확인 상태


- name: VD
  description: 영속 VD 등록과 원본 연결·이력 관리

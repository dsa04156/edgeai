          type:
          - integer
          - 'null'
    ExecutionPolicy:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - AUTO
        - type: object
          additionalProperties: false
          required:
            - mode
            - nodeId
          properties:
            mode:
              type: string
              enum:
                - NODE
            nodeId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - mode
            - providerKey
          properties:
            mode:
              type: string
              const: REMOTE
            providerKey:
              type: string
              maxLength: 63
              pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
              description: 서버에 설정된 Remote 제공자 key. endpoint와 자격은 요청에 넣지 않습니다.
    RemoteTarget:
      type: [object, 'null']
      additionalProperties: false
      description: 요청 시 고정된 제공자 설정. SYNTHETIC 참조 계산은 실장비 검증이 아닙니다. 비밀정보와 endpoint는 반환하지 않습니다.
      required: [providerKey, configurationDigest, sourceMode]
      properties:
        providerKey: {type: string, maxLength: 63, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
        configurationDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        sourceMode: {type: string, enum: [SYNTHETIC, EXTERNAL]}
    RetryPolicy:
      type: object
      additionalProperties: false
      description: Task별 자동 재시도 정책. 생략하면 최초 1회만 실행합니다. 같은 Task ID에서 새 Attempt/epoch를 만들며 이전 실행의 종료와 대기 시간을 확인합니다. STREAM은 계산 중 연결된 그룹을 함께 재시도하고 모든 이전 실행 종료와 broker 권한 회수를 기다립니다. 그룹 구성원 중 가장 이른 기한을 따르며 각 Task의 횟수 예산을 소비합니다. 완료 허가 뒤에는 실패한 Task의 최종 처리만 재시도합니다. 입력·출력 오류, 결과 누락, 소유권 충돌과 취소는 재시도하지 않습니다.
      required: [maxAttempts, backoffSeconds, maxElapsedSeconds, retryOn]
      properties:
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 8
          description: 최초 실행과 RETRY를 포함한 최대 시도 횟수. OFFLOAD는 별도 한도이며 이 예산을 소비하지 않습니다. 2 이상이면 retryOn을 한 개 이상 지정합니다.
        backoffSeconds:
          type: integer
          minimum: 1
          maximum: 300
          description: 실패 후 다음 Attempt까지 최소 대기 시간(초).
        maxElapsedSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Task의 최초 Attempt 생성부터 새 Attempt를 시작할 수 있는 시간(초). 실행 중 Attempt의 timeout은 SERVICE 규격을 따릅니다.
        retryOn:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: string
            enum: [WORKLOAD_FAILED, TIMEOUT, STORAGE_FAILED, RUNNER_FAILED, DISPATCH_TIMEOUT, RUNTIME_TIMEOUT, RUNTIME_LOST, JOB_FAILED]
      allOf:
      - if:
          properties:
            maxAttempts:
              minimum: 2
        then:
          properties:
            retryOn:
              minItems: 1
      example:
        maxAttempts: 3
        backoffSeconds: 5
        maxElapsedSeconds: 600
        retryOn: [STORAGE_FAILED, RUNTIME_LOST]
    OffloadPolicy:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: >-
        명시적으로 활성화하는 작업별 자동 전환. 생략/null이면 비활성입니다. Kubernetes 측정만 지원하며 REMOTE 실행 요청과 함께 지정하면409입니다. 일반 SERVICE는 RESTART, STREAM SERVICE는
        CHECKPOINT 복구를 선언해야 합니다. STREAM은 현재 그룹 전체의 체크포인트·실행 신원·경로·대기 시간·전환 예산을 확인하고 전체 종료와 권한 회수 후 상태를 인계합니다. 선택된 작업의 최초 NODE 지정도 전환 후
        AUTO로 바뀔 수 있으며 다른 구성원의 배치 정책은 유지합니다. 같은 지표의 최신 연속 표본이 모두 임계값 이상이어야 하며, 선택된 작업의 이전 실행 노드를 제외하고 kube-scheduler가 배치합니다. 실제 실패는 별도
        retry 정책을 따릅니다. 최적 성능을 보장하는 알고리즘이 아닙니다.
      required:
        - cpuPercent
        - memoryPercent
        - latencyMicros
        - consecutiveSamples
        - maxSampleAgeSeconds
        - maxGapSeconds
        - minRunningSeconds
        - cooldownSeconds
        - maxTransfers
        - drainTimeoutSeconds
        - startTimeoutSeconds
      properties:
        cpuPercent:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100
          description: cgroup CPU 제한 대비 사용률. 제한 미수집/무제한은 판단하지 않음
        memoryPercent:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100
          description: cgroup 메모리 제한 대비 사용률
        latencyMicros:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 600000000
          description: 서비스 개별 지연의 마이크로초 임계값. p95/p99가 아님
        consecutiveSamples:
          type: integer
          minimum: 2
          maximum: 6
        maxSampleAgeSeconds:
          type: integer
          minimum: 10
          maximum: 60
        maxGapSeconds:
          type: integer
          minimum: 5
          maximum: 30
          description: 인접 표본의 최대 시간 간격. 누락 sequence는 연속으로 인정하지 않음
        minRunningSeconds:
          type: integer
          minimum: 10
          maximum: 3600
          description: 현재 Attempt 시작 후 대기. STREAM은 그룹 모두의 대기 완료 이후 표본만 사용
        cooldownSeconds:
          type: integer
          minimum: 10
          maximum: 3600
          description: 이전 수동/자동 전환 완료 후 대기. STREAM은 그룹 모두의 대기 완료 이후 새 표본만 사용
        maxTransfers:
          type: integer
          minimum: 1
          maximum: 8
          description: 작업별 자동 전환 횟수. STREAM은 함께 재시작하는 모든 구성원의 예산을 소비하며 수동과 합친 전체 8회 제한도 적용
        drainTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 600
        startTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 600
      not:
        type: object
        required:
          - cpuPercent
          - memoryPercent
          - latencyMicros
        properties:
          cpuPercent:
            type: 'null'
          memoryPercent:
            type: 'null'
          latencyMicros:
            type: 'null'
      example:
        cpuPercent: 90
        memoryPercent: 90
        latencyMicros: null
        consecutiveSamples: 3
        maxSampleAgeSeconds: 30
        maxGapSeconds: 10
        minRunningSeconds: 30
        cooldownSeconds: 120
        maxTransfers: 1
        drainTimeoutSeconds: 60
        startTimeoutSeconds: 120
    OffloadDecision:
      type: [object, 'null']
      additionalProperties: false
      description: 자동 판단 시 복사한 정책과 원시 측정. 최신 측정 보관 만료 후에도 남는 결정 근거. 수동 요청이면 null.
      required: [policy, evaluatedAt, eligibleSince, samples]
      properties:
        policy: {$ref: '#/components/schemas/OffloadPolicy'}
        evaluatedAt: {type: string, format: date-time}
        eligibleSince: {type: string, format: date-time}
        samples:
          type: array
          minItems: 2
          maxItems: 6
          items: {$ref: '#/components/schemas/RuntimeTelemetry'}
    TaskExecutions:
      type: object
      maxProperties: 128
      propertyNames:
        $ref: '#/components/schemas/ProfileKey'
      description: >-
        작업 키별 최초 실행 위치입니다. BATCH는 AUTO/NODE/REMOTE를, STREAM은 AUTO/NODE를 지원합니다. 생략한 작업은 execution 기본값을 따르며 Remote 제공자 설정은 대기 작업에도
        고정합니다.
      additionalProperties:
        $ref: '#/components/schemas/ExecutionPolicy'
      example:
        decode:
          mode: AUTO
        infer:
          mode: NODE
          nodeId: 730912fc-52fb-437b-a31b-5df5c68e22ab
    RunCreate:
      type: object
      additionalProperties: false
      required:
      - workflowVersionId
      - execution
      - parameters
      properties:
        device:
          type: object
          additionalProperties: false
          required: [id, outputs]
          description: 'CRD device reference; resolved to parameters.device values at Run admission. No protocol settings.'
          properties:
            id: {type: string}
            outputs: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string}}
        workflowVersionId:
          type: string
          format: uuid
        streamInputs:
          type: array
          maxItems: 128
          description: >-
            장치의 현재 활성 세션을 실행 생성 시 고정하는 입력 목록입니다. 같은 toTask/toPort는 한 번만
            지정하며 발행된 Task 의존 입력을 대체할 수 없습니다. 항목 순서는 멱등 요청의 의미를 바꾸지 않습니다.
            모든 SERVICE stream 입력/출력은 장치 입력 또는 STREAM 의존 경로로 연결되어야 합니다.
          items: {$ref: '#/components/schemas/StreamRunInput'}
        execution:
          $ref: '#/components/schemas/ExecutionPolicy'
        taskExecutions:
          $ref: '#/components/schemas/TaskExecutions'
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
        parameters:
          type: object
          additionalProperties: true
    StreamRunInput:
      type: object
      additionalProperties: false
      required: [deviceId, sourcePort, toTask, toPort, maxPayloadBytes]
      properties:
        deviceId: {type: string, format: uuid}
        sourcePort: {$ref: '#/components/schemas/ProfileKey'}
        toTask: {$ref: '#/components/schemas/ProfileKey'}
        toPort: {$ref: '#/components/schemas/ProfileKey'}
        maxPayloadBytes: {type: integer, minimum: 1, maximum: 262144}
    StreamRoutePage:
      type: object
      additionalProperties: false
      required: [items, nextOffset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StreamRoute'}}
        nextOffset: {type: [integer, 'null'], minimum: 0}
    StreamRoute:
      type: object
      additionalProperties: false
      required: [id, runId, componentId, sourceTaskId, sourceDeviceId, sourceProfileVersionId, sourceMode, sourcePort, consumerTaskId, consumerPort, mediaType, maxPayloadBytes, sourceSessionId, sourceEpoch, generation]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        componentId: {type: [string, 'null'], format: uuid}
        sourceTaskId: {type: [string, 'null'], format: uuid}
        sourceDeviceId: {type: [string, 'null'], format: uuid}
        sourceProfileVersionId: {type: string, format: uuid}
        sourceMode: {type: [string, 'null'], enum: [LIVE, REPLAY, SYNTHETIC, null]}
        sourcePort: {type: string}
        consumerTaskId: {type: string, format: uuid}
        consumerPort: {type: string}
        mediaType: {type: string}
        maxPayloadBytes: {type: integer, minimum: 1, maximum: 262144}
        sourceSessionId: {type: [string, 'null'], format: uuid}
        sourceEpoch: {type: [integer, 'null'], minimum: 1, maximum: 9007199254740991}
        generation:
          oneOf:
          - {$ref: '#/components/schemas/StreamRouteGeneration'}
          - {type: 'null'}
    StreamRouteGeneration:
      type: object
      additionalProperties: false
      required: [id, number, state, producerId, producerEpoch, consumerAttemptId, consumerEpoch, leaseUntil, fenceReason, closedAt]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, minimum: 1, maximum: 9007199254740991}
        state: {type: string, enum: [PREPARING, ACTIVE, FENCED, CLOSED]}
        producerId: {type: string, format: uuid}
        producerEpoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        consumerAttemptId: {type: string, format: uuid}
        consumerEpoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        leaseUntil: {type: string, format: date-time}
        fenceReason: {type: [string, 'null']}
        closedAt: {type: [string, 'null'], format: date-time}
    WorkflowRun:
      type: object
      additionalProperties: false
      required:
        - id
        - workflowVersionId
        - mode
        - nodeId
        - remoteTarget
        - retry
        - offload
        - taskExecutions
        - parameters
        - state
        - createdAt
        - updatedAt
        - vdId
      properties:
        id:
          type: string
          format: uuid
        workflowVersionId:
          type: string
          format: uuid
        remoteTarget:
          $ref: '#/components/schemas/RemoteTarget'
        taskExecutions:
          $ref: '#/components/schemas/HistoricalTaskExecutions'
        mode:
          type: string
          enum:
            - AUTO
            - NODE
            - REMOTE
            - VD
          description: VD는 제거된 기능의 과거 이력에만 사용되는 읽기 전용 값입니다.
        vdId:
          type:
            - string
            - 'null'
          format: uuid
          description: 제거된 VD 기능의 과거 이력 식별자. 새 실행 입력에는 사용할 수 없습니다.
          readOnly: true
        nodeId:
          type:
            - string
            - 'null'
          format: uuid
        retry:
          $ref: '#/components/schemas/RetryPolicy'
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
        parameters:
          type: object
          additionalProperties: true
        state:
          type: string
          enum:
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLING
            - CANCELLED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - runId
        - definitionId
        - key
        - state
        - cancellationReason
        - initialMode
        - initialNodeId
        - initialRemoteTarget
        - createdAt
        - updatedAt
        - initialVdId
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        definitionId:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        initialMode:
          type: string
          enum:
            - AUTO
            - NODE
            - REMOTE
            - VD
          description: VD는 제거된 기능의 과거 이력에만 사용되는 읽기 전용 값입니다.
        initialNodeId:
          type:
            - string
            - 'null'
          format: uuid
          description: 최초 NODE 배치의 노드 UID입니다. 나머지 모드는 null입니다.
        initialVdId:
          type:
            - string
            - 'null'
          format: uuid
          description: 제거된 VD 기능의 과거 이력 식별자. 새 실행 입력에는 사용할 수 없습니다.
          readOnly: true
        initialRemoteTarget:
          $ref: '#/components/schemas/RemoteTarget'
        state:
          type: string
          enum:
            - WAITING
            - READY
            - RUNNING
            - RETRY_WAIT
            - OFFLOADING
            - SUCCEEDED
            - FAILED
            - CANCELLING
            - CANCELLED
            - SKIPPED
        cancellationReason:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - taskId
        - number
        - epoch
        - state
        - mode
        - nodeId
        - remoteTarget
        - cause
        - excludedNodeNames
        - createdAt
        - updatedAt
        - vdId
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        epoch:
          type: integer
          minimum: 1
        remoteTarget:
          $ref: '#/components/schemas/RemoteTarget'
        mode:
          type: string
          enum:
            - AUTO
            - NODE
            - REMOTE
            - VD
          description: VD는 제거된 기능의 과거 이력에만 사용되는 읽기 전용 값입니다.
        nodeId:
          type:
            - string
            - 'null'
          format: uuid
        vdId:
          type:
            - string
            - 'null'
          format: uuid
          description: 제거된 VD 기능의 과거 이력 식별자. 새 실행 입력에는 사용할 수 없습니다.
          readOnly: true
        cause:
          type: string
          enum:
            - INITIAL
            - RETRY
            - OFFLOAD
        excludedNodeNames:
          type: array
          maxItems: 16
          items:
            type: string
          description: AUTO에서 제외할 이전 실행 노드. 재시도도 동일 제약을 유지합니다.
        state:
          type: string
          enum:
            - QUEUED
            - DISPATCHING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLING
            - CANCELLED
            - OFFLOADED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Placement:
      type: object
      required: [taskId, taskKey, taskState, attempt, runtime]
      properties:
        taskId: {type: string, format: uuid}
        taskKey: {type: string}
        taskState: {type: string}
        attempt:
          oneOf:
          - {$ref: '#/components/schemas/TaskAttempt'}
          - {type: 'null'}
        runtime:
          oneOf:
          - {$ref: '#/components/schemas/RuntimePlacement'}
          - {type: 'null'}
    RuntimePlacement:
      type: object
      required: [id, namespace, jobName, nodeName, podUid, desiredState, observedState, failureReason, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespace: {type: string}
        jobName: {type: [string, 'null']}
        nodeName: {type: [string, 'null']}
        podUid: {type: [string, 'null'], format: uuid}
        desiredState: {type: string}
        observedState: {type: string}
        failureReason: {type: [string, 'null']}
        updatedAt: {type: string, format: date-time}
    RunDetail:
      type: object
      additionalProperties: false
      required:
      - run
      - tasks
      properties:
        run:
          $ref: '#/components/schemas/WorkflowRun'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    TaskDetail:
      type: object
      additionalProperties: false
      required:
        - task
        - attempts
        - offloads
        - telemetry
        - vdInputs
      properties:
        vdInputs:
          description: 기존 VD 실행의 읽기 전용 입력 이력
          oneOf:
            - $ref: '#/components/schemas/HistoricalSensorInput'
            - type: 'null'
          readOnly: true
        telemetry:
          description: 최신 Attempt의 최신 측정. 미수집은 null이며 과거 Attempt의 값으로 대체하지 않습니다.
          oneOf:
            - $ref: '#/components/schemas/RuntimeTelemetry'
            - type: 'null'
        offloads:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/OffloadOperation'
        task:
          $ref: '#/components/schemas/Task'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/TaskAttempt'
    TaskResults:
      type: object
      additionalProperties: false
      required: [taskId, items]
      properties:
        taskId: {type: string, format: uuid}
        items:
          type: array
          maxItems: 1
          items: {$ref: '#/components/schemas/TaskResult'}
    TaskResult:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              remoteAllocationId:
                type: string
            required:
              - remoteAllocationId
          then:
            properties:
              producerPodUid:
                type: 'null'
              remoteSourceMode:
                enum:
                  - SYNTHETIC
                  - EXTERNAL
          else:
            properties:
              producerPodUid:
                type: string
              remoteSourceMode:
                type: 'null'
      required:
        - id
        - taskId
        - attemptId
        - runtimeId
        - epoch
        - producerPodUid
        - remoteAllocationId
        - remoteSourceMode
        - manifestDigest
        - createdAt
        - artifacts
        - vdRuntimeId
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        runtimeId:
          type: string
          format: uuid
        epoch:
          type: integer
          format: int64
          minimum: 1
        producerPodUid:
          type:
            - string
            - 'null'
          format: uuid
          description: Kubernetes 결과의 실제 producer Pod UID. Remote 결과는 null입니다.
        remoteAllocationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Remote 결과의 영속 할당 ID. producerPodUid와 정확히 하나만 제공됩니다.
        remoteSourceMode:
          enum:
            - null
            - SYNTHETIC
            - EXTERNAL
          description: Remote 참조 계산은 SYNTHETIC입니다. 실제 외부 제공자 EXTERNAL과 구분하며 Kubernetes 결과에서는 null입니다.
        vdRuntimeId:
          type:
            - string
            - 'null'
          format: uuid
          description: 제거된 VD 기능의 과거 이력 식별자. 새 실행 입력에는 사용할 수 없습니다.
          readOnly: true
        manifestDigest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        createdAt:
          type: string
          format: date-time
        artifacts:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/ResultArtifact'
    ResultArtifact:
      type: object
      additionalProperties: false
      required: [port, bucket, objectKey, objectVersion, sha256, bytes, mediaType]
      properties:
        port: {type: string}
        bucket: {type: string}
        objectKey: {type: string}
        objectVersion: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes: {type: integer, format: int64, minimum: 0, maximum: 268435456}
        mediaType: {type: string}
    OffloadCreate:
      type: object
      additionalProperties: false
      required: [sourceAttemptId, drainTimeoutSeconds, startTimeoutSeconds]
      oneOf:
      - required: [targetNodeId]
        not: {required: [targetProviderKey]}
      - required: [targetProviderKey]
        not: {required: [targetNodeId]}
      properties:
        sourceAttemptId: {type: string, format: uuid, description: 현재 RUNNING Attempt ID. 오래된 화면에서 전환하는 것을 방지합니다.}
        targetNodeId: {type: string, format: uuid, description: 다른 READY 노드 UUID. scheduler가 hard affinity를 적용합니다.}
        targetProviderKey: {type: string, maxLength: 63, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', description: Remote 전환 대상. targetNodeId와 정확히 하나만 지정합니다.}
        drainTimeoutSeconds: {type: integer, minimum: 1, maximum: 600, description: 이전 Runtime 종료 확인 제한 시간}
        startTimeoutSeconds: {type: integer, minimum: 1, maximum: 600, description: 새 Attempt 생성부터 producer claim까지 제한 시간}
      example:
        sourceAttemptId: 11111111-1111-4111-8111-111111111111
        targetNodeId: 22222222-2222-4222-8222-222222222222
        drainTimeoutSeconds: 60
        startTimeoutSeconds: 120
    OffloadOperation:
      type: object
      additionalProperties: false
      required: [id, kind, taskId, sourceAttemptId, targetAttemptId, targetNodeId, remoteTarget, trigger, excludedNodeNames, decision, state, failureReason, drainDeadline, startDeadline, createdAt, updatedAt, members]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, const: TASK_OFFLOAD}
        taskId: {type: string, format: uuid}
        sourceAttemptId: {type: string, format: uuid}
        targetAttemptId: {type: [string, 'null'], format: uuid}
        targetNodeId: {type: [string, 'null'], format: uuid, description: NODE 전환의 지정 노드. Remote 또는 자동 전환이면 null입니다.}
        remoteTarget: {$ref: '#/components/schemas/RemoteTarget'}
        trigger: {type: string, enum: [MANUAL, CPU, MEMORY, LATENCY]}
        excludedNodeNames:
          type: array
          maxItems: 16
          items: {type: string}
        decision: {$ref: '#/components/schemas/OffloadDecision'}
        members:
          type: array
          description: STREAM의 고정된 그룹 구성원과 체크포인트 인계 이력. 일반 RESTART 전환은 빈 배열입니다. 같은 Operation이 각 구성원의 Task 이력에 나타납니다.
          items: {$ref: '#/components/schemas/OffloadMember'}
        state: {type: string, enum: [DRAINING, STARTING, SUCCEEDED, FAILED, CANCELLING, CANCELLED]}
        failureReason: {type: [string, 'null']}
        drainDeadline: {type: string, format: date-time}
        startDeadline: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OffloadMember:
      type: object
      additionalProperties: false
      required:
        - taskId
        - sourceAttemptId
        - targetAttemptId
        - checkpointId
        - targetNodeId
        - excludedNodeNames
        - targetVdId
      properties:
        taskId:
          type: string
          format: uuid
        sourceAttemptId:
          type: string
          format: uuid
        targetAttemptId:
          type:
            - string
            - 'null'
          format: uuid
        checkpointId:
          type: string
          format: uuid
          description: 이전 producer를 차단할 때 고정한 외부 체크포인트
        targetNodeId:
          type:
            - string
            - 'null'
          format: uuid
          description: 이 구성원의 NODE 대상. targetVdId와 둘 다 null이면 AUTO 정책입니다.
        targetVdId:
          type:
            - string
            - 'null'
          format: uuid
          description: 제거된 VD 기능의 과거 이력 식별자. 새 실행 입력에는 사용할 수 없습니다.
          readOnly: true
        excludedNodeNames:
          type: array
          maxItems: 16
          items:
            type: string
    RuntimeTelemetry:
      type: object
      additionalProperties: false
      required: [attemptId, sequence, observedAt, receivedAt, intervalMillis, resourceSource, cpuUsageMicros, cpuLimitMillicores, memoryBytes, memoryLimitBytes, latencySource, latencyMicros, latencyObservedAt]
      properties:
        attemptId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        observedAt: {type: string, format: date-time}
        receivedAt: {type: string, format: date-time}
        intervalMillis: {type: integer, minimum: 200, maximum: 60000}
        resourceSource: {type: [string, 'null'], enum: [CGROUP_V2, null], description: Runner와 workload가 속한 cgroup의 측정. Node 잔여량이 아닙니다.}
        cpuUsageMicros: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
        cpuLimitMillicores: {type: [integer, 'null'], minimum: 1, maximum: 1000000000}
        memoryBytes: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
        memoryLimitBytes: {type: [integer, 'null'], minimum: 1, maximum: 9007199254740991}
        latencySource: {type: [string, 'null'], enum: [WORKLOAD, null]}
        latencyMicros: {type: [integer, 'null'], minimum: 0, maximum: 600000000, description: 서비스가 보고한 개별 지연. percentile이 아닙니다.}
        latencyObservedAt: {type: [string, 'null'], format: date-time}
    EmptyCommand:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    WorkflowPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        nextOffset:
          type:
          - integer
          - 'null'
    RunPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRun'
        nextOffset:
          type:
          - integer
          - 'null'
    Operation:
      oneOf:
        - $ref: '#/components/schemas/OffloadOperation'
        - $ref: '#/components/schemas/VDOperation'
    HistoricalExecutionPolicy:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - AUTO
        - type: object
          additionalProperties: false
          required:
            - mode
            - nodeId
          properties:
            mode:
              type: string
              enum:
                - NODE
            nodeId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - mode
            - providerKey
          properties:
            mode:
              type: string
              const: REMOTE
            providerKey:
              type: string
              maxLength: 63
              pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
              description: 서버에 설정된 Remote 제공자 key. endpoint와 자격은 요청에 넣지 않습니다.
        - type: object
          additionalProperties: false
          required:
            - mode
            - vdId
          properties:
            mode:
              type: string
              const: VD
            vdId:
              type: string
              format: uuid
              description: 현재 Ready인 영속 VD의 ID. 이 VD에 배치하는 작업은 같은 SERVICE Profile 버전을 사용합니다.
      readOnly: true
      description: 과거 실행 위치 조회 전용. 새 실행은 ExecutionPolicy의 AUTO/NODE/REMOTE만 허용합니다.
    HistoricalTaskExecutions:
      type: object
      maxProperties: 128
      propertyNames:
        $ref: '#/components/schemas/ProfileKey'
      description: 보존된 최초 실행 위치. VD는 과거 이력에만 존재합니다.
      additionalProperties:
        $ref: '#/components/schemas/HistoricalExecutionPolicy'
      example:
        decode:
          mode: AUTO
        infer:
          mode: NODE
          nodeId: 730912fc-52fb-437b-a31b-5df5c68e22ab
      readOnly: true
    HistoricalSensorInput:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - vdId
        - vdRevision
        - capturedAt
        - sources
      properties:
        apiVersion:
          const: edgeai.vd-input/v1
        vdId:
          type: string
          format: uuid
        vdRevision:
          type: integer
          format: int64
        capturedAt:
          type: string
          format: date-time
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HistoricalSensorSourceReading'
        processing:
          type: object
          readOnly: true
          description: 기존 VD 실행에 고정한 처리 정의 원본. 새 실행 입력으로 사용할 수 없다.
          additionalProperties: true
      readOnly: true
      description: 기존 VD 실행에서 보존한 읽기 전용 센서 입력 이력
    HistoricalSensorSourceReading:
      type: object
      additionalProperties: false
      required:
        - bindingId
        - deviceId
        - deviceUid
        - deviceModel
        - maxAgeSeconds
        - properties
      properties:
        bindingId:
          type: string
          format: uuid
        deviceId:
          type: string
        deviceUid:
          type: string
          format: uuid
        deviceModel:
          type: string
        maxAgeSeconds:
          type: integer
          minimum: 1
          maximum: 300
        properties:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - value
              - dataType
              - unit
              - observedAt
            properties:
              value:
                type:
                  - string
                  - number
                  - boolean
              dataType:
                type: string
                description: 센서의 원시 자료형. value는 Mapper scale/offset 적용 후 공학 단위값입니다.
              unit:
                type: string
              observedAt:
                type: string
                format: date-time
    ContinuousCatalog:
      type: object
      additionalProperties: false
      required: [enabled, executionMode, operations, maxInputs, maxOutputs, inputs]
      properties:
        enabled: {type: boolean}
        executionMode: {const: CONTINUOUS_EKUIPER}
        operations: {type: array, items: {type: string, enum: [scalar, movingAverage, minimum, maximum, threshold, filter]}}
        maxInputs: {const: 16}
        maxOutputs: {const: 16}
        inputs:
          type: array
          maxItems: 500
          description: 수집을 추가로 실행하지 않고 조회한 측정 항목 목록. 실제 입력 수신 상태는 실행 결과에서 확인합니다.
          items: {$ref: '#/components/schemas/ContinuousSensor'}
    ContinuousConfiguration:
      type: object
      additionalProperties: false
      required: [intervalSeconds, retentionDays, outputs]
      properties:
        intervalSeconds: {type: integer, minimum: 1, maximum: 3600, default: 1}
        retentionDays: {type: integer, minimum: 1, maximum: 30, default: 7}
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items: {$ref: '#/components/schemas/ContinuousOutputDefinition'}
    ContinuousCreate:
      type: object
      additionalProperties: false
      required: [key, displayName, sources, continuous]
      properties:
        key: {$ref: '#/components/schemas/ProfileKey'}
        displayName: {type: string, minLength: 1, maxLength: 128}
        sources: {$ref: '#/components/schemas/VirtualDeviceSources'}
        continuous: {$ref: '#/components/schemas/ContinuousConfiguration'}
    ContinuousExecution:
      type: object
      additionalProperties: false
      required: [executionMode, enabled, state, reason]
      properties:
        executionMode: {const: CONTINUOUS_EKUIPER}
        enabled: {type: boolean}
        state: {type: string, enum: [STOPPED, STARTING, RUNNING, WAITING_INPUT, STOPPING, ERROR]}
        reason: {type: string}
        generation: {type: string, format: uuid}
        desiredRunning: {type: boolean}
        updatedAt: {type: string, format: date-time}
        engineId: {type: string}
        enginePodUid: {type: string, format: uuid}
        engineLeaseExpiresAt: {type: string, format: date-time}
    ContinuousHistory:
      type: object
      additionalProperties: false
      required: [vdId, outputId, from, to, retentionDays, items, gaps, truncated]
      properties:
        vdId: {type: string, format: uuid}
        outputId: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        retentionDays: {type: integer}
        truncated: {type: boolean}
        nextCursor: {type: string}
        aggregation:
          type: object
          required: [bucketSeconds]
          properties:
            bucketSeconds: {type: integer}
        gaps:
          type: array
          items:
            type: object
            required: [generation, reason, from, to]
            properties:
              generation: {type: string, format: uuid}
              reason: {type: string}
              from: {type: string, format: date-time}
              to: {type: [string, 'null'], format: date-time}
        items:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [evaluationAt]
            properties:
              evaluationAt: {type: string, format: date-time}
              generation: {type: string, format: uuid}
              sequence: {type: integer}
              evaluationId: {type: string}
              value: {type: [number, boolean]}
              type: {type: string, enum: [number, boolean]}
              unit: {type: string}
              count: {type: integer}
              min: {type: number}
              max: {type: number}
              average: {type: number}
    ContinuousOutputDefinition:
      type: object
      additionalProperties: false
      required: [name, expression, operation, unit]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', maxLength: 63}
        expression: {type: string, minLength: 1, maxLength: 1024, description: 입력 별칭과 숫자·불리언 상수, 괄호, 산술·비교·논리 연산만 지원합니다. 함수 호출과 SQL은 입력할 수 없습니다.}
        operation: {type: string, enum: [scalar, movingAverage, minimum, maximum, threshold, filter]}
        sampleCount: {type: integer, minimum: 1, maximum: 1024, description: movingAverage·minimum·maximum에만 필수. 유효한 연속 평가 횟수 기준입니다. 입력 누락 시 창을 초기화합니다.}
        condition: {type: string, minLength: 1, maxLength: 1024, description: 결과 내보내기 조건. filter에 필수입니다.}
        unit: {type: string, maxLength: 32}
    ContinuousOutputs:
      type: object
      additionalProperties: false
      required: [vdId, executionMode, asOf, intervalSeconds, retentionDays, historyEnabled, items]
      properties:
        vdId: {type: string, format: uuid}
        executionMode: {const: CONTINUOUS_EKUIPER}
        asOf: {type: string, format: date-time}
        intervalSeconds: {type: integer}
        retentionDays: {type: integer}
        historyEnabled: {type: boolean}
        items:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [name, expression, operation, unit, outputId, latest, quality]
            properties:
              name: {type: string}
              expression: {type: string}
              operation: {type: string, enum: [scalar, movingAverage, minimum, maximum, threshold, filter]}
              sampleCount: {type: integer}
              condition: {type: string}
              unit: {type: string}
              outputId: {type: string}
              quality: {type: string, enum: [VALID, STALE, NOT_AVAILABLE]}
              latest:
                oneOf: [{$ref: '#/components/schemas/ContinuousResult'}, {type: 'null'}]
    ContinuousResult:
      type: object
      additionalProperties: false
      required: [vdId, outputId, generation, sequence, evaluationId, evaluationAt, value, type, unit, historyStored, sources]
      properties:
        vdId: {type: string, format: uuid}
        outputId: {type: string}
        generation: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        evaluationId: {type: string, maxLength: 100}
        evaluationAt: {type: string, format: date-time}
        value: {type: [number, boolean]}
        type: {type: string, enum: [number, boolean]}
        unit: {type: string, maxLength: 32}
        historyStored: {type: boolean}
        sources:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [alias, deviceUid, sourceGeneration, configurationSha256, observedAt]
            properties:
              alias: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
              deviceUid: {type: string, format: uuid}
              sourceGeneration: {type: string, format: uuid}
              configurationSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              observedAt: {type: integer, minimum: 1}
    ContinuousSensor:
      type: object
      additionalProperties: false
      required: [deviceId, deviceUid, deviceModel, namespace, property, type, unit, targetNode]
      properties:
        deviceId: {type: string}
        deviceUid: {type: string, format: uuid}
        deviceModel: {type: string}
        namespace: {type: string}
        property: {type: string}
        type: {type: string, enum: [float32, float64, int16, uint16, int32, uint32, bool]}
        unit: {type: string}
        targetNode: {type: string}
    ContinuousUpdate:
      type: object
      additionalProperties: false
      required: [revision, displayName, sources, continuous]
      properties:
        revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        displayName: {type: string, minLength: 1, maxLength: 128}
        sources: {$ref: '#/components/schemas/VirtualDeviceSources'}
        continuous: {$ref: '#/components/schemas/ContinuousConfiguration'}
    VDExecution:
      type: object
      required:
      - continuous
      properties:
        continuous:
          oneOf:
          - $ref: '#/components/schemas/ContinuousExecution'
          - type: 'null'
    VDExecutionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    VDOperation:
      type: object
      additionalProperties: false
      required: [id, kind, vdId, requestedRevision, sourceRuntimeId, targetRuntimeId, state, reason, createdAt, updatedAt, finishedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [VD_PROVISION, VD_REPLACE, VD_DRAIN, VD_CONTINUOUS_START, VD_CONTINUOUS_REPLACE, VD_CONTINUOUS_STOP]}
        vdId: {type: string, format: uuid}
        requestedRevision: {type: integer, format: int64}
        sourceRuntimeId: {type: [string, 'null'], format: uuid}
        targetRuntimeId: {type: [string, 'null'], format: uuid}
        state: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, SUPERSEDED]}
        reason: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
    VDSourceBinding:
      type: object
      required: [id, vdId, sourceKey, deviceId, deviceUid, deviceModel, sourceKind, openedRevision, closedRevision, openedAt, closedAt, properties, maxAgeSeconds]
      properties:
        id: {type: string, format: uuid}
        vdId: {type: string, format: uuid}
        sourceKey: {type: string}
        deviceId: {type: string, description: 센서 Device 이름. legacy 이력은 이전 앱 UUID.}
        deviceUid: {type: [string, 'null'], format: uuid}
        deviceModel: {type: [string, 'null']}
        sourceKind: {type: string, enum: [physical, virtual, legacy]}
        properties: {type: array, maxItems: 64, items: {type: string}}
        maxAgeSeconds: {type: integer, minimum: 1, maximum: 300}
        openedRevision: {type: integer, format: int64}
        closedRevision: {type: [integer, 'null'], format: int64}
        openedAt: {type: string, format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
    VirtualDevice:
      type: object
      required:
      - id
      - key
      - displayName
      - profileVersionId
      - serviceProfileVersionId
      - state
      - revision
      - placement
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        key:
          $ref: '#/components/schemas/ProfileKey'
        displayName:
          type: string
        profileVersionId:
          type: string
          format: uuid
        serviceProfileVersionId:
          type:
          - string
          - 'null'
          format: uuid
          description: 연속 처리 VD는 SERVICE를 참조하지 않습니다.
        state:
          type: string
          enum:
          - REGISTERED
          - RELEASED
          description: 현재 논리 등록/해제. 실제 Runtime Ready 상태가 아닙니다.
        executionMode:
          type: string
          enum:
          - CONTINUOUS_EKUIPER
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        placement:
          $ref: '#/components/schemas/VirtualDevicePlacement'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VirtualDeviceDetail:
      type: object
      required:
      - vd
      - activeSources
      - sourceHistory
      - sourceHistoryTruncated
      properties:
        vd:
          $ref: '#/components/schemas/VirtualDevice'
        activeSources:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/VDSourceBinding'
        sourceHistory:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/VDSourceBinding'
        sourceHistoryTruncated:
          type: boolean
        continuous:
          $ref: '#/components/schemas/ContinuousConfiguration'
    VirtualDevicePlacement:
      oneOf:
      - type: object
        additionalProperties: false
        required: [mode]
        properties:
          mode: {const: AUTO}
      - type: object
        additionalProperties: false
        required: [mode, nodeId]
        properties:
          mode: {const: NODE}
          nodeId: {type: string, format: uuid}
      description: 후속 VD provision에 사용할 배치 의도. Node는 존재해야 하며 실제 배치는 scheduler가 담당합니다.
    VirtualDeviceSources:
      type: array
      maxItems: 16
      description: Profile에 선언한 sourceKey마다 Device 하나. 필수 원본은 모두 지정합니다.
      items:
        type: object
        additionalProperties: false
        required: [sourceKey, deviceId]
        properties:
          sourceKey: {$ref: '#/components/schemas/ProfileKey'}
          deviceId: {type: string, maxLength: 253, description: KubeEdge 센서 Device 이름}
          properties: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 63}, description: BATCH 입력으로 고정할 측정 항목. 빈 선택은 실행 전에 설정이 필요합니다.}
          maxAgeSeconds: {type: integer, minimum: 1, maximum: 300, default: 30, description: 항목별 최신 수신값의 최대 허용 경과 시간(초)}

openapi: 3.1.0
info:
  title: EdgeAI Control Plane
  version: 0.1.0
  description: Profile → Device/Node → Workflow DAG → Run/Task/Attempt와 검증된 결과 조회 API입니다.
    실제 Kubernetes 실행은 서버의 runtime 설정이 활성화된 환경에서 동작합니다. 쓰기 요청은 실제 DB에 반영되고 Swagger의 CSRF 토큰/쿠키는 자동 연결됩니다.
    복원 DB의 조회 전용 점검 모드에서는 실행 기능이 비활성화되고 CSRF가 유효한 쓰기 요청도 403으로 거절됩니다.
    일반 관리 API의 변경 요청은 먼저 감사 접수 기록을 저장하며 X-EdgeAI-Audit-Id를 반환합니다. 접수 저장 실패는503/AUDIT_STORE_UNAVAILABLE이며 변경을 실행하지 않습니다.
    감사의 HTTP 결과는 비동기 작업 성공을 뜻하지 않으며, 결과가 없는 접수 기록은 OUTCOME_UNKNOWN입니다. 복구 점검 모드에서는 감사 쓰기도 비활성화됩니다.
servers:
- url: /
security: []
paths:
  /api/devices:
    get:
      operationId: listManagedDevices
      tags: [디바이스 실행 계층]
      responses:
        "200":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDevicePage"
    post:
      security: [{csrfToken: []}]
      operationId: createManagedDevice
      tags: [디바이스 실행 계층]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedDeviceInput"
      responses:
        "201":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDevice"
  /api/devices/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9.-]*$", maxLength: 63}
    get:
      operationId: getManagedDevice
      tags: [디바이스 실행 계층]
      responses:
        "200":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDevice"
    put:
      security: [{csrfToken: []}]
      operationId: updateManagedDevice
      tags: [디바이스 실행 계층]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedDeviceInput"
      responses:
        "200":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDevice"
    delete:
      security: [{csrfToken: []}]
      operationId: deleteManagedDevice
      tags: [디바이스 실행 계층]
      responses:
        "204":
          description: KubeEdge device control result
  /api/devices/{id}/properties:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9.-]*$", maxLength: 63}
    post:
      security: [{csrfToken: []}]
      operationId: addManagedDeviceProperty
      tags: [디바이스 실행 계층]
      summary: 기존 장치에 측정 항목 하나 추가
      description: 최신 Device Profile에 항목 하나만 추가하고 DeviceModel과 Device CRD를 갱신한다. 기존 연결 설정, 다른 측정 항목과 공유 Mapper는 유지한다. 중복 이름과 동시 변경은409로 거절한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedDeviceProperty'
      responses:
        "201":
          description: 측정 항목 추가 완료. 갱신된 장치를 반환하며 첫 수집값은 아직 없을 수 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDevice'
        "400":
          description: 지원하지 않는 항목 설정 또는 항목 수 제한 초과
        "404":
          description: 장치 없음
        "409":
          description: 중복 항목, 다른 시스템 소유 또는 동시 변경 충돌
  /api/devices/{id}/properties/{property}:
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9.-]*$", maxLength: 63}
    - in: path
      name: property
      required: true
      schema: {type: string, pattern: "^[a-z][a-z0-9_]*$", maxLength: 63}
    put:
      security: [{csrfToken: []}]
      operationId: updateManagedDeviceProperty
      tags: [디바이스 실행 계층]
      summary: 측정 항목 하나의 수집 설정 수정
      description: 본문의 name은 경로의 property와 같아야 한다. 최신 Device Profile에서 해당 항목만 교체하고 DeviceModel과 Device CRD를 갱신한다. 다른 측정 항목, 연결 설정, 대상 노드, 수집 간격과 공유 Mapper는 유지한다. 동시 변경은 resourceVersion으로 보호한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedDeviceProperty'
      responses:
        "200":
          description: 측정 항목 수정 완료. 갱신된 장치를 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDevice'
        "400":
          description: 지원하지 않는 항목 설정 또는 이름 변경
        "404":
          description: 장치 또는 측정 항목 없음
        "409":
          description: 다른 시스템 소유 또는 동시 변경 충돌
    delete:
      security: [{csrfToken: []}]
      operationId: deleteManagedDeviceProperty
      tags: [디바이스 실행 계층]
      summary: 측정 항목 하나의 수집 설정 삭제
      description: 최신 Device Profile에서 지정 항목만 제거하고 DeviceModel과 Device CRD를 갱신한다. 마지막 측정 항목이면 Device 등록을 삭제한다. 공유 Mapper와 저장한 property 규격은 유지한다. 동시 변경은 resourceVersion으로 보호한다. 삭제한 항목은 Workflow 입력에서도 제외한다.
      responses:
        "204":
          description: 측정 항목 삭제 완료
        "404":
          description: 장치 또는 측정 항목 없음
        "409":
          description: 다른 시스템 소유 또는 동시 변경 충돌
  /api/device-connections/test:
    post:
      security: [{csrfToken: []}]
      operationId: testDeviceConnection
      tags: [디바이스 실행 계층]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedDeviceInput"
      responses:
        "200":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConnectionResult"
  /api/device-profiles:
    get:
      operationId: listManagedDeviceProfiles
      tags: [디바이스 실행 계층]
      responses:
        "200":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDeviceProfilePage"
    post:
      security: [{csrfToken: []}]
      operationId: createManagedDeviceProfile
      tags: [디바이스 실행 계층]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedDeviceProfile"
      responses:
        "201":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedDeviceProfile"
  /api/protocols:
    get:
      operationId: listDeviceProtocols
      tags: [디바이스 실행 계층]
      responses:
        "200":
          description: KubeEdge device control result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProtocolPage"
  /api/v1/platform:
    get:
      operationId: getPlatform
      summary: 플랫폼 정보와 구현된 기능 조회
      responses:
        '200':
          description: Implemented platform capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformInfo'
      tags:
      - 플랫폼
      description: 서버 이름·버전·현재 개발 단계와 구현된 Profile/Device/Node/Workflow/Run/Task 관리 기능을 반환합니다. 실제 실행 성공 여부는 이 metadata로 판단하지
        않습니다.
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: 서버와 PostgreSQL의 요청 처리 준비 상태 확인
      security: []
      responses:
        '200':
          description: Application and database ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application or database not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
      - 상태 확인
      description: 애플리케이션과 PostgreSQL이 함께 준비되어 있으면 200/UP을 반환합니다. DB 연결 장애 등으로 요청을 처리할 수 없으면 503/DOWN을 반환합니다. Kubernetes readiness
        probe가 사용하며 인증은 필요하지 않습니다. 내부 접속 정보는 응답하지 않습니다.
  /api/v1/csrf:
    get:
      operationId: getCsrfToken
      summary: 쓰기 요청에 사용할 CSRF 토큰 발급
      responses:
        '200':
          description: Send token as X-CSRF-TOKEN with the session cookie.
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
      tags:
      - 인증
      description: 계정 인증 없이 호출하면 token과 EDGEAI_SESSION 세션 쿠키를 받습니다. 직접 POST를 호출하는 클라이언트는 같은 쿠키와 X-CSRF-TOKEN 헤더를
        함께 보내야 합니다. 토큰은 로그인용 액세스 토큰이 아닙니다. Swagger에서는 자동 처리하므로 수동 입력할 필요가 없습니다.
  /api/v1/profiles/{kind}:
    parameters:
      - $ref: '#/components/parameters/Kind'
    post:
      operationId: publishProfile
      summary: 실행 모듈 새 버전 등록
      description: SERVICE 실행 모듈의 프로그램 이미지·명령·입출력·자원 설정을 JSON 문서로 발행합니다. 발행된 내용은 불변이며 변경은 새 버전으로 등록합니다. DEVICE 신규 발행은 종료되어 410을 반환합니다. Mapper 센서의 저장 규격은 /api/device-profiles를 사용합니다.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishProfile'
            example:
              key: temperature-average
              version: 1.0.0
              spec:
                apiVersion: edgeai/v1
                description: 실행 모듈 등록 실습. 실제 실행 설정은 service-execution.example.json을 참고하세요.
      responses:
        '200':
          description: 동일 내용의 기존 버전입니다. 중복 생성하지 않고 기존 결과를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '201':
          description: 새 버전을 발행했습니다. Location 헤더로 상세 조회할 수 있습니다.
          headers:
            Location:
              schema:
                type: string
              description: Version lookup path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          description: Missing or invalid CSRF token
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: DEVICE_PROFILE_RETIRED — 기존 앱 장치 프로필 신규 발행 종료. 센서 디바이스 관리 API를 사용하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 요청 또는 정규화된 규격이 UTF-8 64 KiB를 초과했습니다.
        '503':
          $ref: '#/components/responses/Unavailable'
      tags:
        - Profile
    get:
      operationId: listProfiles
      summary: 종류별 프로필 버전 목록 조회
      parameters:
        - in: query
          name: key
          description: 프로필 키 정확 일치 필터. 생략하면 선택한 종류의 전체 키를 조회합니다.
          schema:
            $ref: '#/components/schemas/ProfileKey'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 한 페이지의 최대 항목 수. 1~100, 기본 20입니다.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
          description: 건너뛸 항목 수. 이전 응답의 nextOffset을 넣으면 다음 페이지입니다.
      responses:
        '200':
          description: 발행 버전 목록. items가 빈 배열이면 결과가 없으며 nextOffset이 null이면 마지막 페이지입니다.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextOffset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileVersion'
                  nextOffset:
                    type:
                      - integer
                      - 'null'
        '400':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
      tags:
        - Profile
      description: >-
        선택한 종류의 발행 버전을 페이지로 조회합니다. key를 지정하면 해당 키와 정확히 일치하는 버전만 반환합니다.


        key와 version의 문자열 오름차순입니다. 따라서 1.0.0 → 10.0.0 → 2.0.0 순서일 수 있으며 최신 버전을 계산하는 API가 아닙니다. 다음 페이지는 nextOffset을 offset으로 전달하며,
        null이면 마지막입니다.
  /api/v1/profiles/{kind}/{key}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/Kind'
      - in: path
        name: key
        required: true
        schema:
          $ref: '#/components/schemas/ProfileKey'
        description: 조회할 프로필의 고유 키입니다.
      - in: path
        name: version
        required: true
        schema:
          $ref: '#/components/schemas/Version'
        description: '조회할 정확한 발행 버전입니다. 예: 1.0.0'
    get:
      operationId: getProfileVersion
      summary: 프로필의 특정 버전 상세 조회
      responses:
        '200':
          description: Published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileVersion'
        '400':
          $ref: '#/components/responses/Invalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      tags:
        - Profile
      description: >-
        kind·key·version으로 발행 버전 하나를 정확히 조회합니다. 저장된 spec, 내용 식별용 SHA-256 digest, 최초 생성 시각을 반환합니다. 이전 버전 내용을 확인하거나 후속 장치/실행 기능에서 참조할
        버전을 선택할 때 사용합니다. 해당 버전이 없으면 404를 반환합니다.
    delete:
      operationId: deleteProfileVersion
      tags:
        - Profile
      summary: 사용하지 않는 프로필 버전 삭제
      description: 장치·워크플로·실행 및 보존된 과거 이력의 참조가 있으면 PROFILE_IN_USE(409)로 거절합니다. 다른 버전은 유지합니다.
      security:
        - csrfToken: []
      responses:
        '204':
          description: 버전 삭제 완료
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          description: CSRF 토큰·세션 쿠키 누락/불일치
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PROFILE_IN_USE — 다른 자원에서 참조하는 버전
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /actuator/health/liveness:
    get:
      tags:
      - 상태 확인
      operationId: getLiveness
      summary: 서버 프로세스 생존 상태 확인
      description: Spring Boot 프로세스가 정상인지 확인합니다. DB 상태는 검사하지 않으므로 DB 장애만으로 서버를 반복 재시작하지 않습니다. Kubernetes liveness/startup
        probe에 사용하며 인증이 필요하지 않습니다.
      security: []
      responses:
        '200':
          description: 서버 프로세스 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
        '503':
          description: 서버 프로세스가 정상 상태가 아님
  /api/v1/devices:
    post:
      deprecated: true
      tags: [Device]
      operationId: registerDevice
      summary: 종료된 앱 장치 등록
      description: 별도 앱 장치 등록은 종료됐습니다. /api/devices의 센서 디바이스를 VD 원본으로 선택하세요.
      security: [{csrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceCreate'}
      responses:
        '410':
          description: 앱 장치 등록 종료
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '403': {description: CSRF 토큰·세션 쿠키 누락/불일치}
    get:
      tags:
      - Device
      operationId: listDevices
      deprecated: true
      summary: 이전 앱 장치 이력 조회
      description: key 문자열 오름차순으로 조회합니다. 해제된 장치도 이력 조회를 위해 포함합니다. 활성 세션의 최근 보고가 60초보다 오래되면 STALE이며, 보고 전에는 UNKNOWN입니다.
      responses:
        '200':
          description: 요청 성공. 재전송은 기존 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400':
          description: 필드·UUID·페이지·JSON 형식을 확인하세요.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 장치·노드·참조 Profile이 없습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: DB 연결 장애. 복구 후 재시도하세요.
          content:
            application/json:
              schema:

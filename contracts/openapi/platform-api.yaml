components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 쓰기 요청은 세션 쿠키와 함께 이 헤더가 필요합니다. Swagger는 자동 발급·전달하므로 이 입력칸을 비워 두세요. 직접 호출할 때는 getCsrfToken을 먼저
        사용합니다.
    localBasic:
      type: http
      scheme: basic
      description: 개발·내부 검증용 계정(EDGEAI_API_USER / EDGEAI_API_PASSWORD)입니다. 운영용 사용자·역할 관리는 후속 범위입니다.
  parameters:
    Kind:
      in: path
      name: kind
      required: true
      schema:
        type: string
        enum:
        - DEVICE
        - SERVICE
        - VD
      description: 'DEVICE: 장치 규격 / SERVICE: 서비스 규격 / VD: 가상 장치 규격. 동일한 key/version이라도 종류가 다르면 별개입니다.'
  responses:
    Invalid:
      description: 종류·키·버전·페이지·JSON 형식이 잘못되었습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_PROFILE
            message: 종류, 키, 버전과 JSON 규격을 확인하세요. 규격은 비어 있지 않은 객체여야 합니다.
    Conflict:
      description: 같은 종류·키·버전에 다른 내용이 이미 발행되었습니다. 새 버전을 사용하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_CONFLICT
            message: 이미 발행한 버전입니다. 내용을 바꾸려면 새 버전을 등록하세요.
    NotFound:
      description: 해당 발행 버전이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_NOT_FOUND
            message: 해당 Profile 버전을 찾을 수 없습니다.
    Unavailable:
      description: DB 연결 등 저장소 문제로 요청을 처리할 수 없습니다. 복구 후 재시도하세요.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PROFILE_STORE_UNAVAILABLE
            message: Profile 저장소에 연결할 수 없습니다. 잠시 후 다시 시도하세요.
  schemas:
    ProfileKey:
      type: string
      maxLength: 100
      pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
      description: 소문자 영문으로 시작하는 프로필 키. 영문 소문자·숫자와 구분자 점/밑줄/하이픈을 사용하며 최대 100자입니다.
      example: temperature-sensor
    Version:
      type: string
      maxLength: 32
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
      description: MAJOR.MINOR.PATCH 형태의 숫자 버전. 01처럼 앞에 0을 붙이거나 prerelease 문자를 붙일 수 없습니다.
      example: 1.0.0
    PublishProfile:
      type: object
      additionalProperties: false
      required:
      - key
      - version
      - spec
      properties:
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 비어 있지 않은 JSON 규격 문서입니다. 현재 종류별 실행 스키마·외부 참조의 호환성은 검증하지 않습니다.
    ProfileVersion:
      type: object
      required:
      - id
      - kind
      - key
      - version
      - spec
      - digest
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 이 발행 버전의 서버 생성 UUID입니다.
        kind:
          type: string
          enum:
          - DEVICE
          - SERVICE
          - VD
          description: 프로필 종류입니다. 종류마다 키·버전 공간이 구분됩니다.
        key:
          $ref: '#/components/schemas/ProfileKey'
        version:
          $ref: '#/components/schemas/Version'
        spec:
          type: object
          additionalProperties: true
          description: 발행 시 저장된 JSON 규격입니다.
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          description: 종류와 정규화된 spec의 SHA-256 식별값. JSON 키 순서나 동등한 숫자 표기는 같은 값이며, spec 또는 종류가 바뀌면 달라집니다. 상세 규칙은 ADR
            0002를 따릅니다.
        createdAt:
          type: string
          format: date-time
          description: 최초 발행 시각입니다. 동일 내용 재등록 시 유지됩니다.
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INVALID_PROFILE
          - PROFILE_CONFLICT
          - PROFILE_NOT_FOUND
          - PROFILE_STORE_UNAVAILABLE
          - PAYLOAD_TOO_LARGE
          - INVALID_DEVICE
          - DEVICE_CONFLICT
          - DEVICE_NOT_FOUND
          - NODE_NOT_FOUND
          - NODE_NOT_READY
          - DEVICE_RELEASED
          - STALE_SESSION
          - OBSERVATION_CONFLICT
          - DEVICE_STORE_UNAVAILABLE
        message:
          type: string
    PlatformInfo:
      type: object
      required:
      - name
      - version
      - milestone
      - capabilities
      properties:
        name:
          type: string
          const: edgeai
        version:
          type: string
        milestone:
          type: string
          const: M2
        capabilities:
          type: array
          items:
            type: string
      example:
        name: edgeai
        version: 0.1.0
        milestone: M2
        capabilities:
        - profiles
        - devices
        - nodes
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - OUT_OF_SERVICE
          - UNKNOWN
      example:
        status: UP
    DeviceCreate:
      type: object
      additionalProperties: false
      required:
      - key
      - displayName
      - profileVersionId
      - sourceMode
      properties:
        key: &id003
          $ref: '#/components/schemas/ProfileKey'
        displayName: &id004
          type: string
          minLength: 1
          maxLength: 128
        profileVersionId: *id001
        sourceMode: &id005
          type: string
          enum:
          - LIVE
          - REPLAY
          - SYNTHETIC
    DevicePatch:
      type: object
      additionalProperties: false
      required:
      - revision
      - displayName
      properties:
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    DeviceAttachmentInput:
      type: object
      additionalProperties: false
      required:
      - port
      properties:
        port:
          type: string
          minLength: 1
          maxLength: 128
    DeviceSessionInput:
      type: object
      additionalProperties: false
      required:
      - bootId
      properties:
        bootId: *id001
    DeviceObservationInput:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - sequence
      - observedAt
      - status
      - attributes
      properties:
        sessionId: *id001
        sequence: &id008
          type: integer
          minimum: 0
          maximum: 9007199254740991
        observedAt: &id006
          type: string
          format: date-time
        status: &id009
          type: string
          enum:
          - ONLINE
          - OFFLINE
        attributes: &id010
          type: object
          additionalProperties: true
    Device:
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - displayName
      - profileVersionId
      - sourceMode
      - state
      - revision
      - sessionEpoch
      - connectionStatus
      - lastSeenAt
      - createdAt
      - updatedAt
      properties:
        id: *id001
        key: *id003
        displayName: *id004
        profileVersionId: *id001
        sourceMode: *id005
        state:
          type: string
          enum:
          - ACTIVE
          - RELEASED
        revision:
          type: integer
          minimum: 0
        sessionEpoch:
          type: integer
          minimum: 0
        connectionStatus:
          type: string
          enum:
          - UNKNOWN
          - ONLINE
          - OFFLINE
          - STALE
          - RELEASED
        lastSeenAt: &id007
          type:
          - string
          - 'null'
          format: date-time
        createdAt: *id006
        updatedAt: *id006
    DeviceAttachment:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - nodeId
      - port
      - attachedAt
      - detachedAt
      properties:
        id: *id001
        deviceId: *id001
        nodeId: *id001
        port:
          type: string
        attachedAt: *id006
        detachedAt: *id007
    DeviceSession:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - bootId
      - epoch
      - lastSequence
      - openedAt
      - closedAt
      properties:
        id: *id001
        deviceId: *id001
        bootId: *id001
        epoch:
          type: integer
          minimum: 1
        lastSequence:
          type: integer
          minimum: -1
        openedAt: *id006
        closedAt: *id007
    DeviceObservation:
      type: object
      additionalProperties: false
      required:
      - id
      - deviceId
      - sessionId
      - sequence
      - observedAt
      - status
      - attributes
      - receivedAt
      properties:
        id: *id001
        deviceId: *id001
        sessionId: *id001
        sequence: *id008
        observedAt: *id006
        status: *id009
        attributes: *id010
        receivedAt: *id006
    DeviceDetail:
      type: object
      additionalProperties: false
      required:
      - device
      - attachments
      - sessions
      - observations
      properties:
        device:
          $ref: '#/components/schemas/Device'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttachment'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSession'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/DeviceObservation'
    ExecutionNode:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - architecture
      - operatingSystem
      - status
      - cpu
      - memory
      - labels
      - observedAt
      properties:
        id: *id001
        name:
          type: string
        architecture:
          type: string
        operatingSystem:
          type: string
        status:
          type: string
          enum:
          - READY
          - NOT_READY
          - UNKNOWN
          - REMOVED
          - STALE
        cpu:
          type: string
        memory:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        observedAt: *id006
    DevicePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        nextOffset:
          type:
          - integer
          - 'null'
    NodePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionNode'
        nextOffset:
          type:
          - integer
          - 'null'
tags:
- name: 플랫폼
  description: 현재 서버 정보와 실제 구현된 기능을 확인합니다.
- name: 상태 확인
  description: Kubernetes readiness/liveness 및 연결 장애 진단에 사용합니다.
- name: 인증
  description: Basic 인증을 사용하는 쓰기 요청의 CSRF 토큰을 발급합니다.
- name: Profile

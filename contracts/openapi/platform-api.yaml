        않습니다. 빈 JSON 객체를 보냅니다.
      responses:
        '200':
          description: 현재 저장 상태 또는 동일 입력 재요청 결과입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '400':
          description: 잘못된 필드·UUID·DAG·페이지 입력
          content:
            application/json:

openapi: 3.1.0
info:
  title: EdgeAI Runner internal contract
  version: 0.1.0
  description: M4 내부 프로토콜. 사용자 공개 Attempt 생성 API가 아니다. 현재 구현 연결·검증 상태는 PROGRESS를 따른다.
    모든 요청 JSON은 256KiB 이하이며 토큰·서명 URL은 비공개/비영속 데이터다.
servers:
- url: /
security:
- runnerClaim: []
  podIdentity: []
paths:
  /internal/v1/attempts/{attemptId}/claim:
    post:
      operationId: runnerClaim
      summary: 실제 Pod의 producer claim 및 실행 입력 조회
      description: 토큰의 attempt/epoch/claim과 실제 Kubernetes Pod UID·Job 소유 관계를 확인한다.
        같은 producer 재전송은 같은 실행 입력이며 다른 Pod는409다. 입력 URL은 고정 object version만 가리킨다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identity'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
  /internal/v1/attempts/{attemptId}/uploads:
    post:
      operationId: runnerUploads
      summary: 현재 Attempt에 제한된 출력 업로드 권한 발급
      description: SERVICE 출력 포트·크기·media type을 검증하고 전용 S3 키와 checksum header를 서명한다.
        각 포트별 요청도 허용한다. 자격 증명을 영속 metadata 또는 로그에 남기지 않는다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGrants'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
  /internal/v1/attempts/{attemptId}/commit:
    post:
      operationId: runnerCommit
      summary: 저장소 내용 검증 후 결과 확정
      description: 모든 필수 출력의 고정 version을 읽어 길이·SHA-256을 검증하고 현재 producer/epoch를 재확인한
        트랜잭션으로 Result를 확정한다. 동일 commit은200, 최초201, 다른 내용·취소·과거 producer는409다. Job
        종료만으로 성공하지 않는다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitReceipt'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
        '201':
          description: 검증된 결과 최초 확정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitReceipt'
  /internal/v1/attempts/{attemptId}/fail:
    post:
      operationId: runnerFail
      summary: 실행 실패 또는 취소 보고
      description: 실제 producer만 고정된 사유 코드를 보고한다. 성공한 Result를 실패로 덮어쓰지 않는다. 로그·입력·서명
        URL은 보고 본문에 포함하지 않는다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailureRequest'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureReceipt'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
components:
  securitySchemes:
    podIdentity:
      type: apiKey
      in: header
      name: X-EdgeAI-Pod-Token
      description: audience=edgeai-runner인 Kubernetes projected Pod 토큰. TokenReview·실제 Pod/Job/Node를 검증하며 매 요청 새로 읽는다.
    runnerClaim:
      type: http
      scheme: bearer
      description: Attempt/epoch/producer claim에 묶인 단기 실행 자격. 개발 Basic 계정은 받지 않는다.
  schemas:
    Identity:
      type: object
      additionalProperties: false
      properties:
        epoch: &id006
          type: integer
          minimum: 1
          maximum: 9007199254740991
        podUid: *id001
      required:
      - epoch
      - podUid
    OutputContent:
      type: object
      additionalProperties: false
      properties:
        port: &id002
          type: string
          maxLength: 100
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
        bytes: &id003
          type: integer
          minimum: 0
          maximum: 268435456
        sha256: &id004
          type: string
          pattern: ^[a-f0-9]{64}$
        mediaType: &id005
          type: string
          maxLength: 128
      required:
      - port
      - bytes
      - sha256
      - mediaType
    OutputCommit:
      type: object
      additionalProperties: false
      properties:
        port: *id002
        bytes: *id003
        sha256: *id004
        mediaType: *id005
        versionId:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - port
      - bytes
      - sha256
      - mediaType
      - versionId
    UploadRequest:
      type: object
      additionalProperties: false
      properties:
        epoch: *id006
        podUid: *id001
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OutputContent'
      required:
      - epoch
      - podUid
      - outputs
    CommitRequest:
      type: object
      additionalProperties: false
      properties:
        epoch: *id006
        podUid: *id001
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OutputCommit'
      required:
      - epoch
      - podUid
      - outputs
    FailureRequest:
      type: object
      additionalProperties: false
      properties:
        epoch: *id006
        podUid: *id001
        reason:
          enum:
          - WORKLOAD_FAILED
          - TIMEOUT
          - INPUT_INVALID
          - OUTPUT_INVALID
          - STORAGE_FAILED
          - CANCELLED
          - RUNNER_FAILED
      required:
      - epoch
      - podUid
      - reason
    Assignment:
      type: object
      additionalProperties: false
      properties:
        runId: *id001
        taskId: *id001
        attemptId: *id001
        epoch: *id006
        command:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 4096
        args:
          type: array
          maxItems: 128
          items:
            type: string
            maxLength: 4096
        parameters:
          type: object
          additionalProperties: true
        inputs:
          type: object
          maxProperties: 16
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              url:
                type: string
                format: uri
                description: Runner 전용 임시 자격. 로그·영속 저장·공개 조회 금지.
              bytes: *id003
              sha256: *id004
              mediaType: *id005
            required:
            - url
            - bytes
            - sha256
            - mediaType
        outputs:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              mediaType: *id005
              maxBytes:
                type: integer
                minimum: 1
                maximum: 268435456
            required:
            - mediaType
            - maxBytes
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 86400
      required:
      - runId
      - taskId
      - attemptId
      - epoch
      - command
      - args
      - parameters
      - inputs
      - outputs
      - timeoutSeconds
    UploadGrants:
      type: object
      additionalProperties: false
      properties:
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            properties:
              port: *id002
              url:
                type: string
                format: uri
                description: Runner 전용 임시 자격. 로그·영속 저장·공개 조회 금지.
              headers:
                type: object
                additionalProperties:
                  type: string
                description: Runner 전용 임시 자격. 로그·영속 저장·공개 조회 금지.
              expiresAt:
                type: string
                format: date-time
            required:
            - port
            - url
            - headers
            - expiresAt
      required:
      - outputs
    CommitReceipt:
      type: object
      additionalProperties: false
      properties:
        resultId: *id001
        taskId: *id001
        attemptId: *id001
        state:
          const: SUCCEEDED
      required:
      - resultId
      - taskId
      - attemptId
      - state
    FailureReceipt:
      type: object
      additionalProperties: false
      properties:
        attemptId: *id001
        state:
          type: string
          enum:
          - FAILED
          - CANCELLED
          - CANCELLING
      required:
      - attemptId
      - state

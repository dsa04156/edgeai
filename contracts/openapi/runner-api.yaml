openapi: 3.1.0
info:
  title: EdgeAI Runner internal contract
  version: 0.1.0
  description: M4 내부 프로토콜. 사용자 공개 Attempt 생성 API가 아니다. 현재 구현 연결·검증 상태는 PROGRESS를 따른다.
    모든 요청 JSON은 256KiB 이하이며 토큰·서명 URL은 비공개/비영속 데이터다.
servers:
- url: /
security:
- runnerClaim: []
  podIdentity: []
paths:
  /internal/v1/attempts/{attemptId}/streams/execution:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1execution
  /internal/v1/attempts/{attemptId}/streams/complete:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1complete
  /internal/v1/attempts/{attemptId}/streams/checkpoints/uploads:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1checkpoints~1uploads
  /internal/v1/attempts/{attemptId}/streams/checkpoints/commit:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1checkpoints~1commit
  /internal/v1/attempts/{attemptId}/streams/checkpoints/latest:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1checkpoints~1latest
  /internal/v1/attempts/{attemptId}/streams/checkpoints/handover:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1checkpoints~1handover
  /internal/v1/attempts/{attemptId}/streams/heartbeat:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams~1heartbeat
  /internal/v1/attempts/{attemptId}/streams:
    $ref: ./stream-api.yaml#/paths/~1internal~1v1~1attempts~1{attemptId}~1streams
  /internal/v1/attempts/{attemptId}/claim:
    post:
      operationId: runnerClaim
      summary: 실제 Pod의 producer claim 및 실행 입력 조회
      description: 토큰의 attempt/epoch/claim과 실제 Kubernetes Pod UID·Job 소유 관계를 확인한다.
        같은 producer 재전송은 같은 실행 입력이며 다른 Pod는409다. 입력 URL은 고정 object version만 가리킨다.
        Kubernetes 작업은 성공 응답 전에 최초 시작 허가의 신원·작업 digest·원래 실행/전환 기한을
        버전 관리 S3에 저장하고 다시 읽어 확인한다. 재요청은 최초 기록을 보존한다.
        저장 후 현재 실행 권한을 다시 검사하므로 저장 도중 취소·기한 만료는409다.
        VD 자식은 기존 supervisor 배정 절차를 따른다. 시작 기록은 실제 계산 완료나 결과 성공을 뜻하지 않는다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identity'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          description: 형식·한도·계약 오류 또는 기존 시작 기록 불일치·버전 관리 미설정
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
  /internal/v1/attempts/{attemptId}/uploads:
    post:
      operationId: runnerUploads
      summary: 현재 Attempt에 제한된 출력 업로드 권한 발급
      description: SERVICE 출력 포트·크기·media type을 검증하고 전용 S3 키와 checksum header를 서명한다.
        각 포트별 요청도 허용한다. 자격 증명을 영속 metadata 또는 로그에 남기지 않는다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGrants'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
  /internal/v1/attempts/{attemptId}/commit:
    post:
      operationId: runnerCommit
      summary: 저장소 내용 검증 후 결과 확정
      description: 모든 필수 출력의 고정 version을 읽어 길이·SHA-256을 검증하고 현재 producer/epoch를 재확인한
        트랜잭션으로 Result를 확정한다. 동일 commit은200, 최초201, 다른 내용·취소·과거 producer는409다. Job
        종료만으로 성공하지 않는다. Kubernetes 작업은 DB 확정 뒤 고정 출력 버전과 Result 신원을 S3 기록으로
        보존한 후 성공 응답한다. 기록 저장 장애의503은 DB 결과가 이미 확정된 경우에도 반환될 수 있다.
        동일 요청은 원래 결과·기록을 재사용하며, 영속 발행 큐는 API 재시작·Pod 종료 뒤에도 재처리한다.
        VD 자식 작업은 기존 supervisor 계약을 따른다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitReceipt'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
        '201':
          description: 검증된 결과 최초 확정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitReceipt'
  /internal/v1/attempts/{attemptId}/fail:
    post:
      operationId: runnerFail
      summary: 실행 실패 또는 취소 보고
      description: 실제 producer만 고정된 사유 코드를 보고한다. 성공한 Result를 실패로 덮어쓰지 않는다. 로그·입력·서명
        URL은 보고 본문에 포함하지 않는다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailureRequest'
      responses:
        '200':
          description: 멱등 응답 또는 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureReceipt'
        '400':
          description: 형식·한도·출력 계약 오류
        '401':
          description: Runner 토큰 누락·검증 실패
        '409':
          description: 과거 claim·producer 불일치·취소·내용 충돌
        '503':
          description: DB·Kubernetes·Object Storage 일시 장애
  /internal/v1/attempts/{attemptId}/telemetry:
    post:
      operationId: runnerTelemetry
      summary: 현재 producer의 실제 자원·서비스 지연 측정 보고
      description: >-
        cgroup v2 사용량과 선택적인 서비스 지연을 보고합니다. 지원하지 않는 지표는 null입니다.
        sequence/observedAt은 증가해야 하며 동일 sequence/동일 내용만 재전송할 수 있습니다.
        관측은 서버 시각 기준 과거60초·미래5초 이내입니다. 최신64개만 보관합니다.
        Run 잠금 안에서 현재 producer를 확인하며 취소·전환·완료 후 보고를 거절합니다.
        STREAM 계산부터 최종 파일 처리까지 같은 Attempt의 표본 sequence를 이어갑니다.
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelemetryRequest'}
      responses:
        '200':
          description: 저장된 측정 receipt. 재전송도 동일 receipt입니다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [attemptId, sequence, receivedAt]
                properties:
                  attemptId: *id001
                  sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
                  receivedAt: {type: string, format: date-time}
        '400': {description: 필드·단위·값 범위 오류}
        '401': {description: Runner 또는 Pod 인증 실패}
        '409': {description: producer 차단·내용 충돌·순서 역전·측정 만료}
        '503': {description: DB 또는 Kubernetes 일시 장애}
components:
  securitySchemes:
    podIdentity:
      type: apiKey
      in: header
      name: X-EdgeAI-Pod-Token
      description: audience=edgeai-runner인 Kubernetes projected Pod 토큰. TokenReview·실제 Pod/Job/Node를 검증하며 매 요청 새로 읽는다.
    runnerClaim:
      type: http
      scheme: bearer
      description: Attempt/epoch/producer claim에 묶인 단기 실행 자격. 개발 Basic 계정은 받지 않는다.
  schemas:
    Identity:
      type: object
      additionalProperties: false
      properties:
        epoch: &id006
          type: integer
          minimum: 1
          maximum: 9007199254740991
        podUid: *id001
      required:
      - epoch
      - podUid
    OutputContent:
      type: object
      additionalProperties: false
      properties:
        port: &id002
          type: string
          maxLength: 100
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
        bytes: &id003
          type: integer
          minimum: 0
          maximum: 268435456
        sha256: &id004
          type: string
          pattern: ^[a-f0-9]{64}$
        mediaType: &id005
          type: string
          maxLength: 128
      required:
      - port
      - bytes
      - sha256
      - mediaType
    OutputCommit:
      type: object
      additionalProperties: false
      properties:
        port: *id002
        bytes: *id003
        sha256: *id004
        mediaType: *id005
        versionId:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - port
      - bytes
      - sha256
      - mediaType
      - versionId
    UploadRequest:
      type: object
      additionalProperties: false
      properties:
        epoch: *id006
        podUid: *id001
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OutputContent'
      required:
      - epoch
      - podUid
      - outputs
    CommitRequest:
      type: object
      additionalProperties: false
      properties:
        epoch: *id006
        podUid: *id001
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OutputCommit'
      required:
      - epoch
      - podUid
      - outputs
    FailureRequest:
      type: object
      additionalProperties: false
      properties:
        epoch: *id006
        podUid: *id001
        reason:
          enum:
          - WORKLOAD_FAILED
          - TIMEOUT
          - INPUT_INVALID
          - OUTPUT_INVALID
          - STORAGE_FAILED
          - CANCELLED
          - RUNNER_FAILED
      required:
      - epoch
      - podUid
      - reason
    Assignment:
      type: object
      additionalProperties: false
      properties:
        stream:
          $ref: ../profiles/service-execution.schema.json#/properties/stream
          description: M7 Runner용 지속 계산 설정. 서버 route 배정·완료 장벽 연결 전에는 공개 실행에서 발급하지 않는다.
        telemetry:
          type: object
          additionalProperties: false
          required: [intervalSeconds]
          properties:
            intervalSeconds: {type: integer, minimum: 1, maximum: 60, description: 실행 중 측정 주기. 이 설정이 없으면 수집하지 않습니다.}
        runId: *id001
        taskId: *id001
        attemptId: *id001
        epoch: *id006
        command:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 4096
        args:
          type: array
          maxItems: 128
          items:
            type: string
            maxLength: 4096
        parameters:
          type: object
          additionalProperties: true
        inputs:
          type: object
          maxProperties: 16
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              url:
                type: string
                format: uri
                description: Runner 전용 임시 자격. 로그·영속 저장·공개 조회 금지.
              bytes: *id003
              sha256: *id004
              mediaType: *id005
            required:
            - url
            - bytes
            - sha256
            - mediaType
        outputs:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              mediaType: *id005
              maxBytes:
                type: integer
                minimum: 1
                maximum: 268435456
            required:
            - mediaType
            - maxBytes
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 86400
      required:
      - runId
      - taskId
      - attemptId
      - epoch
      - command
      - args
      - parameters
      - inputs
      - outputs
      - timeoutSeconds
    UploadGrants:
      type: object
      additionalProperties: false
      properties:
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            properties:
              port: *id002
              url:
                type: string
                format: uri
                description: Runner 전용 임시 자격. 로그·영속 저장·공개 조회 금지.
              headers:
                type: object
                additionalProperties:
                  type: string
                description: Runner 전용 임시 자격. 로그·영속 저장·공개 조회 금지.
              expiresAt:
                type: string
                format: date-time
            required:
            - port
            - url
            - headers
            - expiresAt
      required:
      - outputs
    CommitReceipt:
      type: object
      additionalProperties: false
      properties:
        resultId: *id001
        taskId: *id001
        attemptId: *id001
        state:
          const: SUCCEEDED
      required:
      - resultId
      - taskId
      - attemptId
      - state
    FailureReceipt:
      type: object
      additionalProperties: false
      properties:
        attemptId: *id001
        state:
          type: string
          enum:
          - FAILED
          - CANCELLED
          - CANCELLING
      required:
      - attemptId
      - state
    TelemetryRequest:
      type: object
      additionalProperties: false
      required: [epoch, podUid, sequence, observedAt, intervalMillis, cpuUsageMicros, cpuLimitMillicores, memoryBytes, memoryLimitBytes, latencyMicros, latencyObservedAt]
      properties:
        epoch: *id006
        podUid: *id001
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        observedAt: {type: string, format: date-time}
        intervalMillis: {type: integer, minimum: 200, maximum: 60000}
        cpuUsageMicros: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991, description: intervalMillis 동안 해당 cgroup의 CPU 사용 시간 증가량}
        cpuLimitMillicores: {type: [integer, 'null'], minimum: 1, maximum: 1000000000, description: cgroup quota. 무제한/미지원은 null}
        memoryBytes: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991}
        memoryLimitBytes: {type: [integer, 'null'], minimum: 1, maximum: 9007199254740991}
        latencyMicros: {type: [integer, 'null'], minimum: 0, maximum: 600000000, description: 서비스가 보고한 개별 지연 측정. 실행 시간이나 percentile이 아닙니다.}
        latencyObservedAt: {type: [string, 'null'], format: date-time, description: latencyMicros와 함께 제공. 관측보다 과거30초·미래5초 이내}

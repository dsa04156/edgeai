openapi: 3.1.0
info:
  title: EdgeAI authenticated stream bindings
  version: 0.1.0
  description: M7 내부 배정·생존 확인·체크포인트·공동 완료 계약. MQTT 비밀번호/세션 토큰·서명 URL은 로그·일반 metadata에 저장하지 않는다. SDK는
    monotonic 기한을 적용한다. 공개 STREAM 실행은 별도 opt-in이며 기본 비활성이다.
servers:
- url: /
paths:
  /internal/v1/attempts/{attemptId}/streams/execution:
    post:
      operationId: assignStreamExecution
      summary: 현재 Runner의 스트림 실행 포트와 복원 방식 조회
      description: Run의 전체 입출력 경로가 준비되면 경로 구성을 고정한다. 현재 작업의 모든 세대와 실행 주체가 유효할 때 READY와 SERVICE 포트별 generationId를
        반환하고, 아직 준비 중이면 WAITING을 반환한다. 이미 공동 완료 허가가 있으면 경로 회수 후에도 FINALIZE와 확정 checkpointId·논리 route 포트를 반환한다. 이 경우 MQTT·계산을 다시 시작하지 않고 finalized 체크포인트 API로 최종 상태만 복구한다. READY의 recovery는 NEW·RESTORE·HANDOVER이며 실제 배정 자격은 streams API에서 조회한다. 이 요청은 lease를
        연장하지 않는다. FINALIZE 응답 전에는 연결 그룹 전체의 원래 완료 허가와 고정 체크포인트 참조를 버전 관리 S3에 보존한다. 저장 실패는503이며 동일 요청을 재전송한다. 이미 보존된 내용이 원래 허가와 다르면400/ARTIFACT_INVALID다.
        명시적인 최종 처리 재시도는 이전 실행의 물리 종료와 경로 회수 후에만 배정되며 checkpointActor로 원본 체크포인트 실행 주체를 표시한다. 공개 STREAM Run 생성은 별도 opt-in이며 기본 비활성이다. 공개 retry 및 자동 offload의 그룹 복구 조건은 관리 API의 Run 정책을 따른다.
      security:
      - runnerClaim: []
        podIdentity: []
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamExecutionRequest'
      responses:
        '200':
          description: '배정 또는 공동 완료 상태. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamExecutionResponse'
        '400':
          description: 본문 필드·형식·순번 오류
        '401':
          description: 현재 Attempt/Pod 또는 Device 세션 인증 실패
        '409':
          description: 현재 주체·세대·기한·체크포인트·종료 순번 불일치 또는 취소
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 내부 실행 기능 비활성
        '503':
          description: DB·Kubernetes 인증 또는 완료 허가 S3 보존 일시 장애. 원래 요청으로 재시도
  /internal/v1/attempts/{attemptId}/streams/complete:
    post:
      operationId: completeRunnerStream
      summary: Runner의 최종 체크포인트를 보고하고 공동 완료 허가 조회
      description: 모든 입력·출력의 END와 마지막 처리 확인이 확정된 최신 체크포인트를 보고한다. 연결된 모든 Task와 Device가 종료를 확인하고 경로별 순번이 일치하면 같은 트랜잭션에서
        FINALIZE를 기록한다. WAITING 동안 heartbeat와 세션을 유지한다. FINALIZE 뒤에만 최종 파일 결과를 확정할 수 있다. 같은 checkpointId 재요청은 멱등이고,
        다른 작업이 이미 결과를 확정해 경로가 닫혀도 현재 실행 주체는 허가를 다시 읽을 수 있다. 취소·교체·기한 만료는 성공으로 바뀌지 않는다.
        FINALIZE 성공 응답 전에는 그룹 전체의 원래 허가를 S3에 보존한다. 저장 장애로503을 받더라도 DB 허가는 이미 확정될 수 있으므로 같은 요청으로 재조회하며 계산을 다시 시작하지 않는다. 보존 기록 충돌은400/ARTIFACT_INVALID다.
      security:
      - runnerClaim: []
        podIdentity: []
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCompletionRequest'
      responses:
        '200':
          description: '배정 또는 공동 완료 상태. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamCompletionResponse'
        '400':
          description: 본문 필드·형식·순번 오류
        '401':
          description: 현재 Attempt/Pod 또는 Device 세션 인증 실패
        '409':
          description: 현재 주체·세대·기한·체크포인트·종료 순번 불일치 또는 취소
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 내부 실행 기능 비활성
        '503':
          description: DB·Kubernetes 인증 또는 완료 허가 S3 보존 일시 장애. 원래 요청으로 재시도
  /internal/v1/devices/{deviceId}/sessions/{sessionId}/streams/complete:
    post:
      operationId: completeDeviceStream
      summary: Device의 마지막 처리 확인을 보고하고 공동 완료 허가 조회
      description: Device가 END에 대한 마지막 처리 확인을 받은 뒤 해당 generationId와 순번을 보고한다. 서버는 소비 작업의 확정 체크포인트와 순번을 대조한다. 연결된
        모든 참여자가 준비될 때까지 WAITING이며 heartbeat를 유지해야 한다. FINALIZE는 해당 세대·순번에 영속 저장된다. 동일 현재 Device 세션은 경로가 닫히거나 Run이
        성공한 뒤에도 같은 허가를 재조회할 수 있다. 세션 교체·Run 취소 또는 다른 순번은 거절한다.
        FINALIZE 응답은 연결 그룹의 원래 완료 허가가 S3에 보존된 뒤 반환한다. DB 허가 확정 뒤에도 저장 장애로503이 반환될 수 있으며 같은 generationId·순번으로 재요청한다. 기록 충돌은400/ARTIFACT_INVALID다.
      security:
      - deviceSession: []
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCompletionRequest'
      responses:
        '200':
          description: '배정 또는 공동 완료 상태. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCompletionResponse'
        '400':
          description: 본문 필드·형식·순번 오류
        '401':
          description: 현재 Attempt/Pod 또는 Device 세션 인증 실패
        '409':
          description: 현재 주체·세대·기한·체크포인트·종료 순번 불일치 또는 취소
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 내부 실행 기능 비활성
        '503':
          description: DB·Kubernetes 인증 또는 완료 허가 S3 보존 일시 장애. 원래 요청으로 재시도
  /internal/v1/devices/{deviceId}/sessions/{sessionId}/streams:
    post:
      operationId: bindDeviceStream
      summary: 현재 Device 주체의 스트림 배정 조회
      description: 현재 주체·ACTIVE 세대·lease와 고정 broker 설정을 확인한 뒤 정확한 topic/producer binding
        및 본인 MQTT 자격을 no-store로 반환한다. 세대를 생성하거나 lease를 연장하지 않는다. Runner는 실제 Pod 및
        runtime claim도 재검사한다. 받은 serverTime/leaseUntil과 요청 경과 시간을 기준으로 기한 내에만 사용해야
        한다. 공개 STREAM 실행 활성화와는 별개다.
      security:
      - deviceSession: []
      parameters:
      - name: deviceId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBindingRequest'
      responses:
        '200':
          description: '현재 lease까지 유효한 비공개 배정. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          description: JSON 형식/필드/epoch 오류
        '401':
          description: 현재 세션 토큰 또는 Runner/Pod 인증 실패
        '403':
          description: 스트림 인증 경로 비활성 또는 권한 거절
        '404':
          description: 세대가 없음
        '409':
          description: 이전 주체·다른 route·미활성/회수된 세대·만료·취소·설정 불일치
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 배정 비활성
        '503':
          description: DB/Kubernetes/자격 설정 일시 장애
  /internal/v1/attempts/{attemptId}/streams:
    post:
      operationId: bindRunnerStream
      summary: 현재 Runner 주체의 스트림 배정 조회
      description: 현재 주체·ACTIVE 세대·lease와 고정 broker 설정을 확인한 뒤 정확한 topic/producer binding
        및 본인 MQTT 자격을 no-store로 반환한다. 세대를 생성하거나 lease를 연장하지 않는다. Runner는 실제 Pod 및
        runtime claim도 재검사한다. 받은 serverTime/leaseUntil과 요청 경과 시간을 기준으로 기한 내에만 사용해야
        한다. 공개 STREAM 실행 활성화와는 별개다.
      security:
      - runnerClaim: []
        podIdentity: []
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerBindingRequest'
      responses:
        '200':
          description: '현재 lease까지 유효한 비공개 배정. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        '400':
          description: JSON 형식/필드/epoch 오류
        '401':
          description: 현재 세션 토큰 또는 Runner/Pod 인증 실패
        '403':
          description: 스트림 인증 경로 비활성 또는 권한 거절
        '404':
          description: 세대가 없음
        '409':
          description: 이전 주체·다른 route·미활성/회수된 세대·만료·취소·설정 불일치
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 배정 비활성
        '503':
          description: DB/Kubernetes/자격 설정 일시 장애
  /internal/v1/devices/{deviceId}/sessions/{sessionId}/streams/heartbeat:
    post:
      operationId: heartbeatDeviceStream
      summary: 현재 Device 세션의 스트림 생존 확인 및 기한 갱신
      description: 현재 인증된 주체의 다음 sequence만 생존 시각으로 기록한다. sequence 0은 현재 순번·배정을 읽으며,
        같은 마지막 순번의 재전송은 생존 시각을 갱신하지 않는다. 건너뛰거나 오래된 순번은 409다. 기한은 양쪽 마지막 관측 중 더 오래된
        시각+최초 고정 window(5–120초)까지만 연장한다. 한쪽 요청으로 다른 쪽의 부재를 숨길 수 없고 만료·취소·교체 뒤에는 갱신할
        수 없다. Runner는 실제 Pod/runtime 및 VD lease·drain도 재검사한다. 응답 배정의 기한은 요청 경과 시간을
        차감해 사용하고 이미 만료된 연결을 되살리지 않는다.
      security:
      - deviceSession: []
      parameters:
      - name: deviceId
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeatRequest'
      responses:
        '200':
          description: '현재 lease까지 유효한 비공개 배정. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heartbeat'
        '400':
          description: JSON 형식/필드/epoch 오류
        '401':
          description: 현재 세션 토큰 또는 Runner/Pod 인증 실패
        '403':
          description: 스트림 인증 경로 비활성 또는 권한 거절
        '404':
          description: 세대가 없음
        '409':
          description: 이전 주체·다른 route·미활성/회수된 세대·만료·취소·설정 불일치·순번 불일치
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 배정 비활성
        '503':
          description: DB/Kubernetes/자격 설정 일시 장애
  /internal/v1/attempts/{attemptId}/streams/heartbeat:
    post:
      operationId: heartbeatRunnerStream
      summary: 현재 Runner/Pod의 스트림 생존 확인 및 기한 갱신
      description: 현재 인증된 주체의 다음 sequence만 생존 시각으로 기록한다. sequence 0은 현재 순번·배정을 읽으며,
        같은 마지막 순번의 재전송은 생존 시각을 갱신하지 않는다. 건너뛰거나 오래된 순번은 409다. 기한은 양쪽 마지막 관측 중 더 오래된
        시각+최초 고정 window(5–120초)까지만 연장한다. 한쪽 요청으로 다른 쪽의 부재를 숨길 수 없고 만료·취소·교체 뒤에는 갱신할
        수 없다. Runner는 실제 Pod/runtime 및 VD lease·drain도 재검사한다. 응답 배정의 기한은 요청 경과 시간을
        차감해 사용하고 이미 만료된 연결을 되살리지 않는다.
      security:
      - runnerClaim: []
        podIdentity: []
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerHeartbeatRequest'
      responses:
        '200':
          description: '현재 lease까지 유효한 비공개 배정. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heartbeat'
        '400':
          description: JSON 형식/필드/epoch 오류
        '401':
          description: 현재 세션 토큰 또는 Runner/Pod 인증 실패
        '403':
          description: 스트림 인증 경로 비활성 또는 권한 거절
        '404':
          description: 세대가 없음
        '409':
          description: 이전 주체·다른 route·미활성/회수된 세대·만료·취소·설정 불일치·순번 불일치
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 배정 비활성
        '503':
          description: DB/Kubernetes/자격 설정 일시 장애
  /internal/v1/attempts/{attemptId}/streams/checkpoints/uploads:
    post:
      operationId: uploadStreamCheckpoint
      summary: 현재 Runner 체크포인트의 S3 업로드 권한 요청
      description: 현재 Runner/Pod·전체 입출력 경로의 ACTIVE 세대·lease와 이전 확정본을 확인한다.
        checkpoint에는 SDK가 만든 정규 JSON의 serial·SHA-256·크기·실행 설정 해시를 보낸다.
        응답의 upload.url에 upload.headers를 그대로 사용해 파일을 PUT하고 x-amz-version-id를 보관한다.
        PUT 성공만으로 처리 확인이나 출력 전송을 진행하면 안 된다. commit 확정 응답이 필요하다.
        이미 같은 최신 체크포인트가 확정되었다면 upload 대신 checkpoint를 반환한다.
        서명 URL은 비공개이며 이 요청은 lease를 연장하지 않는다.
      security: [{runnerClaim: [], podIdentity: []}]
      parameters:
      - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckpointUploadRequest'}
      responses:
        '200':
          description: '업로드 권한 또는 이미 확정된 최신 receipt. Cache-Control: no-store.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointUploadResponse'}
        '400': {description: JSON 필드·중복 generation·해시·크기·정수 한도 오류}
        '401': {description: Runner claim 또는 Pod 신원 인증 실패}
        '403': {description: 내부 Runner 경로 비활성 또는 권한 거절}
        '404': {description: 요청한 스트림 세대가 없음}
        '409': {description: 주체·세대·lease가 유효하지 않거나 이전 확정본 불일치. 새 Attempt/세대 전환은 STREAM_CHECKPOINT_HANDOVER_REQUIRED}
        '413': {description: 요청 JSON 256KiB 초과}
        '503': {description: DB·Kubernetes·S3 일시 장애}
  /internal/v1/attempts/{attemptId}/streams/checkpoints/commit:
    post:
      operationId: commitStreamCheckpoint
      summary: S3 파일을 검증하고 체크포인트를 원자적으로 확정
      description: uploads에 보낸 checkpoint와 실제 PUT 응답의 versionId를 보낸다.
        서버는 고정 S3 version의 실제 바이트·SHA-256·미디어 유형과 SDK 문서의 전체 경로·프레임·상태를 검증한다.
        저장소 읽기 동안 DB 잠금을 유지하지 않으며 확정 직전에 현재 주체·전체 세대·취소·기한을 재검사한다.
        입력·출력 위치와 계산 revision은 후퇴할 수 없다. 계산 revision이 같으면 상태를 바꿀 수 없다.
        최초 검증된 version을 불변 DB 이력으로 저장한다. 같은 최신 요청의 재전송은 같은 receipt를 반환하며
        다른 versionId로 교체하지 않는다. 더 최신 확정본이 생긴 뒤 이전 요청을 재전송하면 409다.
        SDK는 인증된 응답의 serial·sha256을 후보와 대조한 뒤에만 처리 확인과 출력 전송을 허용한다.
        새 Attempt/세대 인계와 공개 STREAM 실행은 아직 지원하지 않는다.
      security: [{runnerClaim: [], podIdentity: []}]
      parameters:
      - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckpointCommitRequest'}
      responses:
        '201':
          description: '고정 S3 version과 검증된 metadata를 새로 확정. Cache-Control: no-store.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointReceiptResponse'}
        '200':
          description: '동일한 최신 요청의 멱등 재전송. Cache-Control: no-store.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointReceiptResponse'}
        '400': {description: 형식·문서·실제 파일 해시/크기/미디어 유형 불일치. INVALID_RUNNER_REQUEST 또는 ARTIFACT_INVALID}
        '401': {description: Runner claim 또는 Pod 신원 인증 실패}
        '403': {description: 내부 Runner 경로 비활성 또는 권한 거절}
        '404': {description: 요청한 스트림 세대가 없음}
        '409': {description: 취소·만료·주체 교체·불완전한 세대 집합·이전 확정본 충돌·커서/상태 후퇴·미지원 인계}
        '413': {description: 요청 JSON 256KiB 초과. 체크포인트 파일은 최대 72MiB이며 S3에 직접 업로드}
        '429': {description: STREAM_CHECKPOINT_BUSY — 동시 검증 한도 초과. 같은 후보로 재시도}
        '503': {description: DB·Kubernetes·S3 일시 장애. 결과 불명확 시 같은 요청을 재전송}
  /internal/v1/attempts/{attemptId}/streams/checkpoints/latest:
    post:
      operationId: latestStreamCheckpoint
      summary: 현재 Task의 최신 확정 체크포인트와 다운로드 권한 조회
      description: 현재 Runner/Pod와 전체 경로의 유효한 generationIds를 확인하고 Task의 최신 불변 receipt 및
        고정 S3 version 다운로드 권한을 반환한다. 확정본이 없으면 checkpoint는 null이며 download는 없다.
        파일을 받은 뒤 크기·SHA-256·실행 설정·정확한 binding을 확인해야 한다. 조회만으로 새 Attempt나
        세대에 복원 권한을 부여하지 않는다. 현재 배정과 확정본의 Attempt·세대가 다르면409이며 명시적 handover가 필요하다.
        GET 캐시·URL에 신원 정보를 남기지 않도록 POST 본문을 사용하며 lease는 연장하지 않는다.
      security: [{runnerClaim: [], podIdentity: []}]
      parameters:
      - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckpointLatestRequest'}
      responses:
        '200':
          description: '최신 receipt 및 고정 version 다운로드 권한 또는 미확정 null. Cache-Control: no-store.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointLatestResponse'}
        '400': {description: 필드·정수·세대 집합 형식 오류}
        '401': {description: Runner claim 또는 Pod 신원 인증 실패}
        '403': {description: 내부 Runner 경로 비활성 또는 권한 거절}
        '404': {description: 요청한 스트림 세대가 없음}
        '409': {description: 취소·만료·다른 주체 또는 전체 경로와 세대 집합 불일치}
        '413': {description: 요청 JSON 256KiB 초과}
        '503': {description: DB·Kubernetes·S3 일시 장애}
  /internal/v1/attempts/{attemptId}/streams/checkpoints/handover:
    post:
      operationId: handoverStreamCheckpoint
      summary: 이전 체크포인트를 현재 Attempt와 경로 세대로 인계
      description: 현재 Runner/Pod와 전체 활성 경로를 인증하고 이전 세대의 broker 권한 회수를 확인한다.
        Attempt가 바뀌면 이전 Runtime의 실제 종료 확인도 필요하다. 서버가 최신 고정 S3 파일의 내용을 검증하고
        계산 상태·입력 순번·미확인 출력·END를 유지한 채 경로 식별자와 snapshot serial만 변경한다.
        새 고정 S3 version을 검증하고 현재 권한을 다시 확인한 뒤 불변 체크포인트를 확정한다.
        이미 현재 배정으로 확정되었으면 같은 최신 receipt를 반환한다. 실행 digest 변경·Device 세션 교체는 거절한다.
        이 API는 Run을 시작하거나 경로를 전환하는 명령이 아니며 제어 서버가 준비한 현재 경로의 상태 인계에 사용한다.
      security: [{runnerClaim: [], podIdentity: []}]
      parameters:
      - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckpointHandoverRequest'}
      responses:
        '200':
          description: '현재 배정으로 확정된 receipt와 고정 version 다운로드 권한. 확정본 없음은409이며 null을 반환하지 않는다. Cache-Control: no-store.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointDownloadResponse'}
        '400': {description: 잘못된 입력 또는 손상된 원본 체크포인트}
        '401': {description: Runner claim 또는 Pod 신원 인증 실패}
        '403': {description: 내부 Runner 경로 비활성 또는 권한 거절}
        '404': {description: 요청한 스트림 세대가 없음}
        '409': {description: 확정본 없음·이전 종료/권한 회수 미완료·취소/만료·실행 규격/경로/Device 세션 변경}
        '413': {description: 요청 JSON 256KiB 초과}
        '429': {description: 체크포인트 검증 동시 처리 한도 초과}
        '503': {description: DB·Kubernetes·S3 일시 장애}
  /internal/v1/attempts/{attemptId}/streams/checkpoints/finalized:
    post:
      operationId: finalizedStreamCheckpoint
      summary: 완료 허가된 현재 Runner의 최종 상태 다운로드 권한 조회
      description: 현재 Attempt·epoch·Pod와 영속 공동 완료 허가를 확인하고 그룹 허가의 독립 S3 보존을 검증한 뒤 정확한 checkpointId의 고정 S3 version을 반환한다. 저장 장애는503, 보존 기록 충돌은400/ARTIFACT_INVALID이며 같은 요청으로 재조회한다. 경로 회수 뒤에도 조회할 수 있지만 MQTT
        배정이나 lease를 갱신하지 않는다. Runner는 크기·SHA-256·실행 설정·종료 커서를 검증하고 다운로드 뒤 이 API를 다시 호출하여 취소·만료를 확인한 후 최종 파일만 생성한다. 새로운
        Attempt는 서버가 기록한 최종 처리 재시도 이력이 있을 때만 원래 허가된 체크포인트를 읽는다. 응답의 checkpoint.attemptId와 epoch는 원본 실행 주체이며 현재 요청의 인증 정보는 새 실행 주체다. 허가 전·취소·만료·다른 체크포인트는 거절한다.
      security:
      - runnerClaim: []
        podIdentity: []
      parameters:
      - name: attemptId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCompletionRequest'
      responses:
        '200':
          description: '정확한 완료 checkpoint receipt와 고정 version 다운로드 권한. null은 반환하지 않는다. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointDownloadResponse'
        '400':
          description: 필드·checkpointId 형식 오류
        '401':
          description: Runner claim 또는 Pod 신원 인증 실패
        '403':
          description: 내부 Runner 경로 비활성 또는 권한 거절
        '404':
          description: 요청한 스트림 세대가 없음
        '409':
          description: 공동 완료 허가 없음·다른 체크포인트·취소·만료·실행 주체 변경
        '413':
          description: 요청 JSON 256KiB 초과
        '503':
          description: DB·Kubernetes·S3 일시 장애
  /internal/v1/devices/{deviceId}/sessions/{sessionId}/streams/routes:
    post:
      operationId: discoverDeviceStreamRoutes
      summary: 현재 Device 세션에 고정된 Run 경로·세대 조회
      description: 현재 장치 세션 토큰으로 해당 Run에 고정된 본인 장치의 경로만 UUID 문자열 오름차순으로 조회한다. 세대 준비 전에는 generation이 null이며 준비·활성·닫힌
        최신 세대의 메타데이터를 읽을 수 있다. MQTT 자격 증명이나 lease 사용 권한을 발급하지 않고 세대 생성·기한 갱신·journal 인계도 수행하지 않는다. SDK는 실제 전송 전에 streams
        배정 API에서 현재 자격을 다시 확인해야 한다. Run을 만든 관리 클라이언트가 runId를 전달하며 장치가 전체 Run을 열람하는 API가 아니다. Run이 성공·실패·취소된 뒤에도 동일
        현재 세션은 읽을 수 있다. 세션 교체 뒤 이전 Run의 고정 세션은 승계하지 않는다. 각 페이지는 읽기 시점의 일관된 스냅샷이며 페이지 간 세대 상태는 달라질 수 있다.
      security:
      - deviceSession: []
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRoutesRequest'
      responses:
        '200':
          description: '본인 경로의 읽기 전용 메타데이터. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRoutesResponse'
        '400':
          description: 본문 필드·UUID·epoch·페이지 범위 오류
        '401':
          description: 현재 장치 세션 토큰 인증 실패. 관리 계정·Runner 토큰은 허용하지 않음
        '404':
          description: 해당 장치에 고정된 Run 경로가 없음. 존재하지 않는 Run과 다른 장치의 Run을 구분하지 않음
        '409':
          description: 요청 epoch 또는 Run에 고정된 장치 세션과 현재 세션이 다름
        '413':
          description: 본문 크기 제한 초과
        '501':
          description: 스트림 내부 기능 비활성
        '503':
          description: DB 일시 장애
components:
  securitySchemes:
    deviceSession:
      type: http
      scheme: bearer
      description: 관리자가 현재 Device 세션에 발급한 stream-token.
    runnerClaim:
      type: http
      scheme: bearer
    podIdentity:
      type: apiKey
      in: header
      name: X-EdgeAI-Pod-Token
  schemas:
    StreamExecutionRequest:
      type: object
      additionalProperties: false
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        podUid:
          type: string
          format: uuid
      required:
      - epoch
      - podUid
    StreamExecutionResponse:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          state:
            const: WAITING
        required:
        - state
      - type: object
        additionalProperties: false
        properties:
          state:
            const: READY
          runId:
            type: string
            format: uuid
          taskId:
            type: string
            format: uuid
          attemptId:
            type: string
            format: uuid
          epoch:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          inputs:
            type: object
            minProperties: 1
            maxProperties: 16
            propertyNames:
              maxLength: 100
              pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
            additionalProperties:
              type: string
              format: uuid
          outputs:
            type: object
            maxProperties: 16
            propertyNames:
              maxLength: 100
              pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
            additionalProperties:
              type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items:
                type: string
                format: uuid
          recovery:
            enum:
            - NEW
            - RESTORE
            - HANDOVER
        required:
        - state
        - runId
        - taskId
        - attemptId
        - epoch
        - inputs
        - outputs
        - recovery
      - type: object
        additionalProperties: false
        properties:
          state:
            const: FINALIZE
          runId:
            type: string
            format: uuid
          taskId:
            type: string
            format: uuid
          attemptId:
            type: string
            format: uuid
          epoch:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          checkpointId:
            type: string
            format: uuid
          inputRoutes:
            description: Immutable SERVICE input port to logical route ID; not an MQTT generation assignment.
            type: object
            minProperties: 1
            maxProperties: 16
            propertyNames:
              maxLength: 100
              pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
            additionalProperties:
              type: string
              format: uuid
          checkpointActor:
            type: object
            additionalProperties: false
            description: Only present for an explicitly authorized finalizer retry. Identifies the original sealed checkpoint, never MQTT or write authority.
            properties:
              attemptId:
                type: string
                format: uuid
              epoch:
                type: integer
                minimum: 1
                maximum: 9007199254740991
            required: [attemptId, epoch]
          outputRoutes:
            type: object
            maxProperties: 16
            propertyNames:
              maxLength: 100
              pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
            additionalProperties:
              type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items:
                type: string
                format: uuid
            description: Immutable SERVICE output port to ordered logical route IDs; no data-plane authority.
          generationIds:
            type: array
            minItems: 1
            maxItems: 32
            uniqueItems: true
            items:
              type: string
              format: uuid
        required:
        - state
        - runId
        - taskId
        - attemptId
        - epoch
        - checkpointId
        - inputRoutes
        - outputRoutes
        - generationIds
    StreamCompletionRequest:
      type: object
      additionalProperties: false
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        podUid:
          type: string
          format: uuid
        checkpointId:
          type: string
          format: uuid
      required:
      - epoch
      - podUid
      - checkpointId
    StreamCompletionResponse:
      type: object
      additionalProperties: false
      properties:
        state:
          enum:
          - WAITING
          - FINALIZE
        checkpointId:
          type: string
          format: uuid
      required:
      - state
      - checkpointId
    DeviceCompletionRequest:
      type: object
      additionalProperties: false
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        generationId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - epoch
      - generationId
      - sequence
    DeviceCompletionResponse:
      type: object
      additionalProperties: false
      properties:
        state:
          enum:
          - WAITING
          - FINALIZE
        generationId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - state
      - generationId
      - sequence
    CheckpointCounter:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    CheckpointHash:
      type: string
      pattern: '^[a-f0-9]{64}$'
    CheckpointGenerations:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items: {type: string, format: uuid}
      description: 해당 Task 전체 입출력 경로의 현재 ACTIVE generation ID. 일부만 전달할 수 없음
    CheckpointCandidate:
      type: object
      additionalProperties: false
      required: [previousCheckpointId, serial, sha256, bytes, executionSha256, generationIds]
      properties:
        previousCheckpointId:
          type: [string, 'null']
          format: uuid
          description: 이전 서버 확정 receipt ID. 최초 요청만 null
        serial: {$ref: '#/components/schemas/CheckpointCounter'}
        sha256: {$ref: '#/components/schemas/CheckpointHash'}
        bytes: {type: integer, minimum: 1, maximum: 75497472}
        executionSha256: {$ref: '#/components/schemas/CheckpointHash'}
        generationIds: {$ref: '#/components/schemas/CheckpointGenerations'}
    CheckpointUploadRequest:
      type: object
      additionalProperties: false
      required: [epoch, podUid, checkpoint]
      properties:
        epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        podUid: {type: string, format: uuid}
        checkpoint: {$ref: '#/components/schemas/CheckpointCandidate'}
    CheckpointCommitRequest:
      type: object
      additionalProperties: false
      required: [epoch, podUid, checkpoint, versionId]
      properties:
        epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        podUid: {type: string, format: uuid}
        checkpoint: {$ref: '#/components/schemas/CheckpointCandidate'}
        versionId: {type: string, minLength: 1, maxLength: 1024}
    CheckpointLatestRequest:
      type: object
      additionalProperties: false
      required: [epoch, podUid, generationIds]
      properties:
        epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        podUid: {type: string, format: uuid}
        generationIds: {$ref: '#/components/schemas/CheckpointGenerations'}
    CheckpointHandoverRequest:
      type: object
      additionalProperties: false
      required: [epoch, podUid, generationIds, executionSha256]
      properties:
        epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        podUid: {type: string, format: uuid}
        generationIds: {$ref: '#/components/schemas/CheckpointGenerations'}
        executionSha256: {$ref: '#/components/schemas/CheckpointHash'}
    CheckpointManifestBinding:
      type: object
      additionalProperties: false
      required: [routeId, generation, producer]
      properties:
        routeId: {type: string, format: uuid}
        generation: {type: integer, minimum: 1, maximum: 9007199254740991}
        producer: {$ref: '#/components/schemas/Producer'}
    CheckpointSummary:
      type: object
      additionalProperties: false
      required: [manifest, revision, routes, stateSha256, stateBytes]
      description: 프레임·상태 원문·자격 정보가 없는 최대 64KiB 검증 metadata
      properties:
        revision: {$ref: '#/components/schemas/CheckpointCounter'}
        stateSha256: {$ref: '#/components/schemas/CheckpointHash'}
        stateBytes: {type: integer, minimum: 0, maximum: 1048576}
        manifest:
          type: object
          additionalProperties: false
          required: [version, inputs, outputs, limits]
          properties:
            version: {const: 1}
            inputs:
              type: array
              maxItems: 16
              items: {$ref: '#/components/schemas/CheckpointManifestBinding'}
            outputs:
              type: array
              maxItems: 16
              items: {$ref: '#/components/schemas/CheckpointManifestBinding'}
            limits:
              type: object
              additionalProperties: false
              required: [max_frames, max_buffer_bytes, max_state_bytes]
              properties:
                max_frames: {type: integer, minimum: 1, maximum: 4096}
                max_buffer_bytes: {type: integer, minimum: 1, maximum: 67108864}
                max_state_bytes: {type: integer, minimum: 1, maximum: 1048576}
        routes:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [routeId, received, committed, ended]
            properties:
              routeId: {type: string, format: uuid}
              received: {$ref: '#/components/schemas/CheckpointCounter'}
              committed: {$ref: '#/components/schemas/CheckpointCounter'}
              ended: {type: boolean}
    CheckpointReceipt:
      type: object
      additionalProperties: false
      required: [id, runId, taskId, attemptId, epoch, serviceProfileVersionId, previousCheckpointId, serial, revision, sha256, bytes, executionSha256, generationIds, versionId, summary, createdAt]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        attemptId: {type: string, format: uuid}
        epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        serviceProfileVersionId: {type: string, format: uuid}
        previousCheckpointId: {type: [string, 'null'], format: uuid}
        serial: {$ref: '#/components/schemas/CheckpointCounter'}
        revision: {$ref: '#/components/schemas/CheckpointCounter'}
        sha256: {$ref: '#/components/schemas/CheckpointHash'}
        bytes: {type: integer, minimum: 1, maximum: 75497472}
        executionSha256: {$ref: '#/components/schemas/CheckpointHash'}
        generationIds: {$ref: '#/components/schemas/CheckpointGenerations'}
        versionId: {type: string, minLength: 1, maxLength: 1024}
        summary: {$ref: '#/components/schemas/CheckpointSummary'}
        createdAt: {type: string, format: date-time}
    CheckpointReceiptResponse:
      type: object
      additionalProperties: false
      required: [checkpoint]
      properties:
        checkpoint: {$ref: '#/components/schemas/CheckpointReceipt'}
    CheckpointUploadResponse:
      oneOf:
      - {$ref: '#/components/schemas/CheckpointReceiptResponse'}
      - type: object
        additionalProperties: false
        required: [upload]
        properties:
          upload:
            type: object
            additionalProperties: false
            required: [url, headers, expiresAt]
            properties:
              url: {type: string, format: uri}
              headers: {type: object, additionalProperties: {type: string}}
              expiresAt: {type: string, format: date-time}
    CheckpointLatestResponse:
      oneOf:
      - type: object
        additionalProperties: false
        required: [checkpoint]
        properties:
          checkpoint: {type: 'null'}
      - {$ref: '#/components/schemas/CheckpointDownloadResponse'}
    CheckpointDownloadResponse:
      type: object
      additionalProperties: false
      required: [checkpoint, download]
      properties:
        checkpoint: {$ref: '#/components/schemas/CheckpointReceipt'}
        download:
          type: object
          additionalProperties: false
          required: [url, expiresAt]
          properties:
            url: {type: string, format: uri}
            expiresAt: {type: string, format: date-time}
    DeviceBindingRequest:
      type: object
      additionalProperties: false
      required:
      - epoch
      - generationId
      properties:
        epoch: &id003
          type: integer
          minimum: 1
          maximum: 9007199254740991
        generationId: *id001
    RunnerBindingRequest:
      type: object
      additionalProperties: false
      required:
      - epoch
      - podUid
      - generationId
      properties:
        epoch: *id003
        podUid: *id001
        generationId: *id001
    Producer:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        - deviceId
        - sessionId
        - epoch
        properties:
          kind:
            const: DEVICE_SESSION
          deviceId: *id001
          sessionId: *id001
          epoch: *id003
      - type: object
        additionalProperties: false
        required:
        - kind
        - attemptId
        - epoch
        properties:
          kind:
            const: TASK_ATTEMPT
          attemptId: *id001
          epoch: *id003
    Consumer:
      type: object
      additionalProperties: false
      required:
      - attemptId
      - epoch
      properties:
        attemptId: *id001
        epoch: *id003
    Mqtt:
      type: object
      additionalProperties: false
      required:
      - host
      - port
      - tls
      - caPem
      - clientId
      - username
      - password
      - framesTopic
      - acksTopic
      properties:
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        tls:
          type: boolean
        caPem:
          type: string
          maxLength: 131072
        clientId:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 64
          format: password
        framesTopic:
          type: string
          maxLength: 160
        acksTopic:
          type: string
          maxLength: 160
    Binding:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - generationId
      - routeId
      - runId
      - generation
      - direction
      - producer
      - consumer
      - mediaType
      - maxPayloadBytes
      - serverTime
      - leaseUntil
      - mqtt
      properties:
        apiVersion:
          const: edgeai.stream-assignment/v1
        generationId: *id001
        routeId: *id001
        runId: *id001
        generation: *id003
        direction:
          enum:
          - PRODUCER
          - CONSUMER
        producer:
          $ref: '#/components/schemas/Producer'
        consumer:
          $ref: '#/components/schemas/Consumer'
        mediaType:
          type: string
          maxLength: 127
        maxPayloadBytes:
          type: integer
          minimum: 1
          maximum: 262144
        serverTime:
          type: string
          format: date-time
        leaseUntil:
          type: string
          format: date-time
        mqtt:
          $ref: '#/components/schemas/Mqtt'
    DeviceHeartbeatRequest:
      type: object
      additionalProperties: false
      required:
      - epoch
      - generationId
      - sequence
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        generationId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    RunnerHeartbeatRequest:
      type: object
      additionalProperties: false
      required:
      - epoch
      - podUid
      - generationId
      - sequence
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        podUid: &id004
          type: string
          format: uuid
        generationId: *id004
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    Heartbeat:
      type: object
      additionalProperties: false
      required:
      - sequence
      - assignment
      properties:
        sequence:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        assignment:
          $ref: '#/components/schemas/Binding'
    DeviceRoutesRequest:
      type: object
      additionalProperties: false
      required:
      - epoch
      - runId
      - limit
      - offset
      properties:
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        runId:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
    DeviceRouteGeneration:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - state
      - leaseUntil
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        state:
          enum:
          - PREPARING
          - ACTIVE
          - FENCED
          - CLOSED
        leaseUntil:
          type: string
          format: date-time
          description: 메타데이터 기준 시각. 이 값만으로 전송 권한을 얻을 수 없음
    DeviceRouteMetadata:
      type: object
      additionalProperties: false
      required:
      - routeId
      - sourcePort
      - consumerTaskId
      - consumerPort
      - sourceMode
      - mediaType
      - maxPayloadBytes
      - generation
      properties:
        routeId:
          type: string
          format: uuid
        sourcePort:
          type: string
          minLength: 1
          maxLength: 128
        consumerTaskId:
          type: string
          format: uuid
        consumerPort:
          type: string
          minLength: 1
          maxLength: 128
        sourceMode:
          enum:
          - LIVE
          - REPLAY
          - SYNTHETIC
        mediaType:
          type: string
          maxLength: 127
        maxPayloadBytes:
          type: integer
          minimum: 1
          maximum: 262144
        generation:
          oneOf:
          - $ref: '#/components/schemas/DeviceRouteGeneration'
          - type: 'null'
    DeviceRoutesResponse:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - runId
      - runState
      - deviceId
      - sessionId
      - epoch
      - items
      - limit
      - offset
      - nextOffset
      properties:
        apiVersion:
          const: edgeai.device-routes/v1
        runId:
          type: string
          format: uuid
        runState:
          enum:
          - PENDING
          - RUNNING
          - CANCELLING
          - CANCELLED
          - FAILED
          - SUCCEEDED
        deviceId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DeviceRouteMetadata'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
        nextOffset:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 1000000
          - type: 'null'
          description: 다음 페이지 시작 위치. 마지막 페이지는 null
